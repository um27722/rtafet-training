<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTAFET Training — ศูนย์ปฏิบัติการทางอวกาศ ทอ.</title>
<link rel="icon" href="logo.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f2347; --navy2:#1a3566; --sky:#2f6fb5; --sky-soft:#e8f0fa;
  --gold:#c9a227; --ink:#16202e; --muted:#5d6b7e; --line:#dde3ec; --bg:#f4f6f9; --card:#fff;
  --ok:#1f8a5b; --ok-soft:#e5f5ec; --bad:#c2410c; --bad-soft:#fdeee6; --warn:#a16207;
  --r:12px; --sans:'IBM Plex Sans Thai',system-ui,sans-serif; --serif:'Source Serif 4',Georgia,serif;
}
*{box-sizing:border-box}
:root{color-scheme:light}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
button{font:inherit;cursor:pointer;color:var(--ink)}
.wrap{max-width:1080px;margin:0 auto;padding:20px 18px 60px}
header.top{background:var(--navy);color:#fff}
header.top .wrap{padding:14px 18px;display:flex;align-items:center;gap:14px}
.crest{width:38px;height:38px;border-radius:50%;background:linear-gradient(140deg,var(--gold),#8a6d12);display:grid;place-items:center;font-weight:700;color:var(--navy);font-size:13px;letter-spacing:.5px;flex:none}
.top h1{font-size:17px;margin:0;font-weight:600}
.top .sub{font-size:12.5px;opacity:.75}
.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:500}
.pill.gold{background:rgba(201,162,39,.18);color:#f3dc8b}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
h2{font-size:20px;margin:0 0 6px}
h3{font-size:16px;margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
table.spec{width:100%;border-collapse:collapse;font-size:14px}
table.spec td,table.spec th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.spec th{font-weight:600;color:var(--muted);font-size:12.5px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 16px;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--sky)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy2)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mode{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:10px}
.mode:hover{border-color:var(--sky);background:var(--sky-soft)}
.mode b{display:block;font-size:15.5px}
.mode span{font-size:13.5px;color:var(--muted)}
input.text{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:6px 0 4px}
input.text:focus{outline:2px solid var(--sky);border-color:transparent}
/* exam */
.exambar{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff}
.exambar .wrap{padding:10px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:17px;background:rgba(255,255,255,.1);padding:4px 12px;border-radius:8px}
.timer.low{background:#b45309}
.progress{flex:1;min-width:120px;height:6px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);width:0}
.partlabel{font-size:13px;opacity:.85}
.qlayout{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
.qlayout.split{grid-template-columns:1fr 1fr}
@media(max-width:860px){.qlayout.split{grid-template-columns:1fr}}
.stimulus{font-family:var(--serif);font-size:16.5px;line-height:1.7;white-space:pre-wrap;max-height:68vh;overflow:auto}
.stimulus.box{border:2px solid var(--ink);border-radius:6px;padding:16px;background:#fffdf6}
.stimulus.email{font-family:var(--sans);font-size:15px;background:#fbfcfe}
.stimtitle{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--muted);margin-bottom:8px}
.qnum{font-size:13px;color:var(--muted);font-weight:500;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lvl{font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--sky-soft);color:var(--sky)}
.qtext{font-family:var(--serif);font-size:18px;margin:10px 0 14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;font-family:var(--serif);font-size:16.5px;color:var(--ink)}
.opt:hover{border-color:var(--sky)}
.opt:disabled{color:var(--ink);cursor:default}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--muted)}
.opt.sel{border-color:var(--navy);background:var(--sky-soft)}
.opt.sel .k{background:var(--navy);border-color:var(--navy);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.audio{display:flex;align-items:center;gap:12px;background:var(--sky-soft);border-radius:10px;padding:12px 14px;margin:8px 0 14px}
.play{width:46px;height:46px;border-radius:50%;border:none;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none}
.play:disabled{background:#9aa6b8}
.play svg{width:20px;height:20px}
.wave{display:flex;gap:3px;align-items:center;height:22px}
.wave i{width:3px;background:var(--sky);border-radius:2px;height:6px}
.speaking .wave i{animation:w 0.9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes w{0%,100%{height:5px}50%{height:20px}}
.explain{border-left:4px solid var(--gold);background:#fffaf0;padding:12px 14px;border-radius:0 10px 10px 0;margin-top:12px;font-size:15px}
.script{font-family:var(--serif);font-size:15px;background:#f7f8fb;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin-top:10px;white-space:pre-wrap}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.navrow .btn{white-space:nowrap}
@media(max-width:560px){.navrow .btn{padding:10px 12px;font-size:14.5px}.top .pill{display:none}}
.palette{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;margin-top:18px}
@media(max-width:700px){.palette{grid-template-columns:repeat(10,1fr)}}
.palette button{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:11.5px;padding:5px 0;color:var(--muted)}
.palette button.done{background:var(--navy);color:#fff;border-color:var(--navy)}
.palette button.cur{outline:2px solid var(--gold);outline-offset:1px}
.palette button.r{background:var(--ok);border-color:var(--ok);color:#fff}
.palette button.x{background:var(--bad);border-color:var(--bad);color:#fff}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
/* results */
.scorehero{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:760px){.scorehero{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .v{font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.stat.hero{background:var(--navy);color:#fff;border-color:var(--navy)}
.stat.hero .l{color:#c8d3e6}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:40px 1fr 104px;gap:10px;align-items:center;font-size:14px}
.bar .t{height:14px;background:#eef1f6;border-radius:7px;overflow:hidden;position:relative}
.bar .t i{display:block;height:100%;background:var(--sky);border-radius:7px}
.bar .t .th{position:absolute;left:60%;top:-3px;bottom:-3px;width:2px;background:var(--gold)}
.bar .n{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13.5px}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.rev{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;background:#fff}
.rev .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.tag{font-size:12px;border-radius:6px;padding:1px 8px;font-weight:600}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.no{background:var(--bad-soft);color:var(--bad)} .tag.sk{background:#f1f3f6;color:var(--muted)}
.note{font-size:13px;color:var(--muted);background:#f1f4f8;border-radius:10px;padding:10px 12px}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.45);display:grid;place-items:center;z-index:20;padding:18px}
.modal .card{max-width:440px;width:100%}
.hide{display:none!important}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist td,.hist th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.hist th{color:var(--muted);font-weight:600;font-size:12.5px}
.right{text-align:right}

.livebar{display:flex;align-items:center;gap:12px;background:#fff7e0;border:1px solid #f0d27a;border-radius:10px;padding:10px 14px;margin:8px 0 14px}
.livebar .dot{width:10px;height:10px;border-radius:50%;background:#dc2626;animation:blink 1s infinite;flex:none}
@keyframes blink{50%{opacity:.25}}
.cd{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;min-width:44px;text-align:center;color:var(--navy)}
.big{font-size:64px;font-weight:700;line-height:1;color:var(--navy);font-variant-numeric:tabular-nums}
.peers{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.peer{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.peer.done{background:var(--ok-soft);border-color:#b7e2c9}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:#fff;padding:6px 12px;font-size:14px}
.seg button.on{background:var(--navy);color:#fff}
.palette button:disabled{opacity:.35;cursor:not-allowed}
.waiting{text-align:center;padding:50px 20px}
select.text,textarea.text{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink);margin:6px 0 4px}
textarea.text{min-height:150px;resize:vertical}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.setcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;color:var(--ink);cursor:pointer}
.setcard .sn{font-weight:700;font-size:15px}.setcard .ss{font-size:12px;color:var(--muted)}
.setcard.on{border:2px solid var(--navy);background:#e9eef8;box-shadow:0 0 0 3px rgba(23,48,94,.12)}.setcard.on .sn{color:var(--navy)}
.setnow{margin-top:10px;padding:8px 12px;border-radius:10px;background:#0f2347;color:#fff;font-size:14px}.setnow b{color:#f3d27a}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <img src="logo.png" alt="ศูนย์ปฏิบัติการทางอวกาศกองทัพอากาศ" style="width:58px;height:58px;flex:none;object-fit:contain;margin:-6px 0">
  <div><h1>RTAFET Training</h1><div class="sub">ศูนย์ปฏิบัติการทางอวกาศกองทัพอากาศ · ระบบฝึกและติดตามผลภาษาอังกฤษ</div></div>
  <div class="spacer"></div>
  <button class="pill gold" id="roleLabel" style="border:none;cursor:pointer;font:inherit;font-size:12.5px"></button>
</div></header>
<div id="app"></div>
<div id="modal" class="modal hide"><div class="card" id="modalBody"></div></div>
<script>
/* ================= data ================= */

 the past.","Automation should be removed from modern cockpits.","Automation improves safety but creates risks that call for a new human–machine relationship.","Accidents are mainly caused by poorly designed displays."],"w":["rooted less in laziness = ไม่ได้เกิดจากความขี้เกียจ","บทความบอกชัดว่า not to abandon automation",null,"การออกแบบจอแสดงผลเป็นแค่หนึ่งในวิธีแก้ — แคบเกินไป"],"a":2,"ex":"ย่อหน้าแรกและสุดท้าย: ระบบอัตโนมัติดี แต่มีความเสี่ยงแฝง ต้องปรับความสัมพันธ์คน–เครื่อง (ไม่ใช่เลิกใช้)","sk":"RM","fc":null},{"n":95,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pAuto","q":"According to paragraph 2, automation bias mainly results from __________.","o":["poorly trained designers","frequent system failures","the mental effort required to stay alert while monitoring reliable systems","pilots' lack of motivation"],"w":["ไม่ได้กล่าวถึงการฝึกผู้ออกแบบ","ระบบล้มเหลวนานๆ ครั้ง (rare failures)",null,"rooted less in laziness — ไม่ใช่เรื่องแรงจูงใจ"],"a":2,"ex":"rooted less in laziness than in the economics of attention ... vigilance, being cognitively costly","sk":"RD","fc":null},{"n":96,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pAuto","q":"The word \"atrophied\" in paragraph 2 is closest in meaning to __________.","o":["weakened","been tested","been recorded","improved"],"w":[null,"ไม่เข้ากับบริบท","ไม่เข้ากับบริบท","through disuse = ไม่ได้ใช้ จึงไม่ดีขึ้น"],"a":0,"ex":"atrophy = ฝ่อ เสื่อมลงเพราะไม่ได้ใช้ (through disuse)","sk":"RC","fc":null},{"n":97,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pAuto","q":"Why does the author describe the situation in paragraph 3 as paradoxical?","o":["Investigators lacked important information.","Crews always distrust automation.","Greater reliability can make failures more catastrophic.","Reliable systems never fail."],"w":["ลูกเรือมีข้อมูลครบ","ลูกเรือเชื่อระบบมากเกินไป ไม่ใช่ไม่ไว้ใจ",null,"บทความพูดถึง rare failures แปลว่าระบบล้มเหลวได้"],"a":2,"ex":"the more reliable a system appears, the more catastrophic its rare failures may become","sk":"RI","fc":null},{"n":98,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pAuto","q":"What did accident investigators repeatedly find?","o":["Crews had the necessary information but did not act on it.","Pilots ignored the automation completely.","The automation had never failed before.","Crews had no access to the right information."],"w":[null,"กลับกัน — ลูกเรือเชื่อว่าระบบรู้ดีกว่า","ไม่ได้กล่าวถึง","possessed all the information = มีข้อมูลครบ"],"a":0,"ex":"crews possessed all the information needed ... but failed to act on it","sk":"RD","fc":null},{"n":99,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pAuto","q":"The word \"scrutinise\" in paragraph 2 is closest in meaning to __________.","o":["approve","repair","examine carefully","ignore"],"w":["ไม่เข้ากับบริบท","ไม่เข้ากับบริบท",null,"ไม่เข้ากับ every output (ตรวจทุกผลลัพธ์)"],"a":2,"ex":"scrutinise = ตรวจพิจารณาอย่างละเอียด","sk":"RC","fc":null},{"n":100,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pAuto","q":"The phrase \"calibrated trust\" most nearly refers to __________.","o":["trusting only experienced pilots","trusting machines completely","refusing to rely on automation","trusting a system only as far as its reliability justifies"],"w":["ไม่ได้กล่าวถึงประสบการณ์นักบิน","neither blind faith = ไม่ใช่เชื่อแบบสุดใจ","nor reflexive suspicion = ไม่ใช่ระแวงไว้ก่อน",null],"a":3,"ex":"neither blind faith ... nor reflexive suspicion ... but an informed judgement of when, and how far, it can be relied upon","sk":"RC","fc":null}],"groups":{"c57":{"title":"Conversation","script":[["W","Flight Lieutenant Arun, how did the joint exercise with the Australian team go?"],["M","Overall it went smoothly. Communication was a bit tricky at first because of the radio terminology, but by day two we had agreed on standard phrases, and things improved a lot."],["W","Good to hear. Is there anything we should change next time?"],["M","I'd recommend a short terminology workshop before the exercise starts."]]},"t59":{"title":"Talk","script":[["N","Good morning, everyone. This is a reminder that, due to scheduled runway resurfacing, all training flights originally planned for Thursday will be relocated to Wing 4 at Takhli. Crews are to report to Hangar 2 no later than 0600 hours for transport. Personal equipment must be packed and labeled the night before, as there will be no opportunity to return to quarters once the convoy departs. Any crew member with a medical exemption should notify the duty officer by Wednesday noon."]]},"adBike":{"title":"ADVERTISEMENT","kind":"ad","text":"FOR SALE\nMountain bike — 2 years old\nVery good condition\nOnly 3,500 baht\n\nCall Nok: 081-555-0142\n(after 6 p.m. only)"},"ntPool":{"title":"NOTICE","kind":"notice","text":"FITNESS CENTER\n\nFrom 1–15 December the swimming pool will be closed for cleaning.\nThe gym and tennis courts will remain open as usual.\n\nWe apologise for any inconvenience.\n— Welfare Section"},"emClub":{"title":"E-MAIL","kind":"email","text":"To: All section staff\nFrom: Sqn. Ldr. Pim\nSubject: English lunch-hour club\n\nDear all,\n\nStarting next Tuesday, we will run an English conversation club in Meeting Room 3 from 12:15 to 12:50. Each week, one member will prepare a five-minute talk on a work-related topic, followed by an open discussion.\n\nAttendance is voluntary, but anyone planning to take the RTAFET this year is strongly encouraged to join. Please bring your own lunch. To sign up, reply to this e-mail by Friday.\n\nPim"},"pSleep":{"title":"Passage","kind":"passage","text":"Many people think that sleeping less is a good way to get more work done. However, research shows the opposite. When adults sleep fewer than six hours a night, their ability to concentrate drops, and they make more mistakes. This is especially dangerous for people who drive, operate machines or work night shifts.\n\nExperts recommend seven to nine hours of sleep for most adults. They also suggest going to bed at the same time every night, avoiding coffee in the late afternoon, and keeping phones out of the bedroom. Some military units now include sleep education in their training programs, because a well-rested soldier is safer and more effective than a tired one."},"pOpen":{"title":"Passage","kind":"passage","text":"Every year, the air base near the city opens its gates to the public for a family day. Visitors can look inside transport aircraft, watch a parachute demonstration and talk to pilots and engineers. Last year more than 15,000 people attended, so this year the organizers have added a second entrance and more shuttle buses from the city center.\n\nEntry is free, but visitors must show an ID card at the gate. Large bags, drones and pets are not allowed. Food stalls run by local communities will be open all day."},"pDebris":{"title":"Passage","kind":"passage","text":"Since the launch of Sputnik in 1957, humans have placed thousands of objects into orbit around the Earth. Many of these are no longer functional: dead satellites, spent rocket stages and fragments created by collisions and explosions. Together they form what is commonly called space debris.\n\nThe problem is not merely one of quantity but of speed. In low Earth orbit, objects travel at around 7.5 kilometres per second, so even a fragment the size of a coin can strike with the energy of a small explosive. Operators of active satellites must therefore monitor the paths of nearby objects and, when the risk of collision becomes too high, perform avoidance manoeuvres. Each manoeuvre consumes fuel, which shortens the operational life of the satellite.\n\nScientists have long warned of a scenario known as the Kessler syndrome, in which collisions generate more debris, which in turn causes further collisions. To mitigate this risk, many space agencies now require that satellites be moved into a 'graveyard' orbit or brought down to burn up in the atmosphere at the end of their missions. Several companies are also testing technologies to capture and remove existing debris, although the cost of such missions remains a significant obstacle."},"pAuto":{"title":"Passage","kind":"passage","text":"As cockpits have become increasingly automated, aviation safety has improved dramatically; yet the very systems designed to reduce human error have introduced subtler risks of their own. Chief among them is what researchers term automation bias: the tendency of operators to defer to computer-generated information even when it conflicts with other cues or with their own judgement.\n\nThe phenomenon is rooted less in laziness than in the economics of attention. A pilot monitoring a system that has behaved flawlessly for hundreds of hours has little reason to scrutinise its every output, and vigilance, being cognitively costly, gradually erodes. When the system eventually fails — often in an unusual situation that its designers did not anticipate — the crew may be slow to notice, and slower still to intervene, precisely because their manual skills have atrophied through disuse.\n\nParadoxically, then, the more reliable a system appears, the more catastrophic its rare failures may become. Accident investigators have repeatedly found that crews possessed all the information needed to recognise a problem but failed to act on it, having assumed that the automation 'knew better'.\n\nThe remedy, most experts agree, is not to abandon automation but to redesign the relationship between human and machine. Training programmes now emphasise regular manual flying practice, and interface designers are experimenting with displays that communicate a system's level of confidence rather than presenting its outputs as unqualified facts. The goal is calibrated trust: neither blind faith in the machine nor reflexive suspicion of it, but an informed judgement of when, and how far, it can be relied upon."}}},{"id":"P02","title":"ชุดฝึก 2","kind":"practice","items":[{"n":1,"p":"L1","lv":"A1","sub":"Question","s":"What's your name?","g" null}],"groups":{"cMed":{"title":"Conversation","script":[["M","Good morning. I'd like to see the doctor, please. I've had a bad cough for a week."],["W","Do you have an appointment?"],["M","No, I don't. Is that a problem?"],["W","Dr Prasert is fully booked this morning, but Dr Anong can see you at eleven fifteen. Please bring your ID card and fill in this form while you wait."]]},"tTour":{"title":"Talk","script":[["N","Welcome to the Royal Thai Air Force Museum. Our tour today will last about ninety minutes. We'll start in Hall One, where you can see aircraft from the Second World War, and then move outside to the helicopter area. Photography is allowed everywhere except in the engine room, because the flash can damage some of the older parts. At the end of the tour, there's a gift shop near the main entrance, and the café on the second floor offers a ten per cent discount to visitors with a museum ticket."]]},"adFlat":{"title":"ADVERTISEMENT","kind":"ad","text":"ROOM FOR RENT\n\nOne-bedroom apartment, 10 minutes from the base main gate\nFurnished · Air-conditioned · Wi-Fi included\n\n6,500 baht per month (water & electricity extra)\nMinimum stay: 6 months\nNo pets\n\nCall Khun Suda: 081-234-5678 (after 5 p.m.)"},"ntGym":{"title":"NOTICE","kind":"notice","text":"BASE GYM – NEW RULES\n\nFrom 1 March:\n• Please wipe down machines after use.\n• Bring a towel. Towels are no longer provided.\n• Children under 15 must be with an adult.\n• The gym will close at 9 p.m. instead of 10 p.m.\n\nThank you for your cooperation.\n— Sports Office"},"pTea":{"title":"Passage","kind":"passage","text":"Tea is the second most popular drink in the world after water. It was first used in China thousands of years ago, mainly as a medicine. Later, traders carried tea to other countries, and it became popular in Japan, India and Britain.\n\nToday there are many kinds of tea, such as green tea, black tea and oolong tea. They all come from the same plant. The difference is how the leaves are dried and prepared after they are picked."},"pTeam":{"title":"Passage","kind":"passage","text":"Many managers think that the best teams are made of the most talented people. However, a large study of workplace teams found that talent was less important than expected. The most successful teams were those in which members felt safe to speak up, ask questions and admit mistakes without fear of being embarrassed.\n\nResearchers call this 'psychological safety'. In teams without it, people often keep quiet about problems, so small errors grow into large ones. Leaders can build psychological safety by listening carefully, thanking people for raising concerns and admitting their own mistakes."},"pRain":{"title":"Passage","kind":"passage","text":"Every year, large parts of Thailand depend on the monsoon to fill rivers, reservoirs and rice fields. Yet rainfall has become increasingly unpredictable. Some years bring long dry spells in the middle of the rainy season; others bring sudden, intense storms that cause flash floods in areas that rarely flooded before.\n\nTo cope with this uncertainty, the Royal Rainmaking and Agricultural Aviation Department has used cloud seeding for several decades. Aircraft, including some operated with the support of the Air Force, release substances such as salt or dry ice into suitable clouds. These particles encourage water droplets to form and grow heavy enough to fall as rain.\n\nCloud seeding cannot create rain from a clear sky; it only works when clouds with enough moisture are already present. Its effectiveness is also difficult to measure, since no one can know for certain how much rain would have fallen without it. Nevertheless, many farmers regard the operations as a vital source of support during droughts, and the programme remains popular."},"pAuto":{"title":"Passage","kind":"passage","text":"Automation has long promised to make flying safer by removing the possibility of human error. Modern airliners can climb, cruise, navigate and even land with minimal intervention, and accident rates have fallen considerably as these systems have spread. Yet investigators have identified an unexpected side effect: when automation fails or behaves in an unexpected way, crews sometimes struggle to take over.\n\nThe problem is partly one of skill. Pilots who rarely fly manually may find that their hand-flying abilities have deteriorated precisely when they are needed most. It is also a problem of awareness. Monitoring a system that almost never fails is tedious, and attention naturally drifts. When an alert finally sounds, the crew must first work out what the automation was doing before they can decide how to respond — a delay that can prove critical.\n\nAirlines and air forces have responded by requiring more regular manual-flying practice and by redesigning training to focus on recognising and recovering from unusual situations. Some designers go further, arguing that cockpits should keep pilots actively engaged rather than reducing them to passive observers. The aim, as one researcher put it, is not less automation, but automation that works with people rather than in place of them."}}},{"id":"P03","title":"ชุดฝึก 3","kind":"practice","items":[{"n":1,"p":"L1","lv":"A1","sub":"Question","s":"How are you today?","g":null,"q":null,"o":["I'm from Chiang Mai.","I'm a pilot.","I'm very well, thanks.","I'm twenty."],"w":["ตอบว่ามาจากไหน","ตอบอาชีพ",null,"ตอบอายุ"],"a":2,"ex":"How are you? = สบายดีไหม","sk":"LQ","fc":null},{"n":2,"p":"L1","lv":"A1","sub":"Statement","s":"I get up at six every morning.","g":null,"q":null,"o":["The speaker goes to bed at six.","The speaker wakes up early.","The speaker sleeps until noon.","The speaker gets up at seven."],"w":["get up ≠ go to bed",null,"ตรงข้าม","ตัวเลขผิด"],"a":1,"ex":"get up = ตื่นนอน","sk":"LP","fc":null},{"n":3,"p":"L1","lv":"A1","sub":"Question","s":"What's that in your hand?","g":null,"q":null,"o":["It's a key.","It's my hand.","It's very big.","I'm fine."],"w a named person with a deadline","sk":"RI","fc":null},{"n":100,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pDeb","q":"What is the author's overall view of the after-action review?","o":["It is valuable but difficult to do well.","It should be replaced by ordinary debriefs.","It is useless.","It works perfectly in every unit."],"w":[null,"ตรงข้าม","บทความเห็นคุณค่า","ยอมรับว่าทำได้ยาก"],"a":0,"ex":"designed to avoid this ... In practice, difficult to achieve","sk":"RI","fc":"Author's attitude"}],"groups":{"cBike":{"title":"Conversation","script":[["W","Hi, I'm calling about the motorbike you're selling. Is it still available?"],["M","Yes, it is. It's a 2021 model, and I've only ridden it about eight thousand kilometres."],["W","The advert says thirty-five thousand baht. Would you take thirty-two?"],["M","I can do thirty-three, but that's my lowest price. You can come and see it at the base housing area after five today."]]},"tLib":{"title":"Talk","script":[["N","Good morning, everyone, and welcome to the base library. Before you start using our services, here are a few things you should know. You can borrow up to five books at a time for two weeks. If you need a book for longer, you can renew it once online. Our computer room is on the first floor, and you'll need your ID card to log in. Please remember that food and drinks are not allowed anywhere in the library, but there's a water fountain near the stairs. Finally, the library is open until eight p.m. on weekdays, but it closes at noon on Saturdays."]]},"adBike":{"title":"ADVERTISEMENT","kind":"ad","text":"FOR SALE\n\nHonda Click 125i motorbike (2021)\nRed · 8,000 km · one owner\nNew tyres and battery\n\nPrice: 35,000 baht\n\nCall Sgt. Thana: 089-765-4321\nViewing: base housing area, after 5 p.m."},"ntCanteen":{"title":"NOTICE","kind":"notice","text":"CANTEEN – CHANGES FROM 1 JULY\n\n• Breakfast will be served from 6:00 to 8:00 a.m. (not 6:30–8:30).\n• A vegetarian dish will be available every day.\n• Cash is no longer accepted. Please pay by QR code or staff card.\n• The canteen will be closed on public holidays.\n\nComments? Speak to the Welfare Office."},"pBts":{"title":"Passage","kind":"passage","text":"The BTS Skytrain opened in Bangkok in December 1999. Before that, most people travelled by car or bus, and traffic jams were a daily problem. The Skytrain runs above the roads, so it is not affected by traffic.\n\nToday the BTS carries hundreds of thousands of passengers every day. Trains come every few minutes during busy times. Many people now leave their cars at home and take the train to work, especially in the city centre."},"pVol":{"title":"Passage","kind":"passage","text":"Volunteering means giving your time to help others without being paid. People volunteer in many ways: teaching children, cleaning beaches, helping at hospitals or supporting people after floods.\n\nVolunteers do not only help other people; they also help themselves. Studies show that people who volunteer regularly often feel happier and less stressed. They also learn new skills and meet people they would never have met otherwise. For young people, volunteer experience can even help when applying for jobs or university places."},"pHeat":{"title":"Passage","kind":"passage","text":"Thailand's hot season can be dangerous for anyone who works outdoors, including ground crews on air bases. When the body cannot lose heat fast enough, its temperature rises, and a person may suffer from heat exhaustion. Typical signs include heavy sweating, weakness, headache and feeling sick. If nothing is done, this can develop into heat stroke, a medical emergency in which the body stops sweating and the person may become confused or lose consciousness.\n\nPrevention is relatively simple but requires discipline. Workers should drink water regularly, even before they feel thirsty, and take short breaks in the shade. Supervisors can plan the heaviest tasks for the early morning or late afternoon and make sure that new personnel, who are not yet used to the heat, are given lighter duties during their first week.\n\nAnyone who shows signs of heat illness should be moved to a cool place immediately. Loosening clothing and applying cool, wet cloths can lower body temperature. If the person is confused or stops sweating, medical help must be called at once."},"pDeb":{"title":"Passage","kind":"passage","text":"Most organisations hold a debrief after a major exercise or operation, but many of these sessions achieve little. Participants list what went well, mention a few problems, and then return to work without changing anything. The same mistakes appear in the next exercise, and the debrief becomes a ritual rather than a tool for improvement.\n\nThe military 'after-action review' was designed to avoid this. It asks four simple questions: What was supposed to happen? What actually happened? Why was there a difference? What will we do differently next time? Crucially, it is meant to focus on the task rather than on individuals. Rank is set aside during the discussion, so that a junior airman can point out an error made by a senior officer without fear.\n\nIn practice, this ideal is difficult to achieve. Senior participants may dominate the conversation, and junior ones may hesitate to criticise their superiors in public. Experienced facilitators therefore often ask junior personnel to speak first, and they insist that every lesson identified is assigned to a named person with a deadline. Without that final step, they argue, a lesson has merely been observed, not learned."}}},{"id":"P04","title":"ชุดฝึก 4","kind":"practice","items":[{"n":1,"p":"L1","lv":"A1","sub":"Question","s":"What's your favourite food?","g":null,"q":null,"o":["At the canteen.","I'm not hungry.","I love green curry.","Every day."],"w":["ตอบสถานที่","ไม่ได้ตอบ",null,"ตอบความถี่"],"a":2,"ex":"favourite = ชอบที่สุด","sk":"LQ","fc":null},{"n":2,"p":"L1","lv":"A1","sub":"Statement","s":"The cat is sleeping under the table ":"The training session ran over by thirty minutes.","g":null,"q":null,"o":["The session finished half an hour late.","The session lasted thirty minutes.","The session ended early.","The session was cancelled."],"w":[null,"run over = เกินเวลา","ตรงข้าม","ไม่ได้ยกเลิก"],"a":0,"ex":"run over = เกินเวลา","sk":"LI","fc":"run over"},{"n":31,"p":"L1","lv":"B2","sub":"Statement","s":"Not until he left the unit did we realise how much he had done.","g":null,"q":null,"o":["He did nothing.","They always appreciated his work.","He never left the unit.","They only appreciated his work after he left."],"w":["ตรงข้าม","ตรงข้าม","ขัดกับ left",null],"a":3,"ex":"Not until ... did = เพิ่ง...เมื่อ","sk":"LG","fc":"Not until inversion"},{"n":32,"p":"L1","lv":"B2","sub":"Statement","s":"She takes after her father; she's also very calm under pressure.","g":null,"q":null,"o":["She is different from her father.","She follows her father everywhere.","She resembles her father.","She takes care of her father."],"w":["ตรงข้าม","แปลตรงตัว",null,"take after ≠ take care of"],"a":2,"ex":"take after = เหมือน (พ่อแม่)","sk":"LI","fc":"take after"},{"n":33,"p":"L1","lv":"B2","sub":"Statement","s":"There's every chance the inspection will be postponed.","g":null,"q":null,"o":["The inspection will definitely happen on time.","A delay is very likely.","There is no inspection.","The inspection has already happened."],"w":["ตรงข้าม",null,"มีการตรวจ","ยังไม่เกิด"],"a":1,"ex":"there's every chance = มีโอกาสสูงมาก","sk":"LN","fc":"every chance"},{"n":34,"p":"L1","lv":"B2","sub":"Statement","s":"I'm all ears — tell me what happened.","g":null,"q":null,"o":["The speaker doesn't want to know.","The speaker is ready to listen carefully.","The speaker can't hear.","The speaker has big ears."],"w":["ตรงข้าม",null,"ตรงข้าม","แปลตรงตัว"],"a":1,"ex":"all ears = ตั้งใจฟัง","sk":"LI","fc":"all ears"},{"n":35,"p":"L1","lv":"C1","sub":"Statement","s":"The project fell through at the last minute.","g":null,"q":null,"o":[" board","sk":"RD","fc":null},{"n":98,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pMentor","q":"The phrase 'taken for granted' in paragraph 3 means __________.","o":["accepted without thinking about it","borrowed","given as a gift","forgotten completely"],"w":[null,"ไม่ใช่ความหมาย","แปลตรงตัว","เกินจริง"],"a":0,"ex":"take for granted = ถือเป็นเรื่องปกติโดยไม่ได้คิด","sk":"RC","fc":null},{"n":99,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pMentor","q":"What is 'reverse mentoring'?","o":["Supervisors evaluating mentors","Junior staff advising senior leaders","Mentors leaving the organisation","Mentoring that ends early"],"w":["ไม่ใช่ความหมาย",null,"ไม่ใช่ความหมาย","ไม่ใช่ความหมาย"],"a":1,"ex":"junior staff advise senior leaders","sk":"RD","fc":null},{"n":100,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pMentor","q":"Which statement would the author most likely agree with?","o":["Mentoring always works.","Only mentees benefit from mentoring.","Mentors should be chosen randomly.","Both mentors and mentees can benefit from mentoring."],"w":["results vary widely","the benefits are not one-sided","ควรให้มีทางเลือก",null],"a":3,"ex":"Interestingly, the benefits are not one-sided.","sk":"RI","fc":null}],"groups":{"cGym":{"title":"Conversation","script":[["W","Hi, I'd like to join the base fitness class. When does it meet?"],["M","There are two groups: Monday and Wednesday at six in the morning, or Tuesday and Thursday at five in the evening."],["W","The evening group is better for me. Do I need to bring anything?"],["M","Just water and a towel. Oh, and you need to pass a short health check at the medical centre before your first class."]]},"tVisit":{"title":"Talk","script":[["N","Good afternoon, everyone. Thank you for coming to our open day at the Space Operations Center. In a moment, we'll divide you into three groups of about fifteen people. Each group will visit the satellite control room, the ground station antennas and our small exhibition. The tour lasts about one hour. Please note that mobile phones must be switched off inside the control room, and photography is not permitted there. Afterwards, refreshments will be served in the main hall, where our engineers will be happy to answer your questions."]]},"adClass":{"title":"ADVERTISEMENT","kind":"ad","text":"LEARN THAI COOKING!\n\nEvery Saturday, 9 a.m. – 12 p.m.\nOfficers' Club kitchen\n\nCook three dishes each week and eat them for lunch!\nAll ingredients provided.\n\n4 classes: 2,000 baht\nSingle class: 600 baht\nMaximum 12 students per class\n\nBook at the Officers' Club reception."},"ntPark":{"title":"NOTICE","kind":"notice","text":"CAR PARK CLOSURE\n\nThe main car park behind Building 1 will be closed\nfrom 3 to 14 June for resurfacing.\n\nDuring this time, please use the sports field car park.\nA free shuttle bus will run every 15 minutes from 7:00 to 9:00 a.m.\nand from 4:00 to 6:00 p.m.\n\nVisitors with disabilities may still park at the front of Building 1."},"pElephant":{"title":"Passage","kind":"passage","text":"The elephant is the national animal of Thailand. In the past, elephants were used in wars and to carry wood from the forests. Today, there are about 3,000 wild elephants in Thailand and a similar number living with people.\n\nEvery year on 13 March, Thailand celebrates National Elephant Day. People give fruit to elephants, and there are special events in many provinces to teach people how to protect them."},"pSleep":{"title":"Passage","kind":"passage","text":"Shift work is common in the military, hospitals and airports. Working at night goes against the body's natural clock, which is set by daylight. As a result, many shift workers sleep badly and feel tired during the day.\n\nThere are ways to reduce these problems. Experts suggest keeping the bedroom dark and quiet, using the same sleep times even on days off when possible, and avoiding caffeine for several hours before sleep. A short nap of twenty minutes before a night shift can also improve alertness. Managers can help by planning shifts that move forward — from morning to afternoon to night — rather than backwards."},"pPlastic":{"title":"Passage","kind":"passage","text":"Every year, millions of tonnes of plastic enter the world's oceans. Much of it comes from rivers in Asia, where waste collection has not kept up with rapid economic growth. Once in the sea, plastic does not disappear. Instead, sunlight and waves break it into smaller and smaller pieces, known as microplastics, which are now found everywhere from the deepest ocean trenches to Arctic ice.\n\nMarine animals often mistake plastic for food. Turtles eat plastic bags that look like jellyfish, and seabirds feed bottle caps to their chicks. Microplastics have also entered the human food chain through fish and salt, although scientists are still studying what effect this has on health.\n\nThailand has taken several steps to address the problem, including a ban on free plastic bags in major stores, which began in 2020. Environmental groups welcome such measures but argue that they are not enough. They say the most effective solution is to reduce the production of single-use plastic, rather than relying on recycling, since only a small proportion of plastic is ever recycled."},"pMentor":{"title":"Passage","kind":"passage","text":"Most organisations recognise that new members learn faster with the help of an experienced colleague. Formal mentoring programmes, in which a junior person is paired with a more senior one for a set period, have therefore become common in both business and the armed forces. Their results, however, vary widely.\n\nResearch suggests that the most successful mentoring relationships share several features. First, both participants have some choice in the pairing; relationships imposed from above tend to remain polite but shallow. Second, the mentor is not the mentee's direct supervisor. When the same person both guides and evaluates, the junior partner may hide difficulties rather than discuss them openly. Third, the relationship has a clear purpose, such as preparing for a promotion board or developing a particular skill, rather than a vague aim of 'general development'.\n\nInterestingly, the benefits are not one-sided. Mentors frequently report that explaining their decisions forces them to reflect on habits they had long taken for granted, and that their mentees expose them to new technologies and perspectives. Some organisations have formalised this through 'reverse mentoring', in which junior staff advise senior leaders on topics such as digital tools or the expectations of younger personnel."}}},{"id":"P05","title":"ชุดฝึก 5","kind":"practice","items":[{"n":1,"p":"L1","lv":"A1","sub":"Question","s":"What is your phone number?","g":null,"q":null,"o":["It's a new phone.","I'm on the phone.","It's 081-555-2468.","It's in my bag."],"w":["ไม่ได้บอกเบอร์","ไม่ได้ตอบ",null,"ตอบตำแหน่ง"],"a":2,"ex":"phone number = เบอร์โทร","sk":"LQ","fc":null},{"n":2,"p":"L1","lv":"A1","sub":"Statement","s":"I live in a small house with my wife and two sons.","g":null,"q":null,"o":["The speaker lives alone.","The house is very big.","The speaker has two daughters.","The speaker has two children."],"w":["อยู่กับครอบครัว","small house","sons = ลูกชาย",null],"a":3,"ex":"two sons = ลูกชายสองคน","sk":"LP","fc":null},{"n":3,"p":"L1","lv":"A1","sub":"Question","s":"Where is the toilet?","g":null,"q":null,"o":["It's clean.","It's at the end of the corridor.","Yes, it is.","At ten o'clock."],"w":["ไม่ได้บอกตำแหน่ง",null,"ไม่ได้ตอบ","ตอบเวลา"],"a":1,"ex":"Where = ที่ไหน","sk":"LQ","fc":null},{"n":4,"p":"L1","lv":"A1","sub":"Statement","s":"The bus leaves at eight fifteen.","g":null,"q":null,"o":["The bus arrives at 8:15.","The bus departs at 8:15.","The bus left at 8:00.","The bus leaves at 8:50."],"w":["leaves ≠ arrives",null,"ตัวเลขผิด","fifteen ≠ fifty"],"a":1,"ex":"eight fifteen = 8:15","sk":"LP","fc":"-teen vs -ty"},{"n":5,"p":"L1","lv":"A1","sub":"Question","s" ew terminal","a small regional airport","a type of aircraft","a central airport where many flights connect"],"w":["ไม่ใช่ความหมาย","ตรงข้าม","ไม่ใช่ความหมาย",null],"a":3,"ex":"hub = ศูนย์กลาง","sk":"RC","fc":null},{"n":92,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pAirport","q":"Why do supporters prefer a single main airport?","o":["Airlines and transfer passengers benefit from having flights in one place.","Passengers prefer long queues.","It is cheaper to build.","U-Tapao is too far from the sea."],"w":[null,"ไม่สมเหตุสมผล","ไม่ได้กล่าวถึง","ไม่ได้กล่าวถึง"],"a":0,"ex":"airlines prefer to concentrate ... where passengers can transfer easily","sk":"RI","fc":null},{"n":93,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pAirport","q":"Which statement is NOT supported by the passage?","o":["A third runway has been completed.","Queues were a common complaint.","Expansion is now complete and no more is planned.","The airport opened in 2006."],"w":["ถูก","ถูก",null,"ถูก"],"a":2,"ex":"Further expansion is planned","sk":"RT","fc":null},{"n":94,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pRs","q":"What is the main idea of the passage?","o":["Satellites can prevent disasters.","Satellite imagery helps disaster response, but people must use it well.","Ground teams are no longer needed.","Optical satellites are better than radar."],"w":["ไม่ได้กล่าวถึง",null,"ไม่ได้กล่าวถึง","ตรงข้าม — เมฆบัง"],"a":1,"ex":"Technology is only one link in the chain.","sk":"RM","fc":null},{"n":95,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pRs","q":"Why are optical satellites limited during floods?","o":["They cannot see water.","They only work at night.","They cannot see through clouds.","They are too far away."],"w":["ไม่ได้กล่าวถึง","ตรงข้าม",null,"ไม่ได้กล่าวถึง"],"a":2,"ex":"they cannot see through clouds","sk":"RD","fc":null},{"n":96,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pRs","q":"Why is flooding relatively easy to map with radar?","o":["Radar can measure rainfall."," "Let me check. There's a seat on the Saturday flight at nine forty, but there's a change fee of five hundred baht."],["M","That's fine. Is the baggage allowance the same?"],["W","Yes, twenty kilograms. Your new ticket will be sent to your e-mail within an hour."]]},"tFire":{"title":"Talk","script":[["N","Good morning, everyone. Today's safety training is about using fire extinguishers. Remember the word PASS. P means pull the pin. A means aim at the base of the fire, not at the flames. S means squeeze the handle. And the last S means sweep from side to side. Most extinguishers last only about ten to fifteen seconds, so if the fire is bigger than a waste-paper bin, do not try to fight it. Leave the building and call the fire department. After lunch, each of you will practise with a real extinguisher outside Hangar 2."]]},"adLaptop":{"title":"ADVERTISEMENT","kind":"ad","text":"LAPTOP FOR SALE\n\n14-inch laptop, 2023 model\n16 GB memory · 512 GB storage\nBattery lasts about 8 hours\nSmall scratch on the cover\n\n18,000 baht (new price 29,900)\nCharger and bag included\n\nContact Flt. Sgt. Wichai, Building 4, Room 210\nLINE: wichai.rtaf"},"ntLib":{"title":"NOTICE","kind":"notice","text":"BASE LIBRARY – HOLIDAY HOURS\n\nDuring the Songkran holiday (12–16 April):\n• The library will be CLOSED on 13, 14 and 15 April.\n• On 12 and 16 April it will open from 9 a.m. to 1 p.m.\n• Books due during the holiday can be returned on 17 April without a fine.\n• The online e-book service will be available as usual.\n\nHappy Songkran!"},"pSong":{"title":"Passage","kind":"passage","text":"Songkran is the Thai New Year. It is celebrated every year from 13 to 15 April, during the hottest time of the year. Traditionally, people pour water gently over the hands of older family members to show respect and ask for their blessing.\n\nToday, Songkran is also famous for its water fights. In cities such as Bangkok and Chiang Mai, thousands of people fill the streets with water guns and buckets. Many Thais who work in the city travel home to their families in the provinces, so the roads are very busy during the holiday."},"pApp":{"title":"Passage","kind":"passage","text":"Language-learning apps have become very popular. They are cheap or free, and learners can use them anywhere — on the bus, in a queue or during a lunch break. Many apps use games, points and daily reminders to keep users practising.\n\nHowever, research shows that apps work best for vocabulary and basic grammar. They are less useful for speaking and listening to natural conversation. Experts suggest using an app for about fifteen minutes a day, but also finding chances to speak with real people, for example by joining a conversation club or talking with foreign colleagues."},"pAirport":{"title":"Passage","kind":"passage","text":"Suvarnabhumi Airport opened in 2006 and was designed to handle about 45 million passengers a year. Within a few years, however, the number of travellers had already passed that figure, and the terminal often became crowded, especially during holiday periods. Long queues at check-in and immigration became a common complaint.\n\nTo deal with the problem, the airport has been expanded in several stages. A new satellite terminal, connected to the main building by an automatic underground train, opened in 2023, and a third runway was completed in the same period. Further expansion is planned to raise capacity to more than 100 million passengers a year.\n\nSome critics argue that it would be better to spread traffic more evenly among Thailand's airports, including Don Mueang and U-Tapao, rather than continuing to enlarge a single hub. Supporters of expansion reply that airlines prefer to concentrate their international flights in one place, where passengers can transfer easily."},"pRs":{"title":"Passage","kind":"passage","text":"When a major flood or earthquake strikes, one of the first questions emergency managers ask is simply: where is the damage, and how bad is it? Ground teams may take days to reach remote areas, and roads and bridges may be destroyed. Satellite imagery can provide an answer within hours.\n\nOptical satellites take pictures much like an ordinary camera, but they cannot see through clouds — a serious limitation, since floods usually occur during periods of heavy cloud. Radar satellites, by contrast, send out their own microwave signals and record the echoes, allowing them to observe the ground day or night and in almost any weather. Water appears very dark in radar images, which makes flooded areas relatively easy to map.\n\nUnder an international agreement known as the International Charter 'Space and Major Disasters', space agencies and satellite operators provide imagery free of charge to countries affected by large disasters. Thailand has both received and contributed data under such arrangements. Nevertheless, experts emphasise that images are only useful if trained analysts can interpret them quickly and if the results reach the people making decisions on the ground. Technology, they note, is only one link in the chain."}}},{"id":"P06","title":"ชุดฝึก 6","kind":"practice","items":[{"n":1,"p":"L1","lv":"A1","sub":"Question","s":"What's your rank?","g":null,"q":null,"o":["I'm twenty-six.","I'm in Hangar 3.","I'm a flight sergeant.","I'm on duty."],"w":["ตอบอายุ","ตอบสถานที่",null,"ตอบสถานะ"],"a":2,"ex":"rank = ยศ","sk":"LQ","fc":null},{"n":2,"p":"L1","lv":"A1","sub":"Statement","s":"The aircraft is in the hangar.","g":null,"q":null,"o":["The aircraft is on the runway.","The aircraft is inside the hangar.","The aircraft is flying.","There is no aircraft."],"w":["in the hangar",null,"อยู่ในโรงเก็บ","ขัดกับประโยค"],"a":1,"ex":"hangar = โรงเก็บอากาศยาน","sk":"LP","fc":null},{"n":3,"p":"L1","lv":"A1","sub":"Question","s":"Which wing are you from?","g":null,"q":null,"o":["A big wing.","Wing 1, Korat.","I'm from the left wing.","I fly every day."],"w":["ไม่ได้ตอบ",null,"แปล wing ผิด","ไม่ได้ตอบ"],"a":1,"ex":"wing = g and keeping specialists","Learning physics"],"w":["ไม่ได้กล่าวถึง","not merely buying equipment",null,"เป็นส่วนหนึ่งของทักษะ"],"a":2,"ex":"Recruiting and retaining these specialists ... the greatest challenge","sk":"RD","fc":null},{"n":100,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pSpaceOps","q":"Why does the author mention English in paragraph 3?","o":["It is the language of physics.","It is needed to work with foreign partners.","It is required for promotion.","Satellites use English."],"w":["ไม่ได้กล่าวถึง",null,"ไม่ได้กล่าวถึง","ไม่ได้กล่าวถึง"],"a":1,"ex":"the English needed to cooperate with foreign partners","sk":"RI","fc":null}],"groups":{"cAtc":{"title":"Conversation","script":[["M","Don Mueang Tower, Thai Air Force two-one-five, ready for departure, runway two-one right."],["W","Thai Air Force two-one-five, hold short of runway two-one right. There's one aircraft on final approach."],["M","Holding short of two-one right, two-one-five."],["W","Two-one-five, after the landing traffic, line up and wait. Expect take-off in two minutes."]]},"tPreflight":{"title":"Talk","script":[["N","Good morning, crews. This is the briefing for today's training mission. Take-off is at zero eight hundred from runway two-one. You'll fly in a formation of four to the training area over the Gulf of Thailand. The weather is good, with a light westerly wind, but expect some cloud at around three thousand feet. Fuel for each aircraft is calculated for one hour and forty minutes, including a thirty-minute reserve. If any aircraft has a technical problem, it will return to base with its wingman. The debriefing will be held in Room 3 at eleven hundred."]]},"adSim":{"title":"ADVERTISEMENT","kind":"ad","text":"FLIGHT SIMULATOR OPEN DAY\n\nWing 2, Lop Buri · Saturday 8 March\n9:00 a.m. – 3:00 p.m.\n\nTry a 15-minute session in our training simulator!\nFor RTAF personnel and family members aged 12+\n\nFree of charge · Register at the gate\nSessions are limited — first come, first served\nNo photography inside the simulator building"},"ntHangar":{"title":"NOTICE","kind":"notice","text":"HANGAR 5 – SAFETY RULES\n\n• Hearing protection must be worn when engines are running.\n• No smoking within 50 metres of the hangar.\n• Mobile phones may not be used near fuel trucks.\n• Visitors must be escorted by a member of the maintenance team.\n• Report any fuel leak immediately to the duty supervisor (ext. 4410).\n\nBy order of the Chief of Maintenance"},"pRtaf":{"title":"Passage","kind":"passage","text":"The Royal Thai Air Force was officially established as a separate service on 9 April 1937, although Thai military aviation began much earlier, in 1913, when three Thai officers were sent to France to learn to fly. For this reason, Thailand is one of the oldest aviation nations in Asia.\n\nToday, 9 April is celebrated as Air Force Day. Many air bases hold ceremonies and air shows, and some open their gates to the public."},"pHadr":{"title":"Passage","kind":"passage","text":"The Air Force does not only defend the country's airspace. It also plays an important role in humanitarian assistance and disaster relief, often called HADR. After floods, storms or earthquakes, transport aircraft such as the C-130 can carry food, water, medicine and rescue teams quickly to affected areas.\n\nHelicopters are especially useful because they can land in small spaces and rescue people from rooftops or islands. In 2004, after the Indian Ocean tsunami, Thai aircraft flew hundreds of missions in the south of the country. Today, Air Force units regularly practise HADR operations with civilian agencies and with other countries' armed forces."},"pMaint":{"title":"Passage","kind":"passage","text":"Modern military aircraft spend far more time on the ground than in the air, and much of that time is spent in maintenance. For every hour of flight, a fighter may require several hours of inspection and repair. Maintenance is therefore one of the largest costs of operating an air force, and it has a direct effect on how many aircraft are available on any given day.\n\nTraditionally, parts were replaced according to a fixed schedule — for example, after a certain number of flight hours — whether or not they showed signs of wear. This approach is safe but wasteful, since many parts are removed while still in good condition. Increasingly, air forces are moving to 'condition-based' or 'predictive' maintenance. Sensors on the aircraft record vibration, temperature and other data, and computer programs analyse this information to identify parts that are likely to fail soon.\n\nThe benefits can be considerable: fewer unexpected breakdowns, lower costs and more aircraft ready to fly. However, the new approach depends on reliable data and on technicians who understand how to interpret it. Without these, warnings may be ignored, or perfectly good parts may still be replaced 'just in case'."},"pSpaceOps":{"title":"Passage","kind":"passage","text":"Until recently, space was seen mainly as a scientific frontier. Today, it is widely recognised as an operational domain, alongside land, sea, air and cyberspace. Satellites provide communication, navigation, weather information and imagery that modern forces depend on every day, often without noticing. A disruption to these services would affect not only military operations but also banking, transport and emergency services.\n\nFor this reason, many air forces, including Thailand's, have created dedicated space organisations. Their tasks typically include operating national satellites, monitoring the objects that pass over the country, and building awareness of potential threats such as collisions or interference. This last task, known as space domain awareness, relies on data from radars, telescopes and international partners, since no single country can observe every object in orbit.\n\nBuilding such capabilities is not merely a matter of buying equipment. It requires personnel with a rare combination of skills in physics, engineering, data analysis and operations, as well as the English needed to cooperate with foreign partners. Recruiting and retaining these specialists, many argue, is the greatest challenge facing new space units — greater, perhaps, than the technology itself."}}},{"id":"P07","title":"ชุดฝึก 7","kind":"practice","items":[{"n":1,"p":"L1","lv":"A1","sub":"Question","s":"What's your unit?","g":null,"q":null,"o":["It's a big unit.","I'm very well.","Since 2020.","I'm in the Space Operations Center."],"w":["บอกขนาด","ตอบ How are you","ตอบเวลา",null],"a":3,"ex":"unit = หน่วย","sk":"LQ","fc":null},{"n":2,"p":"L1","lv":"A1","sub":"Statement","s":"The control tower is next to the runway.","g":null,"q":null,"o":["The tower is beside the runway.","The tower is far from the runway.","The tower is on the runway.","There is no tower."],"w":[null,"ตรงข้าม","next to ≠ on","มี"],"a":0,"ex":"next to = ข้างๆ","sk":"LP","fc":null},{"n":3,"p":"L1","lv":"A1","sub":"Question","s":"Who is the duty officer today?","g":null,"q":null,"o":["At the gate.","Today is Monday.","It's a long day.","Flying Officer Mali."],"w":["ตอบสถานที่","ตอบวัน","ไม่ได้ตอบ",null],"a":3,"ex":"Who = ใคร","sk":"LQ","fc":null},{"n":4,"p":"L1","lv":"A1","sub":"Statement","s":"I'm a mechanic. I repair helicopters.","g":null,"q":null,"o":["The speaker fixes helicopters.","The speaker is a pilot.","The speaker sells helicopters.","The speaker flies helicopters."],"w":[null,"ไม่ใช่","ไม่ใช่","mechanic ≠ pilot"],"a":0,"ex":"mechanic = ช่าง","sk":"LP","fc":null},{"n":5,"p":"L1","lv":"A1","sub":"Question","s":"Is the canteen open now?","g":null,"q":null,"o":["Yes, it's a canteen.","No, it opens at eleven.","I'm hungry.","The food is good."],"w":["ไม่ได้ตอบ",null,"ไม่ได้ตอบ","ไม่ได้ตอบ"],"a":1,"ex":"Is ... open? → Yes/No + เวลา","sk":"LQ","fc":null},{"n":6,"p":"L1","lv":"A1","sub":"Statement","s":"There are three aircraft on the apron.","g":null,"q":null,"o":["The aircraft are flying.","There are thirteen aircraft ur satellite operations this month. The earth-observation satellite completed one hundred and twelve imaging tasks, mostly for flood monitoring in the northeast and for mapping forest fires in the north. On the twelfth, the satellite performed a small manoeuvre to avoid a piece of space debris that was predicted to pass within five hundred metres. The manoeuvre was successful and used very little fuel. Next month, we will begin training four new operators, so please send any questions about the training schedule to Flight Lieutenant Napat."]]},"adRun":{"title":"ADVERTISEMENT","kind":"ad","text":"AIR FORCE DAY MINI-MARATHON\n\nSunday 6 April · Start 5:30 a.m.\nRoute: around Don Mueang Air Base\n\n10.5 km: 400 baht\n5 km fun run: 250 baht (free for children under 10)\n\nAll runners receive a medal and a T-shirt.\nTop three in each age group win prizes.\n\nRegister online by 25 March."},"emDuty":{"title":"E-MAIL","kind":"email","text":"To: All officers, Operations Section\nFrom: Sqn Ldr Thanawat, Duty Roster Officer\nSubject: Duty roster for May\n\nDear all,\n\nThe duty roster for May is now on the shared drive. Please check your dates carefully.\n\nIf you need to swap a duty, you must find another officer of the same rank or higher to take your place and send me an e-mail with both names at least three days in advance. Swaps cannot be made on the day of the duty.\n\nPlease note that officers attending the English course from 12 to 23 May have not been given any duties during that period.\n\nThank you,\nSqn Ldr Thanawat"},"pDonMueang":{"title":"Passage","kind":"passage","text":"Don Mueang is one of the oldest airports in the world that is still in use. It opened in 1914 as a military airfield. Later, it also became Bangkok's main civil airport.\n\nWhen Suvarnabhumi Airport opened in 2006, most international flights moved there. Today, Don Mueang is busy again, mainly with low-cost airlines. The Royal Thai Air Force still uses part of the airport, and its headquarters is next to the runways."},"pFatigue":{"title":"Passage","kind":"passage","text":"Fatigue is a serious danger in aviation. A tired pilot or mechanic reacts more slowly, makes more mistakes and may not notice warning signs. Studies show that staying awake for about 18 hours affects performance in a similar way to drinking alcohol.\n\nFor this reason, air forces and airlines set limits on working hours. For example, a pilot may not fly more than a certain number of hours in a day or a week, and must have a minimum rest period between duties. However, rules alone are not enough. Personnel must also be honest about how tired they feel, and supervisors must accept that saying 'I'm too tired to fly safely' is a responsible decision, not a sign of weakness."},"pCyber":{"title":"Passage","kind":"passage","text":"When people think of attacks on computer systems, they often imagine skilled hackers breaking through firewalls. In reality, many successful attacks begin with something much simpler: a person being tricked. This is known as social engineering.\n\nThe most common form is 'phishing', in which an attacker sends an e-mail that appears to come from a trusted source, such as a bank, a colleague or a senior officer. The message may ask the reader to click a link, open an attachment or 'confirm' a password. Once the attacker has this information, they may be able to enter an organisation's network without needing any special technical skills.\n\nMilitary personnel are attractive targets because they may have access to sensitive information. Security experts recommend a few simple habits: check the sender's address carefully, be suspicious of messages that create a sense of urgency, never share passwords by e-mail or phone, and report anything unusual to the IT security team. As one expert put it, technology can block many attacks, but the last line of defence is usually a well-trained human being."},"pJoint":{"title":"Passage","kind":"passage","text":"Multinational air exercises such as Cope Tiger, held annually in Thailand with the participation of Singapore and the United States, have become an important part of regional defence cooperation. Over two weeks, hundreds of aircraft and thousands of personnel train together in scenarios ranging from air combat to humanitarian relief.\n\nThe tactical value of such exercises is obvious: crews practise procedures they could not easily rehearse at home, such as operating large mixed formations or working with unfamiliar control agencies. Less visible, but arguably just as important, are the personal and institutional relationships they create. Officers who have planned and flown together are more likely to pick up the phone to each other during a crisis, and staffs that understand one another's procedures can coordinate more quickly when time is short.\n\nSuch exercises are not without cost. They consume large amounts of fuel and flying hours, and they require months of planning. Critics occasionally question whether these resources might be better spent on national training. Supporters counter that in an era when almost any significant operation — from disaster relief to peacekeeping — is likely to be multinational, the ability to work smoothly with partners is not an optional extra but a core military skill."}}},{"id":"P08","title":"ชุดฝึก 8","kind":"practice","items":[{"n":1,"p":"L1","lv":"A1","sub":"Question","s":"Where is the Officers' Club?","g":null,"q":null,"o":["It's for officers.","At six o'clock.","It's very nice.","It's near the swimming pool."],"w":["ไม่ได้บอกตำแหน่ง","ตอบเวลา","ความเห็น",null],"a":3,"ex":"Where → ตำแหน่ง","sk":"LQ","fc":null},{"n":2,"p":"L1","lv":"A1","sub":"Statement","s":"The pilot is checking the aircraft before the flight.","g":null,"q":null,"o":["The flight has finished.","The pilot is sleeping.","The pilot is inspecting the aircraft.","The pilot is flying now."],"w":["before","ไม่ใช่",null,"ยังไม่บิน"],"a":2,"ex":"checking = กำลังตรวจ","sk":"LP","fc":null} ","q":"According to experts, long-term solutions depend on __________.","o":["more aircraft","cloud seeding alone","wearing masks","farming changes, law enforcement and international cooperation"],"w":["ไม่ใช่","ไม่ใช่","เป็นการรับมือระยะสั้น",null],"a":3,"ex":"changing farming practices, enforcing laws ... cooperating across borders","sk":"RD","fc":null},{"n":93,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pPm25","q":"The word 'trap' in paragraph 2 is closest in meaning to __________.","o":["catch animals","clean","hold in place","release"],"w":["ความหมายอื่น","ไม่ใช่",null,"ตรงข้าม"],"a":2,"ex":"trap = กักไว้","sk":"RC","fc":null},{"n":94,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pDeter","q":"What is the main argument of the passage?","o":["Nuclear weapons are the only deterrent.","Satellites should not be used by the military.","Deterrence by denial may work better in space than deterrence by punishment.","Deterrence no longer matters."],"w":["ตรงข้าม","ไม่ได้กล่าวถึง",null,"ตรงข้าม"],"a":2,"ex":"some analysts argue that 'deterrence by denial' may be more practical","sk":"RM","fc":null},{"n":95,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pDeter","q":"What does 'dual-use' mean in paragraph 2?","o":["Used by both civilian and military customers","Used twice","Having two engines","Built by two countries"],"w":[null,"แปลตรงตัว","ไม่ใช่","ไม่ใช่"],"a":0,"ex":"serving both civilian and military customers","sk":"RC","fc":null},{"n":96,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pDeter","q":"Why is attribution difficult in space?","o":["Satellites cannot be seen.","Countries share all their data.","Failures may come from interference, faults or space weather.","There are too few satellites."],"w":["ไม่ใช่","ตรงข้าม",null,"ตรงข้าม"],"a":2,"ex":"hard to determine whether ... deliberate interference, a technical fault or space weather","sk":"RD","fc":null},{"n":97,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pDeter","q":"Which is NOT given as an example of deterrence by denial?","o":["Building backup systems on the ground","Threatening to attack the opponent's satellites","Spreading capabilities across many small satellites","Training forces to operate without space services"],"w":["กล่าวถึง",null,"กล่าวถึง","กล่าวถึง"],"a":1,"ex":"การขู่โจมตีคือ deterrence by punishment","sk":"RT","fc":null},{"n":98,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pDeter","q":"The word 'credible' in paragraph 2 is closest in meaning to __________.","o":["secret","immediate","believable","expensive"],"w":["ไม่ใช่","ไม่ใช่",null,"ไม่ใช่"],"a":2,"ex":"credible = น่าเชื่อถือ","sk":"RC","fc":null},{"n":99,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pDeter","q":"According to the last paragraph, why might an opponent not attack?","o":["Because satellites are too expensive","Because of a treaty","Because the attack would achieve little","Because space is too far away"],"w":["ไม่ได้กล่าวถึง","ไม่ได้กล่าวถึง",null,"ไม่ได้กล่าวถึง"],"a":2,"ex":"An opponent who believes an attack will achieve little ... has less reason","sk":"RI","fc":null},{"n":100,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pDeter","q":"How has the concept of deterrence changed since the Cold War?","o":["It has been abandoned.","It is now used only for nuclear weapons.","It applies only to land forces.","It is now applied more broadly, including to space and cyberspace."],"w":["ไม่ใช่","ตรงข้าม","ไม่ใช่",null],"a":3,"ex":"Today, it is applied much more broadly","sk":"RD","fc":null}],"groups":{"cVisit":{"title":"Conversation","script":[["W","Squadron Leader Pongsak? I'm Major Lin from the Singapore Air Force. I'm here for the planning conference."],["M","Welcome to Thailand, Major. Did you have a good flight?"],["W","Yes, thank you, but my luggage is still at the airport. They said it would arrive this evening."],["M","No problem. I'll ask our driver to collect it and bring it to your hotel. The conference starts at nine tomorrow in the Officers' Club."]]},"tGripen":{"title":"Talk","script":[["N","Good morning. Welcome to Wing 7. Our wing operates the Gripen fighter, and our main task is the air defence of southern Thailand. We keep two aircraft on quick reaction alert twenty-four hours a day; they can be airborne within a few minutes of an order. The Gripen was chosen partly because it can operate from short runways and even from roads, and because it needs a relatively small maintenance team. After this briefing, you'll visit the alert hangar, but please remember that you must stay behind the yellow line at all times."]]},"adCourse":{"title":"ADVERTISEMENT","kind":"ad","text":"RTAF LANGUAGE CENTRE\nIntensive English for Overseas Courses\n\n8 weeks · Monday–Friday, 8:30 a.m. – 3:30 p.m.\nNext course starts 2 June\n\n• Listening & speaking practice with native teachers\n• Military briefing and presentation skills\n• Practice tests (ALCPT / ECL style)\n\nFor officers and NCOs selected for overseas training.\nMinimum entry score: 55\nApply through your unit before 15 May."},"ntIdcard":{"title":"NOTICE","kind":"notice","text":"NEW BASE ID CARDS\n\nAll personnel must collect a new electronic ID card by 30 September.\nOld cards will NOT open the gates after 1 October.\n\nWhere: Personnel Office, Building 2, ground floor\nWhen: Mon–Fri, 9:00–11:30 a.m. and 1:00–3:00 p.m.\nBring: your old card and one passport photo\n\nFamily members' cards will be issued from 1 October."},"pGripen":{"title":"Passage","kind":"passage","text":"The Gripen is a light fighter aircraft built in Sweden. The Royal Thai Air Force received its first Gripens in 2011. They are based at Wing 7 in Surat Thani.\n\nThe Gripen is smaller than many other modern fighters, but it carries modern radar and weapons. It is also designed to be easy to maintain: a small team can refuel and rearm it in a short time."},"pEnglish":{"title":"Passage","kind":"passage","text":"For members of the Royal Thai Air Force, English is not only a school subject but a professional tool. Pilots and air traffic controllers use English on the radio, maintenance technicians read manuals written in English, and officers attend courses and exercises with foreign partners.\n\nTo measure English ability, the Air Force uses its own test, as well as international tests such as the ALCPT. Scores are often required for promotion, overseas training and some special positions. Many personnel say that the hardest part is listening, especially to fast speakers with different accents. Regular practice — even fifteen minutes a day — is usually more effective than studying for many hours just before a test."},"pPm25":{"title":"Passage","kind":"passage","text":"Between January and April, many parts of northern and central Thailand suffer from serious air pollution. The main problem is PM2.5 — tiny particles less than 2.5 micrometres across, small enough to enter deep into the lungs and even the bloodstream. Long-term exposure is linked to heart disease, lung problems and other illnesses.\n\nThe causes are varied. In the north, much of the smoke comes from the burning of forests and agricultural waste, both in Thailand and in neighbouring countries. In Bangkok, traffic and industry also contribute. Weather plays an important role: during the cool, dry season, a layer of warm air often traps pollution close to the ground.\n\nThe Air Force has supported efforts to reduce the problem, for example by using aircraft to help fight forest fires and by assisting with cloud-seeding operations intended to increase rainfall. However, experts agree that long-term solutions depend on changing farming practices, enforcing laws against burning and cooperating across borders. In the meantime, they advise people to check air-quality reports and to wear proper masks when pollution is high."},"pDeter":{"title":"Passage","kind":"passage","text":"Deterrence — persuading a potential opponent that the costs of an action will outweigh its benefits — has long been central to military thinking. During the Cold War, the concept was associated primarily with nuclear weapons. Today, it is applied much more broadly, including to cyberspace and outer space, where the rules are less established and the boundary between peace and conflict is often unclear.\n\nIn space, deterrence faces particular difficulties. Many satellites are 'dual-use', serving both civilian and military customers, so an attack on one could have consequences far beyond the military sphere. Moreover, it can be hard to determine whether a satellite failure was caused by deliberate interference, a technical fault or space weather. Without reliable attribution, it is difficult to threaten a credible response, and deterrence loses much of its force.\n\nFor this reason, some analysts argue that 'deterrence by denial' may be more practical than 'deterrence by punishment'. Instead of promising retaliation, a state can make attacks less likely to succeed — by spreading capabilities across many small satellites, building backup systems on the ground, and training forces to operate when space services are degraded. An opponent who believes an attack will achieve little, the reasoning goes, has less reason to attempt it in the first place."}}}];

            ...grp.map(x=>["N","Question "+x.n+". "+x.q])];

  if (Array.isArray(item.s)) return [["N","Number "+item.n+"."], ...item.s, ["N", item.q]];

}

const estSec = lines => 1 + lines.reduce((a,[,t])=>a+t.split(/\s+/).length,0)/2.4;

function pickVoice(sp){
  const vs = speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)); if (!vs.length) return null;
  if (sp==="W") return vs.find(v=>/female|samantha|zira|susan|karen|jenny|aria|victoria/i.test(v.name))||vs[1%vs.length];
  if (sp==="M") return vs.find(v=>/daniel|david|alex|guy|mark|fred|male/i.test(v.name)&&!/female/i.test(v.name))||vs[2%vs.length];
  return vs.find(v=>/daniel|david|alex|guy|mark|fred|male/i.test(v.name)&&!/female/i.test(v.name))||vs.find(v=>/en-US/i.test(v.lang))||vs[0];
}
async function say(lines){
  if (TTS) {
    try { audioEngine="claude"; await TTS.speak(lines.map(([sp,t])=>({text:t, voice:VOICE[sp]||"buttery", language:"en", rate:0.95}))); return "ok"; }
    catch(e) { const c=e&&e.code; if (c==="viewer_stopped") return "stopped"; if (c==="rate_limited"){ await sleep(1500); return say(lines); } TTS=null; }
  }
  if ("speechSynthesis" in window && speechSynthesis.getVoices().length) {
    audioEngine="browser";
    return new Promise(res=>{ speechSynthesis.cancel();
      lines.forEach(([sp,t],i)=>{ const u=new SpeechSynthesisUtterance(t); u.lang="en-US"; u.rate=0.92; const v=pickVoice(sp); if(v) u.voice=v;
        if(i===lines.length-1){ u.onend=()=>res("ok"); u.onerror=()=>res("ok"); } speechSynthesis.speak(u); }); });
  }
  audioEngine="none"; state.noAudio = true; await sleep(estSec(lines)*1000); return "ok";
}

/* ---------- listening engine: real pace (≈30 นาที) or fast drill ---------- */
function buildUnits(){
  const units=[], done=new Set(); let last=null;
  for (const it of LISTEN){
    if (it.p!==last){ last=it.p; units.push({type:"dir", part:it.p, first:it.n, lines:[["N",PARTS[it.p].say]]}); }
    if (it.g){ if(done.has(it.g)) continue; done.add(it.g); const ns=LISTEN.filter(x=>x.g===it.g).map(x=>x.n); units.push({type:"q", ns, lines:linesFor(it)}); }
    else units.push({type:"q", ns:[it.n], lines:linesFor(it)});
  }
  return units;
}
function makeEngine(opt, hooks){   // opt: {pace:"real"|"fast", gap, audio:true|false}
  const E = { paused:false, cancelled:false, cur:null, stage:null, gapLeft:0, units: buildUnits(),
    async wait(){ while(E.paused && !E.cancelled) await sleep(150); },
    async countdown(sec){ E.gapLeft=sec; hooks.tick&&hooks.tick(E); let last=Math.ceil(sec);
      while(E.gapLeft>0 && !E.cancelled){ await sleep(200); if(!E.paused){ E.gapLeft=Math.max(0,E.gapLeft-0.2); const c=Math.ceil(E.gapLeft); if(c!==last){ last=c; hooks.tick&&hooks.tick(E);} } } },
    set(n,stage,extra){ E.cur=n; E.stage=stage; E.extra=extra||{}; hooks.item&&hooks.item(E); },
    async run(){
      E.set(null,"intro"); await E.countdown(3);
      for (const u of E.units){
        if (E.cancelled) return; await E.wait();
        const t0 = Date.now();
        if (u.type==="dir"){ E.set(u.first,"dir"); if(opt.audio) await say(u.lines); else await sleep(estSec(u.lines)*1000); if(E.cancelled) return; await E.countdown(2); continue; }
        E.set(u.ns[0],"speak",{ns:u.ns, unit:u});
        if (opt.audio) await say(u.lines); else await sleep(estSec(u.lines)*1000);
        if (E.cancelled) return;
        const used = (Date.now()-t0)/1000;
        const per = opt.gap + (opt.pace==="fast" && u.ns[0]>50 ? 2 : 0);
        for (const n of u.ns){ await E.wait(); E.set(n,"gap",{ns:u.ns, len:per}); await E.countdown(per); if(E.cancelled) return; }
      }
      if (!E.cancelled){ E.set(null,"done"); hooks.done&&hooks.done(E); }
    },
    stop(){ E.cancelled=true; stopAudio(); } };
  return E;
}
function estListenMin(pace, gap){ const us=buildUnits(); let t=3; us.forEach(u=>{ t += u.type==="dir" ? estSec(u.lines)+2 : estSec(u.lines)+u.ns.length*(gap+(pace==="fast"&&u.ns[0]>50?2:0)); }); return Math.round(t/60); }
