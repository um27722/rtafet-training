      <p class="small"><a href="https://www.bbc.co.uk/learningenglish/thai/home" target="_blank" rel="noopener">BBC Learning English (ไทย)</a></p>
      <p class="small"><a href="https://dlielc.edu/testing/ALCPT_Handbook_2025.pdf" target="_blank" rel="noopener">ALCPT Handbook (DLIELC)</a> · <a href="https://dlielc.edu/ecl-faq/" target="_blank" rel="noopener">ECL FAQ (DLIELC)</a></p></div></div>`;
  }
  return `<div class="wrap"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px"><h2 style="flex:1;margin:0">📖 คลังความรู้</h2>
    <div class="tabs" style="margin:0">${tabs.map(([k,t])=>`<button data-ltab="${k}" class="${L.tab===k?"on":""}">${t}</button>`).join("")}</div></div><div class="card">${body}</div></div>`;
}

const ERRS={bad_pin:"PIN ไม่ถูกต้อง",bad_code:"รหัสหน่วยไม่ถูกต้อง",locked:"ใส่ PIN ผิดหลายครั้ง ระบบล็อกชั่วคราว 15 นาที (หรือให้ผู้ติวรีเซ็ต)",duplicate:"มีชื่อนี้ในรายการแล้ว — กลับไปเลือกชื่อจากรายการ",bad_pin_format:"PIN ต้องเป็นตัวเลข 6 หลัก",network:"เชื่อมต่ออินเทอร์เน็ตไม่ได้",no_member:"ไม่พบรายชื่อนี้",too_many:"ส่งผลถี่เกินไป ลองใหม่อีกครั้ง",bad_set:"ไฟล์ชุดสอบไม่ถูกต้อง (ต้องมี 100 ข้อ)"};
const errTH = e => ERRS[e&&e.message] || ("เกิดข้อผิดพลาด ("+(e&&e.message||"?")+")");
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- Store → Supabase (คง interface เดิม) ---------- */
Object.assign(Store,{
  roster(){ return clone(Cloud.roster); },
  saveRoster(r){   // เทียบกับข้อมูลเดิมแล้วส่งเฉพาะที่เปลี่ยน (ใช้เฉพาะผู้ติว)
    const old=Object.fromEntries(Cloud.roster.map(m=>[m.id,m])), now=Object.fromEntries(r.map(m=>[m.id,m])), T=Cloud.tok(), jobs=[], adds=[];
    r.forEach(m=>{ const o=old[m.id]; if(!o){ adds.push({rank:m.rank,first:m.first,last:m.last,unit:m.unit||"",type:m.type||"",note:m.note||""}); return; }
      const p={}; if(!!o.star!==!!m.star) p.star=!!m.star; if((o.type||"")!==(m.type||"")) p.type=m.type||""; if(!!o.pending!==!!m.pending) p.pending=!!m.pending; if((o.cert||"")!==(m.cert||"")||(o.cert_note||"")!==(m.cert_note||"")){ p.cert=m.cert||""; p.cert_note=m.cert_note||""; }
      if(Object.keys(p).length) jobs.push(Cloud.rpc("rt_tutor_update_member",{p_token:T,p_id:m.id,p_patch:p})); });
    Cloud.roster.forEach(o=>{ if(!now[o.id]) jobs.push(Cloud.rpc("rt_tutor_update_member",{p_token:T,p_id:o.id,p_patch:{delete:true}})); });
    if(adds.length) jobs.push(Cloud.rpc("rt_tutor_add_members",{p_token:T,p_rows:adds}));
    Cloud.roster=clone(r.filter(m=>old[m.id]));
    Promise.all(jobs).then(()=>Cloud.loadTutor()).then(()=>render()).catch(e=>alertModal("บันทึกไม่สำเร็จ: "+errTH(e)));
  },
  attempts(){ return Cloud.attempts; },
  addAttempt(a){ const x=Object.assign({},a); Cloud.attempts.push(x); delete x._pending;
    Cloud.rpc("rt_save_attempt",{p_token:Cloud.tok(),p_data:Object.assign({},a,{memberId:undefined})}).then(()=>{ state.saveMsg="✓ บันทึกผลเข้าประวัติแล้ว"; render(); })
      .catch(e=>{ state.saveMsg="⚠️ บันทึกผลไม่สำเร็จ ("+errTH(e)+")"; const q=JSON.parse(Cloud.get("outbox")||"[]"); q.push(a); Cloud.set("outbox",JSON.stringify(q)); render(); }); },
  tutorPin(){ return null; },
  resetPin(id){ Cloud.rpc("rt_tutor_update_member",{p_token:Cloud.tok(),p_id:id,p_patch:{reset_pin:true}}).then(()=>Cloud.loadTutor()).then(()=>{ render(); alertModal("รีเซ็ต PIN แล้ว — ให้เจ้าตัวตั้ง PIN ใหม่ตอนเข้าระบบครั้งถัดไป"); }).catch(e=>alertModal(errTH(e))); },
  vmarks(){ return Cloud.vmarks; },
  setVmark(id,w,v){ if(v==null) delete Cloud.vmarks[w]; else Cloud.vmarks[w]=v; if(state.user&&state.user.role==="student") Cloud.rpc("rt_set_vmark",{p_token:Cloud.tok(),p_word:w,p_mark:v||""}).catch(()=>{}); },
  toggleStar(id){ const m=Cloud.roster.find(x=>x.id===id); if(!m) return; m.star=!m.star; Cloud.rpc("rt_tutor_update_member",{p_token:Cloud.tok(),p_id:id,p_patch:{star:m.star}}).catch(e=>alertModal(errTH(e))); },
  clear(){}, _s(){}, _g(n,d){ return d; }
});
async function flushOutbox(){ const q=JSON.parse(Cloud.get("outbox")||"[]"); if(!q.length) return; const left=[];
  for(const a of q){ try{ await Cloud.rpc("rt_save_attempt",{p_token:Cloud.tok(),p_data:Object.assign({},a,{memberId:undefined})}); }catch(e){ left.push(a); } }
  Cloud.set("outbox",left.length?JSON.stringify(left):null); }

/* ---------- DB / ROOM adapters ให้โค้ดห้องสอบเดิมใช้ Supabase ---------- */
const snap = d => ({exists:d!=null, data:()=>d, docs:[]});
DB = {
  doc(path){ return {
    async get(){ if(path==="rooms/current") return snap(await Cloud.rpc("rt_room_get",{p_token:Cloud.tok()}));
      if(path==="rooms/paper") return snap(await Cloud.rpc("rt_room_paper",{p_token:Cloud.tok()}));
      return snap(null); },
    async set(v){ const T=Cloud.tok();
      if(path==="rooms/current") return Cloud.rpc("rt_room_set",{p_token:T,p_state:v});
      if(path==="rooms/paper") return v&&v.set ? Cloud.rpc("rt_room_set",{p_token:T,p_state:null,p_paper:v}) : Cloud.rpc("rt_room_set",{p_token:T,p_state:null,p_clear_paper:true});
      if(path.startsWith("examsets/")) return Cloud.rpc("rt_tutor_put_examset",{p_token:T,p_set:v}); },
    onSnapshot(fn){ let last=""; const poll=async()=>{ if(!Cloud.tok()||!(state.view==="lobby"||(state.view==="exam"&&state.session&&state.session.mode==="room"))) return;
        try{ const d=await Cloud.rpc("rt_room_get",{p_token:Cloud.tok()}); const k=JSON.stringify(d); if(k!==last){ last=k; if(d&&d.sid) fn(snap(d)); } }catch(e){} };
      const t=setInterval(poll,4000); return ()=>clearInterval(t); } }; },
  collection(name){ return { async get(){ if(name==="examsets"){ const l=await Cloud.rpc("rt_tutor_examsets",{p_token:Cloud.tok()}); return {docs:(l||[]).map(x=>({id:x.id,data:()=>x}))}; } return {docs:[]}; } }; }
};
let sbClient=null, sbChan=null; const roomH={}; let peersFn=null, myPresence=null;
function sbRealtime(){
  if(sbChan || !window.supabase || !Cloud.tok()) return;
  try{
    sbClient = sbClient || window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:false}});
    sbChan = sbClient.channel("rtafet-room",{config:{broadcast:{self:false}, presence:{key:(state.user&&state.user.id)||("T"+Math.random().toString(36).slice(2,7))}}});
    sbChan.on("broadcast",{event:"exam"},({payload})=>{ if(roomH.exam) roomH.exam(payload); });
    sbChan.on("presence",{event:"sync"},()=>{ const s=sbChan.presenceState(); peers=Object.values(s).map(a=>({state:a[a.length-1]})); if(peersFn) peersFn(peers); });
    sbChan.subscribe(st=>{ if(st==="SUBSCRIBED" && myPresence) sbChan.track(myPresence); });
  }catch(e){ sbChan=null; }
}
ROOM = {
  on(ev,fn){ roomH[ev]=fn; }, emit(ev,d){ if(sbChan) sbChan.send({type:"broadcast",event:ev,payload:d}); },
  presence(o){ myPresence=o; if(sbChan) try{ sbChan.track(o); }catch(e){} }, onPeers(fn){ peersFn=fn; }
};
UID=null; TTS=null;
saveRemote = function(){ /* ผลสอบบันทึกผ่าน Store.addAttempt แล้ว */ };
listenRoom();

/* ---------- views: login with unit code / tutor tools / join room ---------- */
const _loginView=loginView;

  if(state.signup) return signupView();
  if(!Cloud.code) return `<div class="wrap"><div class="grid2"><div class="card"><h2>เข้าสู่ระบบ</h2>
      <p class="small muted" style="margin-top:0">ใส่ <b>รหัสหน่วย</b> (ขอจากผู้ติว) เพื่อเปิดรายชื่อกำลังพล — ใส่ครั้งเดียว เครื่องนี้จะจำไว้</p>
      <input class="text" id="ucIn" placeholder="รหัสหน่วย" autocomplete="off"><div class="small" id="ucMsg" style="color:var(--bad);min-height:20px">${esc(Cloud.err||"")}</div>

      <div class="small" id="tMsg" style="color:var(--bad);min-height:20px"></div><button class="btn primary" id="tGo">เข้าแดชบอร์ดผู้ติว</button></div></div></div>`;
  return _loginView().replace(/<div class="note" style="margin-top:16px"><b>🧪 ต้นแบบ[\s\S]*?id="demoReset"[^<]*<\/button><\/div><\/div>/,
    `<p class="small muted" style="margin-top:14px">รหัสหน่วยของเครื่องนี้: <b>${esc(Cloud.code)}</b> · <a href="#" id="ucForget">เปลี่ยน</a></p>`);
};
const _studentHome=studentHome;
studentHome=function(){ return _studentHome().replace(/<button class="mode" disabled style="opacity:\.55"><b>👥 เข้าห้องสอบรวม<\/b><span>[^<]*<\/span><\/button>/,
  `<button class="mode" data-act="join"><b>👥 เข้าห้องสอบรวม</b><span>เมื่อผู้ติวเปิดห้องสอบ — เข้าพร้อมกันทุกเครื่อง</span></button>`); };
const _tutorDash=tutorDash;

/* ---------- handlers ---------- */
const _bindProto=bindProto;
bindProto=function(){
  _bindProto();
  const re=(sel,fn,ev="click")=>document.querySelectorAll(sel).forEach(el=>{ const n=el.cloneNode(true); el.replaceWith(n); n.addEventListener(ev,fn); });
  const enter=(sel,fn)=>document.querySelectorAll(sel).forEach(el=>{ const n=el.cloneNode(true); el.replaceWith(n); n.addEventListener("keydown",e=>{ if(e.key==="Enter") fn(); }); });
  const busy=(id,b)=>{ const el=$(id); if(el){ el.disabled=b; el.style.opacity=b?.6:1; } };
  // unit code
  const ucGo=async()=>{ const c=($("#ucIn").value||"").trim(); if(!c) return; busy("#ucGo",true); Cloud.code=c; await Cloud.loadPublic(); if(Cloud.code) Cloud.set("code",c); busy("#ucGo",false); render(); };
  re("#ucGo",ucGo); enter("#ucIn",ucGo);
  re("#ucForget",e=>{ e.preventDefault(); Cloud.code=null; Cloud.set("code",null); Cloud.roster=[]; state.loginId=null; render(); });
  // member login
  const go=async()=>{ const m=Cloud.roster.find(x=>x.id===state.loginId); const p=($("#lgPin").value||"").trim(), msg=$("#lgMsg");
    if(!/^\d{6}$/.test(p)) return msg.textContent="PIN ต้องเป็นตัวเลข 6 หลัก";
    if(!m.pin && p!==($("#lgPin2").value||"").trim()) return msg.textContent="PIN ทั้งสองช่องไม่ตรงกัน";
    busy("#lgGo",true); msg.textContent="กำลังเข้าสู่ระบบ…";
    try{ const r=await Cloud.rpc("rt_login",{p_code:Cloud.code,p_id:m.id,p_pin:p}); Cloud.setTok(r.token); Cloud.set("role","student"); Cloud.set("mid",r.id);
      const me=await Cloud.loadMe(); state.user={id:me.id, role:"student"}; state.name=memberName(me); state.view="home"; state.loginId=null; sbRealtime(); flushOutbox(); render(); window.scrollTo({top:0}); }
    catch(e){ msg.textContent=errTH(e); busy("#lgGo",false); } };
  re("#lgGo",go); enter("#lgPin, #lgPin2",go);
  // tutor login
  const tgo=async()=>{ const p=($("#tPin").value||"").trim(); busy("#tGo",true);
    try{ const r=await Cloud.rpc("rt_tutor_login",{p_pin:p}); Cloud.setTok(r.token); Cloud.set("role","tutor"); await Cloud.loadTutor(); if(Cloud.code) Cloud.set("code",Cloud.code);
      IS_ADMIN=true; EXAM_SETS=null; loadExamSets().then(()=>render()); state.user={role:"tutor"}; state.name="ผู้ติว"; state.view="home"; sbRealtime(); render(); }
    catch(e){ $("#tMsg").textContent=errTH(e); busy("#tGo",false); } };
  re("#tGo",tgo); enter("#tPin",tgo);
  // signup
  re("#suGo", async()=>{ const msg=$("#suMsg"); const first=$("#suFirst").value.trim(), last=$("#suLast").value.trim(); let rank=$("#suRank").value; if($("#suF").checked && !/^นา/.test(rank)) rank+="หญิง";
    const interest=(state.suType||"unit")==="interest"; let unit=interest?"บุคคลภายนอก":$("#suUnit").value; if(unit==="__other") unit=$("#suUnitOther").value.trim();
    const p1=$("#suPin").value.trim(), p2=$("#suPin2").value.trim();
    if(!first||!last) return msg.textContent="กรอกชื่อและนามสกุล"; if(!interest&&!unit) return msg.textContent="กรอกชื่อหน่วย";
    if(!/^\d{6}$/.test(p1)) return msg.textContent="PIN ต้องเป็นตัวเลข 6 หลัก"; if(p1!==p2) return msg.textContent="PIN ทั้งสองช่องไม่ตรงกัน";
    if(!Cloud.code) return msg.textContent="ใส่รหัสหน่วยก่อน";
    busy("#suGo",true);
    try{ const r=await Cloud.rpc("rt_signup",{p_code:Cloud.code,p_rank:rank,p_first:first,p_last:last,p_unit:unit,p_type:interest?"ผู้สนใจ":"",p_pin:p1});
      Cloud.setTok(r.token); Cloud.set("role","student"); Cloud.set("mid",r.id); const me=await Cloud.loadMe();
      state.signup=false; state.user={id:me.id, role:"student"}; state.name=memberName(me); state.view="home"; sbRealtime(); render(); window.scrollTo({top:0}); }
    catch(e){ msg.textContent=errTH(e); busy("#suGo",false); } });
  // tutor: change PIN / unit code / refresh / exam set upload
  re("#tPinGo", async()=>{ const p=($("#tNewPin").value||"").trim(); if(!/^\d{6}$/.test(p)) return alertModal("PIN ต้องเป็นตัวเลข 6 หลัก");
    try{ await Cloud.rpc("rt_tutor_set_pin",{p_token:Cloud.tok(),p_pin:p}); alertModal("เปลี่ยน PIN ผู้ติวแล้ว (เครื่องอื่นที่เข้าแดชบอร์ดอยู่จะถูกออกจากระบบ)"); }catch(e){ alertModal(errTH(e)); } });
  re("#ucSet", ()=>modal(`<h3>เปลี่ยนรหัสหน่วย</h3><p class="muted small">รหัสที่กำลังพลใช้เปิดรายชื่อตอนเข้าระบบครั้งแรก (อย่างน้อย 4 ตัวอักษร) — เครื่องที่จำรหัสเก่าไว้ต้องใส่ใหม่</p><input class="text" id="ucNew" value="${esc(Cloud.code||"")}"><div class="navrow"><button class="btn" data-close>ยกเลิก</button><button class="btn primary" id="ucSave">บันทึก</button></div>`,
    ()=>$("#ucSave").addEventListener("click",async()=>{ const c=$("#ucNew").value.trim(); try{ await Cloud.rpc("rt_tutor_set_code",{p_token:Cloud.tok(),p_code:c}); Cloud.code=c; Cloud.set("code",c); closeModal(); render(); }catch(e){ alertModal(e.message==="bad_code_format"?"รหัสต้องยาวอย่างน้อย 4 ตัวอักษร":errTH(e)); } })));
  re("#tRefresh", async()=>{ try{ await Cloud.loadTutor(); render(); }catch(e){ alertModal(errTH(e)); } });
  re("#esUp", ()=>$("#esFile").click());
  const ef=$("#esFile"); if(ef) ef.addEventListener("change", async()=>{ const out=[];
    for(const f of ef.files){ try{ const set=JSON.parse(await f.text()); await Cloud.rpc("rt_tutor_put_examset",{p_token:Cloud.tok(),p_set:set}); out.push("✓ "+(set.title||set.id)); }catch(e){ out.push("✗ "+f.name+" — "+(e instanceof SyntaxError?"ไม่ใช่ไฟล์ JSON":errTH(e))); } }
    EXAM_SETS=null; await loadExamSets(); alertModal(out.join("<br>")); render(); });
  ["#demoReset","#clearDemo"].forEach(s=>{ const el=$(s); if(el) el.style.display="none"; });
};
const roleEl=$("#roleLabel"); const roleNew=roleEl.cloneNode(true); roleEl.replaceWith(roleNew);
roleNew.addEventListener("click", ()=>{ if(!state.user) return; if(state.view==="exam") return alertModal("ออกจากหน้าสอบก่อน"); if(state.view==="proctor"&&proctor&&proctor.st.status!=="ended") return alertModal("สิ้นสุดห้องสอบก่อนออกจากระบบ");
  Cloud.logout(); if(sbChan){ try{ sbChan.unsubscribe(); }catch(e){} sbChan=null; } state.user=null; state.view="home"; state.page="home"; state.viewMember=null;

(async()=>{

  }catch(e){ if(!Cloud.tok()) await Cloud.loadPublic(); }
  render();
})();
