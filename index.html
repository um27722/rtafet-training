<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTAFET Training — ศูนย์ปฏิบัติการทางอวกาศ ทอ.</title>
<link rel="icon" href="logo.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f2347; --navy2:#1a3566; --sky:#2f6fb5; --sky-soft:#e8f0fa;
  --gold:#c9a227; --ink:#16202e; --muted:#5d6b7e; --line:#dde3ec; --bg:#f4f6f9; --card:#fff;
  --ok:#1f8a5b; --ok-soft:#e5f5ec; --bad:#c2410c; --bad-soft:#fdeee6; --warn:#a16207;
  --r:12px; --sans:'IBM Plex Sans Thai',system-ui,sans-serif; --serif:'Source Serif 4',Georgia,serif;
}
*{box-sizing:border-box}
:root{color-scheme:light}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
button{font:inherit;cursor:pointer;color:var(--ink)}
.wrap{max-width:1080px;margin:0 auto;padding:20px 18px 60px}
header.top{background:var(--navy);color:#fff}
header.top .wrap{padding:14px 18px;display:flex;align-items:center;gap:14px}
.crest{width:38px;height:38px;border-radius:50%;background:linear-gradient(140deg,var(--gold),#8a6d12);display:grid;place-items:center;font-weight:700;color:var(--navy);font-size:13px;letter-spacing:.5px;flex:none}
.top h1{font-size:17px;margin:0;font-weight:600}
.top .sub{font-size:12.5px;opacity:.75}
.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:500}
.pill.gold{background:rgba(201,162,39,.18);color:#f3dc8b}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
h2{font-size:20px;margin:0 0 6px}
h3{font-size:16px;margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
table.spec{width:100%;border-collapse:collapse;font-size:14px}
table.spec td,table.spec th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.spec th{font-weight:600;color:var(--muted);font-size:12.5px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 16px;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--sky)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy2)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mode{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:10px}
.mode:hover{border-color:var(--sky);background:var(--sky-soft)}
.mode b{display:block;font-size:15.5px}
.mode span{font-size:13.5px;color:var(--muted)}
input.text{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:6px 0 4px}
input.text:focus{outline:2px solid var(--sky);border-color:transparent}
/* exam */
.exambar{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff}
.exambar .wrap{padding:10px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:17px;background:rgba(255,255,255,.1);padding:4px 12px;border-radius:8px}
.timer.low{background:#b45309}
.progress{flex:1;min-width:120px;height:6px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);width:0}
.partlabel{font-size:13px;opacity:.85}
.qlayout{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
.qlayout.split{grid-template-columns:1fr 1fr}
@media(max-width:860px){.qlayout.split{grid-template-columns:1fr}}
.stimulus{font-family:var(--serif);font-size:16.5px;line-height:1.7;white-space:pre-wrap;max-height:68vh;overflow:auto}
.stimulus.box{border:2px solid var(--ink);border-radius:6px;padding:16px;background:#fffdf6}
.stimulus.email{font-family:var(--sans);font-size:15px;background:#fbfcfe}
.stimtitle{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--muted);margin-bottom:8px}
.qnum{font-size:13px;color:var(--muted);font-weight:500;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lvl{font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--sky-soft);color:var(--sky)}
.qtext{font-family:var(--serif);font-size:18px;margin:10px 0 14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;font-family:var(--serif);font-size:16.5px;color:var(--ink)}
.opt:hover{border-color:var(--sky)}
.opt:disabled{color:var(--ink);cursor:default}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--muted)}
.opt.sel{border-color:var(--navy);background:var(--sky-soft)}
.opt.sel .k{background:var(--navy);border-color:var(--navy);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.audio{display:flex;align-items:center;gap:12px;background:var(--sky-soft);border-radius:10px;padding:12px 14px;margin:8px 0 14px}
.play{width:46px;height:46px;border-radius:50%;border:none;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none}
.play:disabled{background:#9aa6b8}
.play svg{width:20px;height:20px}
.wave{display:flex;gap:3px;align-items:center;height:22px}
.wave i{width:3px;background:var(--sky);border-radius:2px;height:6px}
.speaking .wave i{animation:w 0.9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes w{0%,100%{height:5px}50%{height:20px}}
.explain{border-left:4px solid var(--gold);background:#fffaf0;padding:12px 14px;border-radius:0 10px 10px 0;margin-top:12px;font-size:15px}
.script{font-family:var(--serif);font-size:15px;background:#f7f8fb;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin-top:10px;white-space:pre-wrap}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.navrow .btn{white-space:nowrap}
@media(max-width:560px){.navrow .btn{padding:10px 12px;font-size:14.5px}.top .pill{display:none}}
.palette{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;margin-top:18px}
@media(max-width:700px){.palette{grid-template-columns:repeat(10,1fr)}}
.palette button{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:11.5px;padding:5px 0;color:var(--muted)}
.palette button.done{background:var(--navy);color:#fff;border-color:var(--navy)}
.palette button.cur{outline:2px solid var(--gold);outline-offset:1px}
.palette button.r{background:var(--ok);border-color:var(--ok);color:#fff}
.palette button.x{background:var(--bad);border-color:var(--bad);color:#fff}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
/* results */
.scorehero{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:760px){.scorehero{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .v{font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.stat.hero{background:var(--navy);color:#fff;border-color:var(--navy)}
.stat.hero .l{color:#c8d3e6}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:40px 1fr 104px;gap:10px;align-items:center;font-size:14px}
.bar .t{height:14px;background:#eef1f6;border-radius:7px;overflow:hidden;position:relative}
.bar .t i{display:block;height:100%;background:var(--sky);border-radius:7px}
.bar .t .th{position:absolute;left:60%;top:-3px;bottom:-3px;width:2px;background:var(--gold)}
.bar .n{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13.5px}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.rev{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;background:#fff}
.rev .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.tag{font-size:12px;border-radius:6px;padding:1px 8px;font-weight:600}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.no{background:var(--bad-soft);color:var(--bad)} .tag.sk{background:#f1f3f6;color:var(--muted)}
.note{font-size:13px;color:var(--muted);background:#f1f4f8;border-radius:10px;padding:10px 12px}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.45);display:grid;place-items:center;z-index:20;padding:18px}
.modal .card{max-width:440px;width:100%}
.hide{display:none!important}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist td,.hist th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.hist th{color:var(--muted);font-weight:600;font-size:12.5px}
.right{text-align:right}

.livebar{display:flex;align-items:center;gap:12px;background:#fff7e0;border:1px solid #f0d27a;border-radius:10px;padding:10px 14px;margin:8px 0 14px}
.livebar .dot{width:10px;height:10px;border-radius:50%;background:#dc2626;animation:blink 1s infinite;flex:none}
@keyframes blink{50%{opacity:.25}}
.cd{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;min-width:44px;text-align:center;color:var(--navy)}
.big{font-size:64px;font-weight:700;line-height:1;color:var(--navy);font-variant-numeric:tabular-nums}
.peers{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.peer{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.peer.done{background:var(--ok-soft);border-color:#b7e2c9}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:#fff;padding:6px 12px;font-size:14px}
.seg button.on{background:var(--navy);color:#fff}
.palette button:disabled{opacity:.35;cursor:not-allowed}
.waiting{text-align:center;padding:50px 20px}
select.text,textarea.text{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink);margin:6px 0 4px}
textarea.text{min-height:150px;resize:vertical}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <img src="logo.png" alt="ศูนย์ปฏิบัติการทางอวกาศกองทัพอากาศ" style="width:58px;height:58px;flex:none;object-fit:contain;margin:-6px 0">

  <div class="spacer"></div>
  <button class="pill gold" id="roleLabel" style="border:none;cursor:pointer;font:inherit;font-size:12.5px"></button>
</div></header>
<div id="app"></div>
<div id="modal" class="modal hide"><div class="card" id="modalBody"></div></div>

Automation should be removed from modern cockpits.","Automation improves safety but creates risks that call for a new human–machine relationship.","Accidents are mainly caused by poorly designed displays."],"w":["rooted less in laziness = ไม่ได้เกิดจากความขี้เกียจ","บทความบอกชัดว่า not to abandon automation",null,"การออกแบบจอแสดงผลเป็นแค่หนึ่งในวิธีแก้ — แคบเกินไป"],"a":2,"ex":"ย่อหน้าแรกและสุดท้าย: ระบบอัตโนมัติดี แต่มีความเสี่ยงแฝง ต้องปรับความสัมพันธ์คน–เครื่อง (ไม่ใช่เลิกใช้)","sk":"RM","fc":null},{"n":95,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pAuto","q":"According to paragraph 2, automation bias mainly results from __________.","o":["poorly trained designers","frequent system failures","the mental effort required to stay alert while monitoring reliable systems","pilots' lack of motivation"],"w":["ไม่ได้กล่าวถึงการฝึกผู้ออกแบบ","ระบบล้มเหลวนานๆ ครั้ง (rare failures)",null,"rooted less in laziness — ไม่ใช่เรื่องแรงจูงใจ"],"a":2,"ex":"rooted less in laziness than in the economics of attention ... vigilance, being cognitively costly","sk":"RD","fc":null},{"n":96,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pAuto","q":"The word \"atrophied\" in paragraph 2 is closest in meaning to __________.","o":["weakened","been tested","been recorded","improved"],"w":[null,"ไม่เข้ากับบริบท","ไม่เข้ากับบริบท","through disuse = ไม่ได้ใช้ จึงไม่ดีขึ้น"],"a":0,"ex":"atrophy = ฝ่อ เสื่อมลงเพราะไม่ได้ใช้ (through disuse)","sk":"RC","fc":null},{"n":97,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pAuto","q":"Why does the author describe the situation in paragraph 3 as paradoxical?","o":["Investigators lacked important information.","Crews always distrust automation.","Greater reliability can make failures more catastrophic.","Reliable systems never fail."],"w":["ลูกเรือมีข้อมูลครบ","ลูกเรือเชื่อระบบมากเกินไป ไม่ใช่ไม่ไว้ใจ",null,"บทความพูดถึง rare failures แปลว่าระบบล้มเหลวได้"],"a":2,"ex":"the more reliable a system appears, the more catastrophic its rare failures may become","sk":"RI","fc":null},{"n":98,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pAuto","q":"What did accident investigators repeatedly find?","o":["Crews had the necessary information but did not act on it.","Pilots ignored the automation completely.","The automation had never failed before.","Crews had no access to the right information."],"w":[null,"กลับกัน — ลูกเรือเชื่อว่าระบบรู้ดีกว่า","ไม่ได้กล่าวถึง","possessed all the information = มีข้อมูลครบ"],"a":0,"ex":"crews possessed all the information needed ... but failed to act on it","sk":"RD","fc":null},{"n":99,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pAuto","q":"The word \"scrutinise\" in paragraph 2 is closest in meaning to __________.","o":["approve","repair","examine carefully","ignore"],"w":["ไม่เข้ากับบริบท","ไม่เข้ากับบริบท",null,"ไม่เข้ากับ every output (ตรวจทุกผลลัพธ์)"],"a":2,"ex":"scrutinise = ตรวจพิจารณาอย่างละเอียด","sk":"RC","fc":null},{"n":100,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pAuto","q":"The phrase \"calibrated trust\" most nearly refers to __________.","o":["trusting only experienced pilots","trusting machines completely","refusing to rely on automation","trusting a system only as far as its reliability justifies"],"w":["ไม่ได้กล่าวถึงประสบการณ์นักบิน","neither blind faith = ไม่ใช่เชื่อแบบสุดใจ","nor reflexive suspicion = ไม่ใช่ระแวงไว้ก่อน",null],"a":3,"ex":"neither blind faith ... nor reflexive suspicion ... but an informed judgement of when, and how far, it can be relied upon","sk":"RC","fc":null}],"groups":{"c57":{"title":"Conversation","script":[["W","Flight Lieutenant Arun, how did the joint exercise with the Australian team go?"],["M","Overall it went smoothly. Communication was a bit tricky at first because of the radio terminology, but by day two we had agreed on standard phrases, and things improved a lot."],["W","Good to hear. Is there anything we should change next time?"],["M","I'd recommend a short terminology workshop before the exercise starts."]]},"t59":{"title":"Talk","script":[["N","Good morning, everyone. This is a reminder that, due to scheduled runway resurfacing, all training flights originally planned for Thursday will be relocated to Wing 4 at Takhli. Crews are to report to Hangar 2 no later than 0600 hours for transport. Personal equipment must be packed and labeled the night before, as there will be no opportunity to return to quarters once the convoy departs. Any crew member with a medical exemption should notify the duty officer by Wednesday noon."]]},"adBike":{"title":"ADVERTISEMENT","kind":"ad","text":"FOR SALE\nMountain bike — 2 years old\nVery good condition\nOnly 3,500 baht\n\nCall Nok: 081-555-0142\n(after 6 p.m. only)"},"ntPool":{"title":"NOTICE","kind":"notice","text":"FITNESS CENTER\n\nFrom 1–15 December the swimming pool will be closed for cleaning.\nThe gym and tennis courts will remain open as usual.\n\nWe apologise for any inconvenience.\n— Welfare Section"},"emClub":{"title":"E-MAIL","kind":"email","text":"To: All section staff\nFrom: Sqn. Ldr. Pim\nSubject: English lunch-hour club\n\nDear all,\n\nStarting next Tuesday, we will run an English conversation club in Meeting Room 3 from 12:15 to 12:50. Each week, one member will prepare a five-minute talk on a work-related topic, followed by an open discussion.\n\nAttendance is voluntary, but anyone planning to take the RTAFET this year is strongly encouraged to join. Please bring your own lunch. To sign up, reply to this e-mail by Friday.\n\nPim"},"pSleep":{"title":"Passage","kind":"passage","text":"Many people think that sleeping less is a good way to get more work done. However, research shows the opposite. When adults sleep fewer than six hours a night, their ability to concentrate drops, and they make more mistakes. This is especially dangerous for people who drive, operate machines or work night shifts.\n\nExperts recommend seven to nine hours of sleep for most adults. They also suggest going to bed at the same time every night, avoiding coffee in the late afternoon, and keeping phones out of the bedroom. Some military units now include sleep education in their training programs, because a well-rested soldier is safer and more effective than a tired one."},"pOpen":{"title":"Passage","kind":"passage","text":"Every year, the air base near the city opens its gates to the public for a family day. Visitors can look inside transport aircraft, watch a parachute demonstration and talk to pilots and engineers. Last year more than 15,000 people attended, so this year the organizers have added a second entrance and more shuttle buses from the city center.\n\nEntry is free, but visitors must show an ID card at the gate. Large bags, drones and pets are not allowed. Food stalls run by local communities will be open all day."},"pDebris":{"title":"Passage","kind":"passage","text":"Since the launch of Sputnik in 1957, humans have placed thousands of objects into orbit around the Earth. Many of these are no longer functional: dead satellites, spent rocket stages and fragments created by collisions and explosions. Together they form what is commonly called space debris.\n\nThe problem is not merely one of quantity but of speed. In low Earth orbit, objects travel at around 7.5 kilometres per second, so even a fragment the size of a coin can strike with the energy of a small explosive. Operators of active satellites must therefore monitor the paths of nearby objects and, when the risk of collision becomes too high, perform avoidance manoeuvres. Each manoeuvre consumes fuel, which shortens the operational life of the satellite.\n\nScientists have long warned of a scenario known as the Kessler syndrome, in which collisions generate more debris, which in turn causes further collisions. To mitigate this risk, many space agencies now require that satellites be moved into a 'graveyard' orbit or brought down to burn up in the atmosphere at the end of their missions. Several companies are also testing technologies to capture and remove existing debris, although the cost of such missions remains a significant obstacle."},"pAuto":{"title":"Passage","kind":"passage","text":"As cockpits have become increasingly automated, aviation safety has improved dramatically; yet the very systems designed to reduce human error have introduced subtler risks of their own. Chief among them is what researchers term automation bias: the tendency of operators to defer to computer-generated information even when it conflicts with other cues or with their own judgement.\n\nThe phenomenon is rooted less in laziness than in the economics of attention. A pilot monitoring a system that has behaved flawlessly for hundreds of hours has little reason to scrutinise its every output, and vigilance, being cognitively costly, gradually erodes. When the system eventually fails — often in an unusual situation that its designers did not anticipate — the crew may be slow to notice, and slower still to intervene, precisely because their manual skills have atrophied through disuse.\n\nParadoxically, then, the more reliable a system appears, the more catastrophic its rare failures may become. Accident investigators have repeatedly found that crews possessed all the information needed to recognise a problem but failed to act on it, having assumed that the automation 'knew better'.\n\nThe remedy, most experts agree, is not to abandon automation but to redesign the relationship between human and machine. Training programmes now emphasise regular manual flying practice, and interface designers are experimenting with displays that communicate a system's level of confidence rather than presenting its outputs as unqualified facts. The goal is calibrated trust: neither blind faith in the machine nor reflexive suspicion of it, but an informed judgement of when, and how far, it can be relied upon."}}},{"id":"P02","title":"ชุดฝึก 2","kind":"practice","items":[{"n":1,"p":"L1","lv":"A1","sub":"Question","s":"What's your name?","g":null,"q":nul eteriorated' in paragraph 2 is closest in meaning to __________.","o":["disappeared completely","improved","been tested","become worse"],"w":["เกินจริง","ตรงข้าม","ไม่ใช่ความหมาย",null],"a":3,"ex":"deteriorate = แย่ลง","sk":"RC","fc":null},{"n":97,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pAuto","q":"Why is monitoring automation described as 'tedious'?","o":["Because pilots must fly manually","Because the systems almost never fail","Because the systems fail very often","Because the alerts are confusing"],"w":["ไม่เกี่ยว",null,"ตรงข้าม","ไม่ใช่เหตุผลที่ให้"],"a":1,"ex":"Monitoring a system that almost never fails is tedious","sk":"RI","fc":null},{"n":98,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pAuto","q":"Which of the following is NOT mentioned as a response by airlines and air forces?","o":["Redesigned training programmes","More regular manual-flying practice","Reducing the number of automated systems","Training on unusual situations"],"w":["กล่าวถึง","กล่าวถึง",null,"กล่าวถึง"],"a":2,"ex":"เป้าหมายไม่ใช่ลด automation","sk":"RT","fc":null},{"n":99,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pAuto","q":"What can be inferred about the delay mentioned in paragraph 2?","o":["It is caused by slow computers.","It has been completely solved.","It only happens on the ground.","It happens because crews must first understand what the automation was doing."],"w":["ไม่ได้กล่าวถึง","ยังเป็นปัญหาอยู่","ไม่ได้กล่าวถึง",null],"a":3,"ex":"must first work out what the automation was doing","sk":"RI","fc":null},{"n":100,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pAuto","q":"The researcher quoted at the end believes that automation should __________.","o":["support pilots rather than replace them","be used only in military aircraft","be reduced as much as possible","replace pilots completely"],"w":[null,"ไม่ได้กล่าวถึง","ไม่ใช่ลด","ตรงข้าม"],"a":0,"ex":"automation that works with people rather than in place of them","sk":"RD","fc":null}],"groups":{"cMed":{"title":"Conversation","script":[["M","Good morning. I'd like to see the doctor, please. I've had a bad cough for a week."],["W","Do you have an appointment?"],["M","No, I don't. Is that a problem?"],["W","Dr Prasert is fully booked this morning, but Dr Anong can see you at eleven fifteen. Please bring your ID card and fill in this form while you wait."]]},"tTour":{"title":"Talk","script":[["N","Welcome to the Royal Thai Air Force Museum. Our tour today will last about ninety minutes. We'll start in Hall One, where you can see aircraft from the Second World War, and then move outside to the helicopter area. Photography is allowed everywhere except in the engine room, because the flash can damage some of the older parts. At the end of the tour, there's a gift shop near the main entrance, and the café on the second floor offers a ten per cent discount to visitors with a museum ticket."]]},"adFlat":{"title":"ADVERTISEMENT","kind":"ad","text":"ROOM FOR RENT\n\nOne-bedroom apartment, 10 minutes from the base main gate\nFurnished · Air-conditioned · Wi-Fi included\n\n6,500 baht per month (water & electricity extra)\nMinimum stay: 6 months\nNo pets\n\nCall Khun Suda: 081-234-5678 (after 5 p.m.)"},"ntGym":{"title":"NOTICE","kind":"notice","text":"BASE GYM – NEW RULES\n\nFrom 1 March:\n• Please wipe down machines after use.\n• Bring a towel. Towels are no longer provided.\n• Children under 15 must be with an adult.\n• The gym will close at 9 p.m. instead of 10 p.m.\n\nThank you for your cooperation.\n— Sports Office"},"pTea":{"title":"Passage","kind":"passage","text":"Tea is the second most popular drink in the world after water. It was first used in China thousands of years ago, mainly as a medicine. Later, traders carried tea to other countries, and it became popular in Japan, India and Britain.\n\nToday there are many kinds of tea, such as green tea, black tea and oolong tea. They all come from the same plant. The difference is how the leaves are dried and prepared after they are picked."},"pTeam":{"title":"Passage","kind":"passage","text":"Many managers think that the best teams are made of the most talented people. However, a large study of workplace teams found that talent was less important than expected. The most successful teams were those in which members felt safe to speak up, ask questions and admit mistakes without fear of being embarrassed.\n\nResearchers call this 'psychological safety'. In teams without it, people often keep quiet about problems, so small errors grow into large ones. Leaders can build psychological safety by listening carefully, thanking people for raising concerns and admitting their own mistakes."},"pRain":{"title":"Passage","kind":"passage","text":"Every year, large parts of Thailand depend on the monsoon to fill rivers, reservoirs and rice fields. Yet rainfall has become increasingly unpredictable. Some years bring long dry spells in the middle of the rainy season; others bring sudden, intense storms that cause flash floods in areas that rarely flooded before.\n\nTo cope with this uncertainty, the Royal Rainmaking and Agricultural Aviation Department has used cloud seeding for several decades. Aircraft, including some operated with the support of the Air Force, release substances such as salt or dry ice into suitable clouds. These particles encourage water droplets to form and grow heavy enough to fall as rain.\n\nCloud seeding cannot create rain from a clear sky; it only works when clouds with enough moisture are already present. Its effectiveness is also difficult to measure, since no one can know for certain how much rain would have fallen without it. Nevertheless, many farmers regard the operations as a vital source of support during droughts, and the programme remains popular."},"pAuto":{"title":"Passage","kind":"passage","text":"Automation has long promised to make flying safer by removing the possibility of human error. Modern airliners can climb, cruise, navigate and even land with minimal intervention, and accident rates have fallen considerably as these systems have spread. Yet investigators have identified an unexpected side effect: when automation fails or behaves in an unexpected way, crews sometimes struggle to take over.\n\nThe problem is partly one of skill. Pilots who rarely fly manually may find that their hand-flying abilities have deteriorated precisely when they are needed most. It is also a problem of awareness. Monitoring a system that almost never fails is tedious, and attention naturally drifts. When an alert finally sounds, the crew must first work out what the automation was doing before they can decide how to respond — a delay that can prove critical.\n\nAirlines and air forces have responded by requiring more regular manual-flying practice and by redesigning training to focus on recognising and recovering from unusual situations. Some designers go further, arguing that cockpits should keep pilots actively engaged rather than reducing them to passive observers. The aim, as one researcher put it, is not less automation, but automation that works with people rather than in place of them."}}},{"id":"P03","title":"ชุดฝึก 3","kind":"practice","items":[{"n":1,"p":"L1","lv":"A1","sub":"Question","s":"How are you today?","g":null,"q":null,"o":["I'm from Chiang Mai.","I'm a pilot.","I'm very well, thanks.","I'm twenty."],"w":["ตอบว่ามาจากไหน","ตอบอาชีพ",null,"ตอบอายุ"],"a":2,"ex":"How are you? = สบายดีไหม","sk":"LQ","fc":null},{"n":2,"p":"L1","lv":"A1","sub":"Statement","s":"I get up at six every morning.","g":null,"q":null,"o":["The speaker goes to bed at six.","The speaker wakes up early.","The speaker sleeps until noon.","The speaker gets up at seven."],"w":["get up ≠ go to bed",null,"ตรงข้าม","ตัวเลขผิด"],"a":1,"ex":"get up = ตื่นนอน","sk":"LP","fc":null},{"n":3,"p":"L1","lv":"A1","sub":"Question","s":"What's that in your hand?","g":null,"q":null,"o":["It's a key.","It's my hand.","It's very big.","I'm fine."],"w":[null,"ไม่สมเหตุสมผล","บอกขนาด" ub":"Passage","s":null,"g":"pDeb","q":"Which question is NOT part of the after-action review?","o":["Why was there a difference?","What will we do differently?","Who should be punished?","What was supposed to happen?"],"w":["เป็นหนึ่งในคำถาม","เป็นหนึ่งในคำถาม",null,"เป็นหนึ่งในคำถาม"],"a":2,"ex":"focus on the task rather than on individuals","sk":"RT","fc":null},{"n":96,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pDeb","q":"Why is rank set aside during the review?","o":["So juniors can point out errors without fear","To punish senior officers","Because senior officers are not present","To save time"],"w":[null,"ไม่ได้กล่าวถึง","ผู้อาวุโสอยู่ด้วย","ไม่ได้กล่าวถึง"],"a":0,"ex":"so that a junior airman can point out an error ... without fear","sk":"RD","fc":null},{"n":97,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pDeb","q":"The word 'ritual' in paragraph 1 suggests that some debriefs are __________.","o":["very exciting","highly effective","done out of habit without real purpose","religious ceremonies"],"w":["ตรงข้าม","ตรงข้าม",null,"แปลตรงตัว"],"a":2,"ex":"a ritual rather than a tool = ทำตามธรรมเนียม","sk":"RC","fc":null},{"n":98,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pDeb","q":"Why do facilitators ask junior personnel to speak first?","o":["Because seniors refuse to speak","Because juniors know more","To finish the review quickly","To prevent senior participants from dominating"],"w":["ไม่ได้กล่าวถึง","ไม่ได้กล่าวถึง","ไม่ได้กล่าวถึง",null],"a":3,"ex":"Senior participants may dominate ... juniors hesitate","sk":"RI","fc":null},{"n":99,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pDeb","q":"According to the facilitators, a lesson is truly 'learned' only when __________.","o":["it is written in the report","someone is made responsible for acting on it by a deadline","the senior officer approves it","everyone agrees with it"],"w":["ยังเป็นแค่ observed",null,"ไม่ได้กล่าวถึง","ไม่ได้กล่าวถึง"],"a":1,"ex":"assigned to a named person with a deadline","sk":"RI","fc":null},{"n":100,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pDeb","q":"What is the author's overall view of the after-action review?","o":["It is valuable but difficult to do well.","It should be replaced by ordinary debriefs.","It is useless.","It works perfectly in every unit."],"w":[null,"ตรงข้าม","บทความเห็นคุณค่า","ยอมรับว่าทำได้ยาก"],"a":0,"ex":"designed to avoid this ... In practice, difficult to achieve","sk":"RI","fc":"Author's attitude"}],"groups":{"cBike":{"title":"Conversation","script":[["W","Hi, I'm calling about the motorbike you're selling. Is it still available?"],["M","Yes, it is. It's a 2021 model, and I've only ridden it about eight thousand kilometres."],["W","The advert says thirty-five thousand baht. Would you take thirty-two?"],["M","I can do thirty-three, but that's my lowest price. You can come and see it at the base housing area after five today."]]},"tLib":{"title":"Talk","script":[["N","Good morning, everyone, and welcome to the base library. Before you start using our services, here are a few things you should know. You can borrow up to five books at a time for two weeks. If you need a book for longer, you can renew it once online. Our computer room is on the first floor, and you'll need your ID card to log in. Please remember that food and drinks are not allowed anywhere in the library, but there's a water fountain near the stairs. Finally, the library is open until eight p.m. on weekdays, but it closes at noon on Saturdays."]]},"adBike":{"title":"ADVERTISEMENT","kind":"ad","text":"FOR SALE\n\nHonda Click 125i motorbike (2021)\nRed · 8,000 km · one owner\nNew tyres and battery\n\nPrice: 35,000 baht\n\nCall Sgt. Thana: 089-765-4321\nViewing: base housing area, after 5 p.m."},"ntCanteen":{"title":"NOTICE","kind":"notice","text":"CANTEEN – CHANGES FROM 1 JULY\n\n• Breakfast will be served from 6:00 to 8:00 a.m. (not 6:30–8:30).\n• A vegetarian dish will be available every day.\n• Cash is no longer accepted. Please pay by QR code or staff card.\n• The canteen will be closed on public holidays.\n\nComments? Speak to the Welfare Office."},"pBts":{"title":"Passage","kind":"passage","text":"The BTS Skytrain opened in Bangkok in December 1999. Before that, most people travelled by car or bus, and traffic jams were a daily problem. The Skytrain runs above the roads, so it is not affected by traffic.\n\nToday the BTS carries hundreds of thousands of passengers every day. Trains come every few minutes during busy times. Many people now leave their cars at home and take the train to work, especially in the city centre."},"pVol":{"title":"Passage","kind":"passage","text":"Volunteering means giving your time to help others without being paid. People volunteer in many ways: teaching children, cleaning beaches, helping at hospitals or supporting people after floods.\n\nVolunteers do not only help other people; they also help themselves. Studies show that people who volunteer regularly often feel happier and less stressed. They also learn new skills and meet people they would never have met otherwise. For young people, volunteer experience can even help when applying for jobs or university places."},"pHeat":{"title":"Passage","kind":"passage","text":"Thailand's hot season can be dangerous for anyone who works outdoors, including ground crews on air bases. When the body cannot lose heat fast enough, its temperature rises, and a person may suffer from heat exhaustion. Typical signs include heavy sweating, weakness, headache and feeling sick. If nothing is done, this can develop into heat stroke, a medical emergency in which the body stops sweating and the person may become confused or lose consciousness.\n\nPrevention is relatively simple but requires discipline. Workers should drink water regularly, even before they feel thirsty, and take short breaks in the shade. Supervisors can plan the heaviest tasks for the early morning or late afternoon and make sure that new personnel, who are not yet used to the heat, are given lighter duties during their first week.\n\nAnyone who shows signs of heat illness should be moved to a cool place immediately. Loosening clothing and applying cool, wet cloths can lower body temperature. If the person is confused or stops sweating, medical help must be called at once."},"pDeb":{"title":"Passage","kind":"passage","text":"Most organisations hold a debrief after a major exercise or operation, but many of these sessions achieve little. Participants list what went well, mention a few problems, and then return to work without changing anything. The same mistakes appear in the next exercise, and the debrief becomes a ritual rather than a tool for improvement.\n\nThe military 'after-action review' was designed to avoid this. It asks four simple questions: What was supposed to happen? What actually happened? Why was there a difference? What will we do differently next time? Crucially, it is meant to focus on the task rather than on individuals. Rank is set aside during the discussion, so that a junior airman can point out an error made by a senior officer without fear.\n\nIn practice, this ideal is difficult to achieve. Senior participants may dominate the conversation, and junior ones may hesitate to criticise their superiors in public. Experienced facilitators therefore often ask junior personnel to speak first, and they insist that every lesson identified is assigned to a named person with a deadline. Without that final step, they argue, a lesson has merely been observed, not learned."}}},{"id":"P04","title":"ชุดฝึก 4","kind":"practice","items":[{"n":1,"p":"L1","lv":"A1","sub":"Question","s":"What's your favourite food?","g":null,"q":null,"o":["At the canteen.","I'm not hungry.","I love green curry.","Every day."],"w":["ตอบสถานที่","ไม่ได้ตอบ",null,"ตอบความถี่"],"a":2,"ex":"favourite = ชอบที่สุด","sk":"LQ","fc":null},{"n":2,"p":"L1","lv":"A1","sub":"Statement","s":"The cat is sleeping under the table.","g":null,"q":null,"o":["The ca stic","q":"It can be inferred that environmental groups think recycling __________.","o":["is the best solution","cannot solve the problem on its own","should be banned","is used for most plastic"],"w":["ตรงข้าม",null,"ไม่ได้กล่าวถึง","ตรงข้าม — สัดส่วนน้อย"],"a":1,"ex":"only a small proportion of plastic is ever recycled","sk":"RI","fc":null},{"n":94,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pMentor","q":"What is the main purpose of the passage?","o":["To compare business and military salaries","To describe what makes mentoring effective","To argue that mentoring should be stopped","To explain how to become a supervisor"],"w":["ไม่ได้กล่าวถึง",null,"ตรงข้าม","ไม่ได้กล่าวถึง"],"a":1,"ex":"the most successful mentoring relationships share several features","sk":"RM","fc":null},{"n":95,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pMentor","q":"Why should the mentor NOT be the mentee's direct supervisor?","o":["Supervisors are too busy.","It is against military regulations.","The mentee may hide problems from someone who evaluates them.","Supervisors lack experience."],"w":["ไม่ได้กล่าวถึง","ไม่ได้กล่าวถึง",null,"ไม่ได้กล่าวถึง"],"a":2,"ex":"the junior partner may hide difficulties","sk":"RD","fc":null},{"n":96,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pMentor","q":"What happens when pairings are 'imposed from above'?","o":["Relationships tend to remain shallow.","They are always successful.","Mentors are promoted.","Mentees refuse to attend."],"w":[null,"ตรงข้าม","ไม่ได้กล่าวถึง","ไม่ได้กล่าวถึง"],"a":0,"ex":"tend to remain polite but shallow","sk":"RD","fc":null},{"n":97,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pMentor","q":"Which is given as an example of a clear purpose?","o":["Learning the base layout","Making new friends","General development","Preparing for a promotion board"],"w":["ไม่ได้กล่าวถึง","ไม่ได้กล่าวถึง","ตัวอย่างของเป้าหมายที่คลุมเครือ",null],"a":3,"ex":"such as preparing for a promotion board","sk":"RD","fc":null},{"n":98,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pMentor","q":"The phrase 'taken for granted' in paragraph 3 means __________.","o":["accepted without thinking about it","borrowed","given as a gift","forgotten completely"],"w":[null,"ไม่ใช่ความหมาย","แปลตรงตัว","เกินจริง"],"a":0,"ex":"take for granted = ถือเป็นเรื่องปกติโดยไม่ได้คิด","sk":"RC","fc":null},{"n":99,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pMentor","q":"What is 'reverse mentoring'?","o":["Supervisors evaluating mentors","Junior staff advising senior leaders","Mentors leaving the organisation","Mentoring that ends early"],"w":["ไม่ใช่ความหมาย",null,"ไม่ใช่ความหมาย","ไม่ใช่ความหมาย"],"a":1,"ex":"junior staff advise senior leaders","sk":"RD","fc":null},{"n":100,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pMentor","q":"Which statement would the author most likely agree with?","o":["Mentoring always works.","Only mentees benefit from mentoring.","Mentors should be chosen randomly.","Both mentors and mentees can benefit from mentoring."],"w":["results vary widely","the benefits are not one-sided","ควรให้มีทางเลือก",null],"a":3,"ex":"Interestingly, the benefits are not one-sided.","sk":"RI","fc":null}],"groups":{"cGym":{"title":"Conversation","script":[["W","Hi, I'd like to join the base fitness class. When does it meet?"],["M","There are two groups: Monday and Wednesday at six in the morning, or Tuesday and Thursday at five in the evening."],["W","The evening group is better for me. Do I need to bring anything?"],["M","Just water and a towel. Oh, and you need to pass a short health check at the medical centre before your first class."]]},"tVisit":{"title":"Talk","script":[["N","Good afternoon, everyone. Thank you for coming to our open day at the Space Operations Center. In a moment, we'll divide you into three groups of about fifteen people. Each group will visit the satellite control room, the ground station antennas and our small exhibition. The tour lasts about one hour. Please note that mobile phones must be switched off inside the control room, and photography is not permitted there. Afterwards, refreshments will be served in the main hall, where our engineers will be happy to answer your questions."]]},"adClass":{"title":"ADVERTISEMENT","kind":"ad","text":"LEARN THAI COOKING!\n\nEvery Saturday, 9 a.m. – 12 p.m.\nOfficers' Club kitchen\n\nCook three dishes each week and eat them for lunch!\nAll ingredients provided.\n\n4 classes: 2,000 baht\nSingle class: 600 baht\nMaximum 12 students per class\n\nBook at the Officers' Club reception."},"ntPark":{"title":"NOTICE","kind":"notice","text":"CAR PARK CLOSURE\n\nThe main car park behind Building 1 will be closed\nfrom 3 to 14 June for resurfacing.\n\nDuring this time, please use the sports field car park.\nA free shuttle bus will run every 15 minutes from 7:00 to 9:00 a.m.\nand from 4:00 to 6:00 p.m.\n\nVisitors with disabilities may still park at the front of Building 1."},"pElephant":{"title":"Passage","kind":"passage","text":"The elephant is the national animal of Thailand. In the past, elephants were used in wars and to carry wood from the forests. Today, there are about 3,000 wild elephants in Thailand and a similar number living with people.\n\nEvery year on 13 March, Thailand celebrates National Elephant Day. People give fruit to elephants, and there are special events in many provinces to teach people how to protect them."},"pSleep":{"title":"Passage","kind":"passage","text":"Shift work is common in the military, hospitals and airports. Working at night goes against the body's natural clock, which is set by daylight. As a result, many shift workers sleep badly and feel tired during the day.\n\nThere are ways to reduce these problems. Experts suggest keeping the bedroom dark and quiet, using the same sleep times even on days off when possible, and avoiding caffeine for several hours before sleep. A short nap of twenty minutes before a night shift can also improve alertness. Managers can help by planning shifts that move forward — from morning to afternoon to night — rather than backwards."},"pPlastic":{"title":"Passage","kind":"passage","text":"Every year, millions of tonnes of plastic enter the world's oceans. Much of it comes from rivers in Asia, where waste collection has not kept up with rapid economic growth. Once in the sea, plastic does not disappear. Instead, sunlight and waves break it into smaller and smaller pieces, known as microplastics, which are now found everywhere from the deepest ocean trenches to Arctic ice.\n\nMarine animals often mistake plastic for food. Turtles eat plastic bags that look like jellyfish, and seabirds feed bottle caps to their chicks. Microplastics have also entered the human food chain through fish and salt, although scientists are still studying what effect this has on health.\n\nThailand has taken several steps to address the problem, including a ban on free plastic bags in major stores, which began in 2020. Environmental groups welcome such measures but argue that they are not enough. They say the most effective solution is to reduce the production of single-use plastic, rather than relying on recycling, since only a small proportion of plastic is ever recycled."},"pMentor":{"title":"Passage","kind":"passage","text":"Most organisations recognise that new members learn faster with the help of an experienced colleague. Formal mentoring programmes, in which a junior person is paired with a more senior one for a set period, have therefore become common in both business and the armed forces. Their results, however, vary widely.\n\nResearch suggests that the most successful mentoring relationships share several features. First, both participants have some choice in the pairing; relationships imposed from above tend to remain polite but shallow. Second, the mentor is not the mentee's direct supervisor. When the same person both guides and evaluates, the junior partner may hide difficulties rather than discuss them openly. Third, the relationship has a clear purpose, such as preparing for a promotion board or developing a particular skill, rather than a vague aim of 'general development'.\n\nInterestingly, the benefits are not one-sided. Mentors frequently report that explaining their decisions forces them to reflect on habits they had long taken for granted, and that their mentees expose them to new technologies and perspectives. Some organisations have formalised this through 'reverse mentoring', in which junior staff advise senior leaders on topics such as digital tools or the expectations of younger personnel."}}}];

function pickVoice(sp){
  const vs = speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)); if (!vs.length) return null;
  if (sp==="W") return vs.find(v=>/female|samantha|zira|susan|karen|jenny|aria|victoria/i.test(v.name))||vs[1%vs.length];
  if (sp==="M") return vs.find(v=>/daniel|david|alex|guy|mark|fred|male/i.test(v.name)&&!/female/i.test(v.name))||vs[2%vs.length];
  return vs.find(v=>/daniel|david|alex|guy|mark|fred|male/i.test(v.name)&&!/female/i.test(v.name))||vs.find(v=>/en-US/i.test(v.lang))||vs[0];
}

    catch(e) { const c=e&&e.code; if (c==="viewer_stopped") return "stopped"; if (c==="rate_limited"){ await sleep(1500); return say(lines); } TTS=null; }
  }
  if ("speechSynthesis" in window && speechSynthesis.getVoices().length) {
    audioEngine="browser";
    return new Promise(res=>{ speechSynthesis.cancel();
      lines.forEach(([sp,t],i)=>{ const u=new SpeechSynthesisUtterance(t); u.lang="en-US"; u.rate=0.92; const v=pickVoice(sp); if(v) u.voice=v;

  audioEngine="none"; state.noAudio = true; await sleep(estSec(lines)*1000); return "ok";
}
function stopAudio(){ try{ TTS && TTS.stop(); }catch(e){} try{ speechSynthesis.cancel(); }catch(e){} speakingKey=null; }

/* ---------- listening engine: real pace (≈30 นาที) or fast drill ---------- */
function buildUnits(){
  const units=[], done=new Set(); let last=null;
  for (const it of LISTEN){
    if (it.p!==last){ last=it.p; units.push({type:"dir", part:it.p, first:it.n, lines:[["N",PARTS[it.p].say]]}); }
    if (it.g){ if(done.has(it.g)) continue; done.add(it.g); const ns=LISTEN.filter(x=>x.g===it.g).map(x=>x.n); units.push({type:"q", ns, lines:linesFor(it)}); }
    else units.push({type:"q", ns:[it.n], lines:linesFor(it)});
  }
  return units;
}
function makeEngine(opt, hooks){   // opt: {pace:"real"|"fast", gap, audio:true|false}
  const E = { paused:false, cancelled:false, cur:null, stage:null, gapLeft:0, units: buildUnits(),
    async wait(){ while(E.paused && !E.cancelled) await sleep(150); },
    async countdown(sec){ E.gapLeft=sec; hooks.tick&&hooks.tick(E); let last=Math.ceil(sec);
      while(E.gapLeft>0 && !E.cancelled){ await sleep(200); if(!E.paused){ E.gapLeft=Math.max(0,E.gapLeft-0.2); const c=Math.ceil(E.gapLeft); if(c!==last){ last=c; hooks.tick&&hooks.tick(E);} } } },
    set(n,stage,extra){ E.cur=n; E.stage=stage; E.extra=extra||{}; hooks.item&&hooks.item(E); },
    async run(){
      E.set(null,"intro"); await E.countdown(3);
      for (const u of E.units){
        if (E.cancelled) return; await E.wait();
        const t0 = Date.now();
        if (u.type==="dir"){ E.set(u.first,"dir"); if(opt.audio) await say(u.lines); else await sleep(estSec(u.lines)*1000); if(E.cancelled) return; await E.countdown(2); continue; }
        E.set(u.ns[0],"speak",{ns:u.ns, unit:u});
        if (opt.audio) await say(u.lines); else await sleep(estSec(u.lines)*1000);
        if (E.cancelled) return;
        const used = (Date.now()-t0)/1000;
        const per = opt.gap + (opt.pace==="fast" && u.ns[0]>50 ? 2 : 0);
        for (const n of u.ns){ await E.wait(); E.set(n,"gap",{ns:u.ns, len:per}); await E.countdown(per); if(E.cancelled) return; }
      }
      if (!E.cancelled){ E.set(null,"done"); hooks.done&&hooks.done(E); }
    },
    stop(){ E.cancelled=true; stopAudio(); } };
  return E;
}
function estListenMin(pace, gap){ const us=buildUnits(); let t=3; us.forEach(u=>{ t += u.type==="dir" ? estSec(u.lines)+2 : estSec(u.lines)+u.ns.length*(gap+(pace==="fast"&&u.ns[0]>50?2:0)); }); return Math.round(t/60); }

async function loadPaper(st){
  if (st.kind!=="exam") return findPractice(st.setId);
  for (let i=0;i<20;i++){ try{ const sn=await DB.doc("rooms/paper").get(); const d=sn.exists?sn.data():null; if(d&&d.sid===st.sid&&d.set) return d.set; }catch(e){} await sleep(800); }

async function enterRoomExam(st){
  if (entering) return; entering=true;

    const set = await loadPaper(st); if(!set){ state.roomErr="โหลดข้อสอบไม่สำเร็จ ลองกดเข้าใหม่"; render(); return; }

    state.view="exam"; render(); tick(); applyRoom(st); presence();

}
function applyRoom(st){
  if (!st) return; const prev=roomState; roomState=st;
  const s=state.session;
  if (state.view==="exam" && s && s.mode==="room" && !s.finished){
    if (st.sid!==s.sid) return;
    if (st.status==="listening"){ s.phase="listening"; s.live.cur=st.item; s.live.stage=st.stage; s.live.gapLeft=st.gapLeft||0; s.live.recv=Date.now();
      if (st.item){ const i=s.list.indexOf(st.item); if(i>=0) s.idx=i; }
      if (s.audio==="each" && st.stage==="speak" && st.item && (!prev || prev.item!==st.item || prev.stage!=="speak")){ const it=ITEMS[st.item-1]; say(linesFor(it)); }
      if (s.audio==="each" && st.stage==="dir" && (!prev||prev.stage!=="dir"||prev.item!==st.item)){ const it=ITEMS[st.item-1]; say([["N",PARTS[it.p].say]]); }
      render(); }
    else if (st.status==="reading"){ if(s.phase!=="reading") startReading(s, st.deadline); else { s.deadline=st.deadline; } }
    else if (st.status==="ended") finish(true,"ผู้คุมสอบสิ้นสุดการสอบแล้ว ระบบส่งคำตอบให้อัตโนมัติ");
  } else if (state.view==="lobby"){
    if (st.status==="listening" && st.audio==="each" && !state.soundOk) return render();
    if (st.status==="listening" && (!prev || prev.sid!==st.sid || !state.session)) enterRoomExam(st); else render();
  }
}
function presence(extra){
  if(!ROOM) return; const s=state.session;

}

/* ================= scoring & diagnosis ================= */
const RCOMP=["RD","RT","RM","RI","RC"], RLANG=["RV","RG"];
function score(s){
  const items=s.list.map(n=>ITEMS[n-1]);
  const r={ total:0, max:items.length, L:0, R:0, lv:{} };
  items.forEach(it=>{ const ok=s.ans[it.n]===it.a; if(ok) r.total++; if(it.p==="R"){ if(ok) r.R++; } else if(ok) r.L++;
    (r.lv[it.lv] ||= [0,0]); r.lv[it.lv][1]++; if(ok) r.lv[it.lv][0]++; });
  r.cefr = r.max===100 ? cefrOf(r.total) : "–"; return r;
}
function diagnose(s){
  const items=s.list.map(n=>ITEMS[n-1]);
  const sk={}, fcs={}, sec={L:[0,0],R:[0,0]}, grp={LIS:[0,0],RLANG:[0,0],RCOMP:[0,0]}; let traps=0, skipped=0, wrong=0;
  items.forEach(it=>{ const a=s.ans[it.n], ok=a===it.a, S=SKILLS[it.sk].sec;
    (sk[it.sk] ||= [0,0,[]]); sk[it.sk][1]++; if(ok) sk[it.sk][0]++; else sk[it.sk][2].push(it.n);
    sec[S][1]++; if(ok) sec[S][0]++;
    const g=S==="L"?"LIS":RLANG.includes(it.sk)?"RLANG":"RCOMP"; grp[g][1]++; if(ok) grp[g][0]++;
    if(!ok){ if(a===undefined) skipped++; else { wrong++; if(/กับดัก|สับสน|แปลตามตัวอักษร/.test(it.w[a]||"")) traps++; }
      if(it.fc){ (fcs[it.fc] ||= {sec:S, ns:[]}).ns.push(it.n); } } });
  return { sk, fcs, sec, grp, traps, skipped, wrong };
}
function skillChip(it){ return `<span class="tag sk">${esc(SKILLS[it.sk].name)}</span>${it.fc?`<span class="tag" style="background:#fff3d6;color:#8a6300">${esc(it.fc)}</span>`:""}`; }
function whyHTML(it,a){
  if (a===undefined) return `<div class="explain"><b>ไม่ได้ตอบ</b> — คำตอบคือ (${"abcd"[it.a]}) ${esc(it.o[it.a])}<br>${esc(it.ex)}</div>`;
  if (a===it.a) return `<div class="explain"><b>✓ ถูกต้อง</b> — ${esc(it.ex)}</div>`;
  return `<div class="explain" style="border-left-color:var(--bad);background:var(--bad-soft)"><b>✗ คุณเลือก (${"abcd"[a]}) ${esc(it.o[a])}</b><br>ผิดเพราะ: ${esc(it.w[a]||"")}</div>
    <div class="explain" style="border-left-color:var(--ok);background:var(--ok-soft)"><b>✓ คำตอบที่ถูก (${"abcd"[it.a]}) ${esc(it.o[it.a])}</b><br>${esc(it.ex)}</div>`;
}
const pctv=v=>v&&v[1]?Math.round(v[0]/v[1]*100):null;
function barRow(label,v){ const p=v[0]/v[1]*100, col=p>=70?"var(--ok)":p>=50?"#d4a017":"var(--bad)";
  return `<div class="bar" style="grid-template-columns:minmax(150px,1.4fr) 1fr 92px"><span>${label}</span><div class="t"><i style="width:${p}%;background:${col}"></i><span class="th" style="left:70%"></span></div><span class="n">${v[0]}/${v[1]} (${Math.round(p)}%)</span></div>`; }

function finish(auto, why){
  const s=state.session; if(!s||s.finished) return;
  if (s.mode==="sim"&&engine){ engine.stop(); engine=null; }
  stopAudio();
  s.finished=true; s.secs=Math.round((Date.now()-s.start)/1000); s.result=score(s);
  const full=s.mode!=="practice";
  const label = s.mode==="sim"?"จำลองสอบ":s.mode==="room"?"สอบรวม":"ฝึก "+PARTS[s.part].name.split(" ").slice(0,2).join(" ");
  const d = diagnose(s);
  const rec={ date:Date.now(), label, mode:s.mode, part:s.part, sid:s.sid||null, setId:s.setId, setTitle:s.setTitle,
    total:s.result.total, max:s.result.max, L:full?s.result.L:null, R:full?s.result.R:null, cefr:s.result.cefr, secs:s.secs,
    sk:Object.fromEntries(Object.entries(d.sk).map(([k,v])=>[k,[v[0],v[1]]])),
    ans: s.list.map(n=>s.ans[n]===undefined?"-":"abcd"[s.ans[n]]).join("") };
  const h=LS.get("history",[]); h.push(rec); LS.set("history",h.slice(-50));
  if (s.mode==="room") saveRemote(rec);          // เก็บข้อมูลเฉพาะการสอบรวม
  presence();
  state.view="result"; state.review.filter="wrong"; state.autoMsg = auto ? (why||"หมดเวลา ระบบส่งคำตอบให้อัตโนมัติ") : ""; render(); window.scrollTo({top:0});
}
let saving=Promise.resolve();
function saveRemote(rec){
  if(!DB||!UID){ state.saveMsg="⚠️ บันทึกผลไปยังผู้คุมสอบไม่ได้ (ไม่ได้เชื่อมบัญชี) — กด 'คัดลอกผลสรุป' แล้วส่งให้ผู้คุมสอบ"; return; }
  state.saveMsg="กำลังส่งผลสอบ…";
  saving=saving.then(async()=>{ try{ const ref=DB.doc("results/"+UID); const sn=await ref.get(); const prev=sn.exists?(sn.data().attempts||[]):[];
      await ref.set({ name:state.name||"(ไม่ระบุชื่อ)", updatedAt:Date.now(), attempts:[...prev,rec].slice(-40) }); state.saveMsg="✓ ส่งผลสอบถึงผู้คุมสอบแล้ว"; }
    catch(e){ state.saveMsg="⚠️ ส่งผลไม่สำเร็จ ("+(e&&e.code||"error")+") — กด 'คัดลอกผลสรุป' แล้วส่งให้ผู้คุมสอบ"; }
    const el=$("#saveMsg"); if(el) el.textContent=state.saveMsg; });
}

  let rev="";

    rev = list.map(it=>{ const a=s.ans[it.n], ok=a===it.a, g=it.g?GROUPS[it.g]:null;

        ${it.p!=="R"?`<div class="script">${esc(scriptText(it))}</div>`:""}${it.p==="R"&&g&&g.kind!=="passage"?`<div class="script">${esc(g.text)}</div>`:""}
        ${it.q?`<div class="qtext" style="font-size:16px;margin:10px 0 8px">${esc(it.q)}</div>`:""}

    </div>

      <div class="grid2" style="margin-top:6px"><div>${block(Lkeys,"🎧 ทักษะการฟัง")}</div><div>${block(RLANG,"✏️ ไวยากรณ์และคำศัพท์")}${block(RCOMP,"📖 ความเข้าใจการอ่าน (Reading comprehension)")}</div></div>
      <p class="muted small">แถบเขียว ≥ 70% · เหลือง 50–69% · แดง &lt; 50%</p>

        ${canReview?`<p class="small">ดูข้อที่ผิดด้านล่าง — แต่ละข้อบอกว่าตัวเลือกที่เลือก <b>ผิดเพราะอะไร</b> และทำไมคำตอบที่ถูกจึงถูก</p>`:`<p class="small">ชุดนี้ผู้คุมสอบไม่เปิดเฉลยรายข้อ — ใช้ผลวิเคราะห์จุดอ่อนด้านบนไปฝึกต่อในชุดฝึก</p>`}
        <div class="navrow" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn primary" id="home">กลับหน้าหลัก</button><button class="btn" id="copy">คัดลอกผลสรุป</button></div>
        <div class="small muted" id="copyMsg"></div></div></div>
    ${canReview?`<div class="card" style="margin-top:16px"><h3>ทบทวนข้อสอบ: ผิดตรงไหน เพราะอะไร</h3>
      <div class="tabs">${[["wrong","ข้อที่ผิด/ไม่ได้ตอบ"],["all","ทั้งหมด"],["L","Listening"],["R","Reading"]].map(([k,t])=>`<button data-f="${k}" class="${state.review.filter===k?"on":""}">${t}</button>`).join("")}</div>${rev}</div>`:""}
  </div>`;
}

/* ================= tutor dashboard (สอบรวมเท่านั้น) ================= */
let tutorRows=null, tutorErr="", tutorSid=null;
function loadTutor(){
  tutorRows=null; tutorErr="";
  if(!DB){ tutorErr="ยังเชื่อมฐานข้อมูลไม่ได้ในมุมมองนี้"; render(); return; }
  const t=setTimeout(()=>{ if(!tutorRows){ tutorErr="ยังโหลดข้อมูลไม่ได้ ลองใหม่อีกครั้ง"; render(); } },10000);
  DB.collection("results").get().then(sn=>{ clearTimeout(t); tutorRows=sn.docs.map(d=>({id:d.id,...d.data()})); render(); })
    .catch(e=>{ clearTimeout(t); tutorErr="โหลดไม่สำเร็จ ("+(e&&e.code||"error")+")"; render(); });
}
function tutorView(){
  let body;
  if(tutorErr) body=`<p class="muted">${esc(tutorErr)}</p>`;
  else if(!tutorRows) body=`<p class="muted">กำลังโหลด…</p>`;
  else {
    const all=[]; tutorRows.forEach(u=>(u.attempts||[]).filter(a=>a.mode==="room").forEach(a=>all.push({...a,name:u.name})));
    const sids=[...new Set(all.map(a=>a.sid))].sort().reverse();
    if (!tutorSid || !sids.includes(tutorSid)) tutorSid = sids[0]||null;
    if (!tutorSid) body=`<p class="muted">ยังไม่มีผลสอบรวม — เปิดห้องสอบรวม แล้วให้น้องๆ เข้าสอบ ผลจะขึ้นที่นี่</p>`;
    else {
      const rows=all.filter(a=>a.sid===tutorSid).sort((a,b)=>b.total-a.total);
      const avg=(rows.reduce((x,a)=>x+a.total,0)/rows.length).toFixed(1);
      const dist={}; rows.forEach(a=>dist[a.cefr]=(dist[a.cefr]||0)+1);
      const fmtSid=s=>`${s.slice(7,9)}/${s.slice(5,7)}/${s.slice(1,5)} ${s.slice(9,11)}:${s.slice(11,13)}`;
      // item analysis
      const set = PRACTICE_SETS.find(x=>x.id===rows[0].setId) || (EXAM_SETS||[]).find(x=>x.id===rows[0].setId);
      let items="";
      if (set){ const st=set.items.map(it=>{ let c=0; rows.forEach(a=>{ if(a.ans&&a.ans[it.n-1]==="abcd"[it.a]) c++; }); return {n:it.n, p:c/rows.length, sk:it.sk}; });
        const hard=st.filter(x=>x.p<0.5).sort((a,b)=>a.p-b.p);
        items=`<h3 style="margin-top:16px">ข้อที่ทั้งห้องพลาดมาก (ถูก &lt; 50%)</h3>${hard.length?`<div class="small">${hard.slice(0,20).map(x=>`<span class="tag no" style="display:inline-block;margin:0 6px 6px 0">ข้อ ${x.n} · ${Math.round(x.p*100)}% · ${esc(SKILLS[x.sk].name)}</span>`).join("")}</div>`:`<p class="muted small">ไม่มี</p>`}`;
        const skAgg={}; rows.forEach(a=>Object.entries(a.sk||{}).forEach(([k,[c,n]])=>{ (skAgg[k] ||= [0,0]); skAgg[k][0]+=c; skAgg[k][1]+=n; }));
        items += `<h3 style="margin-top:16px">ทักษะของทั้งห้อง</h3><div class="bars">${Object.keys(skAgg).sort((a,b)=>skAgg[a][0]/skAgg[a][1]-skAgg[b][0]/skAgg[b][1]).map(k=>barRow(esc(SKILLS[k].name),skAgg[k])).join("")}</div>`;
      } else items=`<p class="small muted">โหลดชุดสอบเพื่อวิเคราะห์รายข้อไม่ได้</p>`;
      body = `<div class="tabs">${sids.map(x=>{ const a=all.find(y=>y.sid===x); return `<button data-sid="${x}" class="${tutorSid===x?"on":""}">${fmtSid(x)} · ${esc(a.setTitle||"")}</button>`; }).join("")}</div>
        <p class="small muted">${rows.length} คน · เฉลี่ย ${avg}/100 · ${Object.entries(dist).map(([k,v])=>k+" "+v+" คน").join(" · ")}</p>
        <table class="hist"><tr><th>อันดับ</th><th>ชื่อ</th><th class="right">คะแนน</th><th class="right">ฟัง/60</th><th class="right">อ่าน/40</th><th>CEFR</th><th>ทักษะที่อ่อนที่สุด</th></tr>
        ${rows.map((a,i)=>{ const w=Object.entries(a.sk||{}).sort((x,y)=>x[1][0]/x[1][1]-y[1][0]/y[1][1])[0];
          return `<tr><td>${i+1}</td><td><b>${esc(a.name||"-")}</b></td><td class="right"><b>${a.total}</b></td><td class="right">${a.L}</td><td class="right">${a.R}</td><td>${esc(a.cefr)}</td><td class="small">${w?esc(SKILLS[w[0]].name)+` (${w[1][0]}/${w[1][1]})`:""}</td></tr>`; }).join("")}</table>${items}`;
    }
  }
  return `<div class="wrap"><div class="card"><div style="display:flex;align-items:center;gap:10px"><h2 style="flex:1">📊 ผลสอบรวม</h2><button class="btn" id="reload">รีเฟรช</button><button class="btn primary" id="home">กลับ</button></div>
  <p class="muted small">เก็บเฉพาะผลจากห้องสอบรวม · การฝึกส่วนตัวของน้องๆ ไม่ถูกเก็บ</p>${body}</div></div>`;
}

/* ================= events ================= */
function needName(){ if(state.name) return false; const i=$("#nm"); if(i){ i.focus(); i.style.outline="2px solid var(--bad)"; } return true; }
function alertModal(msg){ modal(`<p>${esc(msg)}</p><div class="navrow"><span></span><button class="btn primary" data-close>ตกลง</button></div>`); }
function bind(){
  const on=(sel,fn)=>document.querySelectorAll(sel).forEach(el=>el.addEventListener("click",fn));
  const nm=$("#nm"); if(nm) nm.addEventListener("input",e=>{ state.name=e.target.value.trim(); LS.set("name",state.name); });
  document.querySelectorAll("[data-seg]").forEach(sg=>sg.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
    const k=sg.dataset.seg, v=b.dataset.v;
    if(k==="pace"){ state.pace=v; LS.set("pace",v); } else if(k==="gap"){ state.gap=+v; LS.set("gap",+v); } else if(k==="sgap"){ state.sgap=+v; LS.set("sgap",+v); } else if(k==="rgap"){ state.realGap=+v; LS.set("rgap20",+v); }
    else if(k==="raudio") state.room.audio=v; else if(k==="rreveal") state.room.reveal = v==="true";
    render(); })));
  on("[data-setid]", e=>{ state.setId=e.currentTarget.dataset.setid; LS.set("setId",state.setId); render(); });
  on("[data-rset]", e=>{ state.room.setId=e.currentTarget.dataset.rset; render(); });
  on("[data-act]", e=>{ const b=e.currentTarget, a=b.dataset.act;
    if (a==="tutor"){ state.view="tutor"; if(EXAM_SETS===null) loadExamSets().then(()=>render()); loadTutor(); return render(); }
    if (a==="proctor"){ state.view="proctor"; if(EXAM_SETS===null) loadExamSets().then(()=>{ state.room.setId=null; render(); }); if(ROOM) try{ ROOM.presence({role:"proctor", name:state.name||"ผู้คุมสอบ"}); }catch(e){} return render(); }
    if (needName()) return;
    if (a==="practice") startPractice(b.dataset.part);
    else if (a==="sim") soundCheck(startSim);
    else if (a==="join"){ state.session=null; state.roomErr=""; state.view="lobby"; presence({answered:0,done:false}); render();
      if (roomState && roomState.status==="listening" && !(roomState.audio==="each"&&!state.soundOk)) enterRoomExam(roomState); } });
  on("#reload", loadTutor);
  on("[data-sid]", e=>{ tutorSid=e.currentTarget.dataset.sid; render(); });
  on("#home", ()=>{ if(engine && state.view!=="proctor"){ engine.stop(); engine=null; } state.view="home"; state.session=null; render(); });
  on("#enterNow", ()=>enterRoomExam(roomState));
  on("#lobbySound", ()=>soundCheck(()=>{ render(); if(roomState&&roomState.status!=="ended") enterRoomExam(roomState); }));
  on("#pStart", ()=>{ if(state.room.audio==="speaker") soundCheck(startProctor,{room:true}); else startProctor(); });
  on("#pNew", ()=>{ proctor=null; engine=null; render(); });
  const imp=$("#impSet"); if(imp) imp.addEventListener("change", async e=>{
    const msg=$("#impMsg"); const files=[...e.target.files]; let ok=0, bad=[];
    if(!DB){ msg.textContent="เชื่อมฐานข้อมูลไม่ได้ในมุมมองนี้"; return; }
    for (const f of files){ try{ const set=JSON.parse(await f.text());
        if(!set.id||set.kind!=="exam"||!Array.isArray(set.items)||set.items.length!==100) throw 0;
        await DB.doc("examsets/"+set.id).set(set); ok++; }catch(err){ bad.push(f.name); } }
    msg.textContent = `นำเข้าแล้ว ${ok} ชุด`+(bad.length?` · ไม่สำเร็จ: ${bad.join(", ")}`:"");
    await loadExamSets(); state.room.setId=null; render(); const m2=$("#impMsg"); if(m2) m2.textContent = `นำเข้าแล้ว ${ok} ชุด`+(bad.length?` · ไม่สำเร็จ: ${bad.join(", ")}`:""); });
  on("#pEnd", ()=>modal(`<h3>สิ้นสุดการสอบ?</h3><p class="muted">ทุกเครื่องจะส่งคำตอบทันที</p><div class="navrow"><button class="btn" data-close>ยกเลิก</button><button class="btn primary" id="endYes">สิ้นสุด</button></div>`, ()=>on("#endYes",()=>{ closeModal(); endProctor(); })));
  on("#pPause", ()=>{ if(!engine) return; engine.paused=!engine.paused; if(engine.paused) stopAudio(); render(); });
  if (state.view==="exam"){
    const s=state.session, item=cur();
    on("[data-opt]", e=>{ s.ans[item.n]=+e.currentTarget.dataset.opt; if(s.mode==="room") presence(); render(); });
    on("#prev", ()=>go(s.idx-1)); on("#next", ()=>go(s.idx+1));
    on("[data-go]", e=>go(+e.currentTarget.dataset.go));
    on("#followBtn", ()=>{ const i=s.list.indexOf(s.live.cur); if(i>=0) go(i); });
    on("#check", ()=>{ s.revealed[item.n]=true; if(item.g) ITEMS.filter(x=>x.g===item.g&&s.ans[x.n]!==undefined).forEach(x=>s.revealed[x.n]=true); render(); });
    on("#playBtn", ()=>{ const key=audioKey(item); if(speakingKey===key){ stopAudio(); render(); return; }
      s.played[key]=true; speakingKey=key; render(); say(linesFor(item)).then(()=>{ speakingKey=null; render(); }); });
    on("#finish", ()=>{ const left=s.list.filter(n=>s.ans[n]===undefined).length;
      modal(`<h3>ส่งคำตอบ?</h3><p class="muted">${left?`ยังไม่ได้ตอบ ${left} ข้อ`:"ตอบครบทุกข้อแล้ว"}</p><div class="navrow"><button class="btn" data-close>กลับไปตรวจ</button><button class="btn primary" id="sendYes">ส่งคำตอบ</button></div>`, ()=>on("#sendYes",()=>{ closeModal(); finish(false); })); });
    on("#quit", ()=>modal(`<h3>ออกจากการสอบ?</h3><p class="muted">${s.mode==="room"?"ถ้าออก ผลสอบรอบนี้จะไม่ถูกส่ง":"คำตอบในรอบนี้จะไม่ถูกบันทึก"}</p><div class="navrow"><button class="btn" data-close>ทำต่อ</button><button class="btn primary" id="quitYes">ออก</button></div>`,
      ()=>on("#quitYes",()=>{ closeModal(); if(engine&&s.mode==="sim"){ engine.stop(); engine=null; } stopAudio(); state.view="home"; state.session=null; render(); })));
  }
  if (state.view==="result"){
    on("[data-f]", e=>{ state.review.filter=e.currentTarget.dataset.f; render(); });
    on("#copy", ()=>{ const s=state.session, r=s.result, d=diagnose(s);
      const weak=Object.keys(d.sk).filter(k=>d.sk[k][0]/d.sk[k][1]<0.7).sort((a,b)=>d.sk[a][0]/d.sk[a][1]-d.sk[b][0]/d.sk[b][1]).slice(0,3).map(k=>SKILLS[k].name+` (${d.sk[k][0]}/${d.sk[k][1]})`).join(", ")||"-";
      const txt=`RTAFET Practice — ${state.name}\n${s.setTitle} · ${s.mode==="practice"?"ฝึก "+PARTS[s.part].name:s.mode==="sim"?"จำลองสอบ":"สอบรวม"}\nคะแนน ${r.total}/${r.max}${s.mode!=="practice"?` (Listening ${r.L}/60, Reading ${r.R}/40) · CEFR ${r.cefr}`:""}\nทักษะที่ควรฝึก: ${weak}`;
      navigator.clipboard.writeText(txt).then(()=>$("#copyMsg").textContent="คัดลอกแล้ว").catch(()=>$("#copyMsg").textContent="คัดลอกไม่ได้ในอุปกรณ์นี้"); });
  }
}
function modal(html,after){ $("#modalBody").innerHTML=html; $("#modal").classList.remove("hide"); document.querySelectorAll("#modal [data-close]").forEach(b=>b.addEventListener("click",closeModal)); after&&after(); }
function closeModal(){ $("#modal").classList.add("hide"); }
document.addEventListener("keydown", e=>{
  if (state.view!=="exam"||!$("#modal").classList.contains("hide")||e.target.tagName==="INPUT") return;
  const k=e.key.toLowerCase(), s=state.session, item=cur();
  if (k.length===1&&"abcd".includes(k)&&!(s.mode==="practice"&&s.revealed[item.n])){ s.ans[item.n]="abcd".indexOf(k); if(s.mode==="room") presence(); render(); }
  else if (e.key==="ArrowRight") go(s.idx+1); else if (e.key==="ArrowLeft") go(s.idx-1);
});
$("#roleLabel").addEventListener("click", ()=>{ if(!REAL_ADMIN) return; if(state.view==="exam"||(state.view==="proctor"&&proctor)) return alertModal("ออกจากหน้าสอบ/ห้องสอบก่อน แล้วค่อยสลับมุมมอง"); IS_ADMIN=!IS_ADMIN; state.view="home"; render(); window.scrollTo({top:0}); });

async function sha(s){ try{ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }catch(e){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))|0; return "x"+h; } }

  _s(n,v){ try{ localStorage.setItem(this.k+n, JSON.stringify(v)); }catch(e){} },
  roster(){ return this._g("roster",[]); },
  saveRoster(r){ this._s("roster",r); },

  async checkPin(id,pin){ const m=this.roster().find(x=>x.id===id); return m && m.pin===await sha(id+":"+pin); },
  resetPin(id){ const r=this.roster(); const m=r.find(x=>x.id===id); if(m){ delete m.pin; this.saveRoster(r);} },
  vmarks(id){ return this._g("vm:"+id,{}); }, setVmark(id,w,v){ const m=this.vmarks(id); if(v==null) delete m[w]; else m[w]=v; this._s("vm:"+id,m); },
  toggleStar(id){ const r=this.roster(); const m=r.find(x=>x.id===id); if(m){ m.star=!m.star; this.saveRoster(r);} },
  clear(){ ["roster","attempts","tutorPin"].forEach(n=>{ try{ localStorage.removeItem(this.k+n);}catch(e){} }); }

async function seedDemo(){
  const ranks=["จ.ต.","จ.ท.","จ.อ.","จ.อ.หญิง","พ.อ.ต.","พ.อ.อ.","ร.ต.","ร.อ.","ร.ท.หญิง","น.ต.","น.ท.","น.อ.","พล.อ.ต.","นางสาว","นาย"];
  const names=[["กิตติ","ใจดี"],["ธนา","ศรีสุข"],["วีรยุทธ","แก้วกล้า"],["ปิยะ","มั่นคง"],["สุรเชษฐ์","บุญมา"],["ณัฐพล","ทองดี"],["อนุชา","พรหมมา"],["ชยพล","วงศ์ใหญ่"],["ศุภชัย","รุ่งเรือง"],["พงศกร","เพชรงาม"],["ธีรวัฒน์","สายทอง"],["วรเมธ","จันทร์เพ็ญ"],["นันทวัฒน์","ดวงแก้ว"],["ภาณุ","สุขสวัสดิ์"],["อรรถพล","ชัยมงคล"],["กฤษดา","ทวีผล"],["จิรายุ","ศักดิ์ดี"],["ปวริศ","นาคสวัสดิ์"],["ธนกร","พึ่งบุญ"],["รัฐพล","อินทร์แก้ว"]];
  const units=UNITS;
  let seed=7; const rnd=()=>((seed=(seed*1103515245+12345)&0x7fffffff)/0x7fffffff);
  const roster=names.map((n,i)=>({id:"M"+String(i+1).padStart(3,"0"), rank:ranks[(i*7)%ranks.length], first:n[0], last:n[1], unit:units[i%units.length], star: i%6===0, type: i===13?"ผู้สนใจ":""}));
  const skTot={}; PRACTICE_SETS[0].items.forEach(it=>skTot[it.sk]=(skTot[it.sk]||0)+1);
  const now=Date.now(), atts=[];
  roster.forEach((m,i)=>{
    const base=0.32+rnd()*0.5, growth=(rnd()-0.2)*0.12, off={}; SK_ORDER.forEach(k=>off[k]=(rnd()-0.5)*0.35);
    off.LI-=0.12; off.RI-=0.1; off.LG-=0.06;            // จุดอ่อนร่วมของกอง (ตัวอย่าง)
    const n=2+Math.floor(rnd()*8); if (i===19) return;   // 1 คนยังไม่เคยทำ
    for(let j=0;j<n;j++){
      const t=j/(Math.max(1,n-1)), d=now-(55-Math.round(t*52)+Math.floor(rnd()*3))*DAY;
      const sk={}; let L=0,R=0;
      SK_ORDER.forEach(k=>{ const p=Math.min(0.97,Math.max(0.05, base+off[k]+growth*j+(rnd()-0.5)*0.15)); let c=0; for(let q=0;q<skTot[k];q++) if(rnd()<p) c++; sk[k]=[c,skTot[k]]; if(SKILLS[k].sec==="L") L+=c; else R+=c; });
      const total=L+R;
      atts.push({memberId:m.id, date:d, mode:j%3===2?"room":"sim", label:j%3===2?"สอบรวม":"จำลองสอบ", setTitle:j%3===2?"ชุดสอบ 1":"ชุดฝึก 1", total, max:100, L, R, cefr:cefrOf(total), sk, demo:true});
    }
  });
  Store.saveRoster(roster); Store._s("attempts",atts); Store._s("tutorPin", await sha("tutor:111111"));
}

function memberStats(id){
  const all=Store.attempts().filter(a=>a.memberId===id).sort((a,b)=>a.date-b.date);
  const full=all.filter(fullOnly);
  const last=full[full.length-1]||null, first=full[0]||null;
  const best=full.reduce((m,a)=>!m||a.total>m.total?a:m,null);
  const recent=full.slice(-3); const avg=recent.length? recent.reduce((s,a)=>s+a.total,0)/recent.length : null;
  const sk={}; all.slice(-5).forEach(a=>Object.entries(a.sk||{}).forEach(([k,[c,n]])=>{ (sk[k] ||= [0,0]); sk[k][0]+=c; sk[k][1]+=n; }));
  const delta = full.length>=2 ? last.total-first.total : null;
  const slope = full.length>=3 ? full.slice(-3).map(a=>a.total).reduce((s,v,i,arr)=>i?s+(v-arr[i-1]):0,0)/2 : null;
  return { all, full, last, first, best, avg, sk, delta, slope, lastDate: all.length? all[all.length-1].date : null };
}
function weakSkills(sk, n=3){ return Object.keys(sk).filter(k=>sk[k][1]).sort((a,b)=>pctOf(sk[a])-pctOf(sk[b])).slice(0,n); }

/* ---------- tutor dashboard ---------- */
function unitData(){
  const all0=filteredRoster(), finished=all0.filter(isDone), roster=all0.filter(m=>!isDone(m)), ids=new Set(roster.map(m=>m.id)), atts=Store.attempts().filter(a=>fullOnly(a)&&ids.has(a.memberId));
  const stats=roster.map(m=>({m, s:memberStats(m.id)}));
  const active=stats.filter(x=>x.s.last);
  const now=Date.now();
  // weekly series (8 weeks)
  const weeks=[]; for(let w=7;w>=0;w--){ const end=now-w*7*DAY, start=end-7*DAY; const a=atts.filter(x=>x.date>start&&x.date<=end);
    weeks.push({label:fmtD(end), n:a.length, avg:a.length?+(a.reduce((s,x)=>s+x.total,0)/a.length).toFixed(1):null,
      L:a.length?Math.round(a.reduce((s,x)=>s+x.L,0)/a.length/60*100):null, R:a.length?Math.round(a.reduce((s,x)=>s+x.R,0)/a.length/40*100):null}); }
  // unit skills (latest 5 attempts per member)
  const usk={}, weakCount={}; active.forEach(x=>Object.entries(x.s.sk).forEach(([k,v])=>{ (usk[k] ||= [0,0]); usk[k][0]+=v[0]; usk[k][1]+=v[1]; if(pctOf(v)<0.6) weakCount[k]=(weakCount[k]||0)+1; }));
  const dist={}; active.forEach(x=>dist[x.s.last.cefr]=(dist[x.s.last.cefr]||0)+1);
  const avgLatest = active.length ? active.reduce((s,x)=>s+x.s.last.total,0)/active.length : null;
  const active7 = new Set(Store.attempts().filter(a=>a.date>now-7*DAY&&ids.has(a.memberId)).map(a=>a.memberId)).size;
  const b1plus = active.filter(x=>x.s.last.total>=48).length;
  const watch = active.filter(x=>x.s.last.total<48 || (x.s.slope!=null&&x.s.slope<-3) || (x.s.lastDate&&now-x.s.lastDate>21*DAY)).map(x=>({...x, why:[x.s.last.total<48?"ต่ำกว่า B1":null, x.s.slope!=null&&x.s.slope<-3?"คะแนนลดลง":null, now-x.s.lastDate>21*DAY?"ไม่ได้ฝึก > 3 สัปดาห์":null].filter(Boolean)}));
  const never = stats.filter(x=>!x.s.all.length);
  const improved = active.filter(x=>x.s.delta!=null).sort((a,b)=>b.s.delta-a.s.delta).slice(0,5);
  return {roster, finished, stats, active, weeks, usk, weakCount, dist, avgLatest, active7, b1plus, watch, never, improved};
}

      <span class="small muted" style="margin-left:auto">จำได้แล้ว ${known}/${VOCAB.length}</span></div>
      <div class="tabs" style="margin:8px 0 0">${["all","A1","A2","B1","B2","C1"].map(k=>`<button data-vlv="${k}" class="${LV===k?"on":""}">${k==="all"?"ทุกระดับ":k}</button>`).join("")}<span class="small muted" style="align-self:center;margin-left:6px">แสดง ${list.length} คำ</span></div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><input class="text" id="vQ" placeholder="🔍 ค้นหาคำศัพท์" value="${esc(L.q)}" style="flex:1;min-width:200px;margin:0">
      ${seg("vmode",[["list","รายการ"],["card","แฟลชการ์ด"],["quiz","ทดสอบตัวเอง"]],L.mode)}</div>`;
    let inner="";
    if (!list.length) inner=`<p class="muted">ไม่มีคำในหมวดนี้</p>`;
    else if (L.mode==="list") inner=`<table class="hist" style="margin-top:12px"><tr><th>คำ/วลี</th><th>ความหมาย</th><th>ตัวอย่าง</th><th>ระดับ</th><th></th></tr>${list.map(v=>`<tr><td><b>${esc(v.w)}</b></td><td>${esc(v.th)}</td><td class="small" style="font-family:var(--serif)">${esc(v.ex)}</td><td><span class="lvl">${v.lv}</span></td>
      <td style="white-space:nowrap"><button class="btn" data-say="${esc(v.w+". "+v.ex)}" style="padding:3px 8px;font-size:12px">🔊</button> <button class="btn" data-vm="${esc(v.w)}" data-v="${marks[v.w]==="ok"?"":"ok"}" style="padding:3px 8px;font-size:12px">${marks[v.w]==="ok"?"✓ จำได้":"จำได้"}</button></td></tr>`).join("")}</table>`;
    else if (L.mode==="card"){ const i=((L.fc%list.length)+list.length)%list.length, v=list[i];
      inner=`<div style="max-width:520px;margin:18px auto;text-align:center">
        <div class="card" id="fcCard" style="min-height:200px;display:grid;place-items:center;cursor:pointer;border:2px solid var(--navy)">
          ${L.flip?`<div><div style="font-size:22px;font-weight:700">${esc(v.th)}</div><div style="font-family:var(--serif);margin-top:10px">${esc(v.ex)}</div></div>`:`<div><div style="font-size:26px;font-weight:700;font-family:var(--serif)">${esc(v.w)}</div><div class="small muted" style="margin-top:8px">${VOCAB_CATS[v.cat]} · ${v.lv} · แตะเพื่อพลิก</div></div>`}</div>
        <div class="navrow"><button class="btn" id="fcPrev">←</button><span class="small muted">${i+1}/${list.length}</span>

    else { if(!L.quiz || L.quiz.key!==L.cat+L.q+LV){ const pool=shuffled(list,"q"+Date.now()).map(x=>x[0]).slice(0,10); L.quiz={key:L.cat+L.q+LV, items:pool, i:0, score:0, pick:null}; }

      else { const v=Q.items[Q.i]; const opts=shuffled([v,...shuffled(VOCAB.filter(x=>x.w!==v.w),v.w).slice(0,3).map(x=>x[0])],v.w+Q.i).map(x=>x[0]);

          ${Q.pick!=null?`<div class="explain" style="font-family:var(--serif)">${esc(v.ex)}</div><div class="navrow"><span></span><button class="btn primary" id="vqNext">ถัดไป →</button></div>`:""}</div>`; } }

        <h2 style="margin-top:12px">${esc(g.title)} <span class="lvl">${g.lv}</span></h2>
        <div class="explain" style="white-space:pre-wrap;font-size:15.5px">${esc(g.explain)}</div>
        <h3 style="margin-top:14px">โครงสร้าง</h3><div class="script" style="font-size:16px">${esc(g.form)}</div>
        <h3 style="margin-top:14px">ตัวอย่าง</h3>${g.ex.map(([e,t])=>`<div class="rev" style="margin-bottom:6px"><span style="font-family:var(--serif)">${esc(e)}</span> <button class="btn" data-say="${esc(e)}" style="padding:2px 7px;font-size:12px">🔊</button><div class="small muted">${esc(t)}</div></div>`).join("")}
        <div class="note" style="margin-top:10px">⚠️ <b>กับดักที่ออกสอบบ่อย:</b> ${esc(g.traps)}</div>
        <h3 style="margin-top:16px">ลองทำ (${Object.keys(ans).filter(k=>ans[k]===0).length}/${g.quiz.length} ถูก)</h3>
        ${g.quiz.map((q,qi)=>{ const order=shuffled(q.o,g.id+qi); const picked=ans[qi]; return `<div class="rev"><div style="font-family:var(--serif);font-size:16px;margin-bottom:8px">${qi+1}. ${esc(q.q)}</div>
          ${order.map(([o,orig])=>{ let c=""; if(picked!=null){ if(orig===0) c="right"; else if(picked===orig) c="wrong"; } return `<button class="opt ${c}" data-gq="${qi}" data-orig="${orig}" ${picked!=null?"disabled":""} style="padding:8px 12px"><span>${esc(o)}</span></button>`; }).join("")}
          ${picked!=null?`<div class="explain">${picked===0?"✓ ถูกต้อง — ":"✗ ยังไม่ถูก — "}${esc(q.ex)}</div>`:""}</div>`; }).join("")}`;
    } else body=`<p class="small muted" style="margin-top:0">หัวข้อไวยากรณ์ที่ออกสอบบ่อยใน RTAFET / ALCPT / ECL — อธิบายเป็นภาษาไทย มีตัวอย่าง กับดัก และแบบฝึกท้ายบท</p>
