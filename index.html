<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTAFET Training — ศูนย์ปฏิบัติการทางอวกาศ ทอ.</title>
<link rel="icon" href="logo.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f2347; --navy2:#1a3566; --sky:#2f6fb5; --sky-soft:#e8f0fa;
  --gold:#c9a227; --ink:#16202e; --muted:#5d6b7e; --line:#dde3ec; --bg:#f4f6f9; --card:#fff;
  --ok:#1f8a5b; --ok-soft:#e5f5ec; --bad:#c2410c; --bad-soft:#fdeee6; --warn:#a16207;
  --r:12px; --sans:'IBM Plex Sans Thai',system-ui,sans-serif; --serif:'Source Serif 4',Georgia,serif;
}
*{box-sizing:border-box}
:root{color-scheme:light}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
button{font:inherit;cursor:pointer;color:var(--ink)}
.wrap{max-width:1080px;margin:0 auto;padding:20px 18px 60px}
header.top{background:var(--navy);color:#fff}
header.top .wrap{padding:14px 18px;display:flex;align-items:center;gap:14px}
.crest{width:38px;height:38px;border-radius:50%;background:linear-gradient(140deg,var(--gold),#8a6d12);display:grid;place-items:center;font-weight:700;color:var(--navy);font-size:13px;letter-spacing:.5px;flex:none}
.top h1{font-size:17px;margin:0;font-weight:600}
.top .sub{font-size:12.5px;opacity:.75}
.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:500}
.pill.gold{background:rgba(201,162,39,.18);color:#f3dc8b}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
h2{font-size:20px;margin:0 0 6px}
h3{font-size:16px;margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
table.spec{width:100%;border-collapse:collapse;font-size:14px}
table.spec td,table.spec th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.spec th{font-weight:600;color:var(--muted);font-size:12.5px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 16px;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--sky)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy2)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mode{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:10px}
.mode:hover{border-color:var(--sky);background:var(--sky-soft)}
.mode b{display:block;font-size:15.5px}
.mode span{font-size:13.5px;color:var(--muted)}
input.text{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:6px 0 4px}
input.text:focus{outline:2px solid var(--sky);border-color:transparent}
/* exam */
.exambar{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff}
.exambar .wrap{padding:10px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:17px;background:rgba(255,255,255,.1);padding:4px 12px;border-radius:8px}
.timer.low{background:#b45309}
.progress{flex:1;min-width:120px;height:6px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);width:0}
.partlabel{font-size:13px;opacity:.85}
.qlayout{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
.qlayout.split{grid-template-columns:1fr 1fr}
@media(max-width:860px){.qlayout.split{grid-template-columns:1fr}}
.stimulus{font-family:var(--serif);font-size:16.5px;line-height:1.7;white-space:pre-wrap;max-height:68vh;overflow:auto}
.stimulus.box{border:2px solid var(--ink);border-radius:6px;padding:16px;background:#fffdf6}
.stimulus.email{font-family:var(--sans);font-size:15px;background:#fbfcfe}
.stimtitle{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--muted);margin-bottom:8px}
.qnum{font-size:13px;color:var(--muted);font-weight:500;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lvl{font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--sky-soft);color:var(--sky)}
.qtext{font-family:var(--serif);font-size:18px;margin:10px 0 14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:9px;font-family:var(--serif);font-size:16.5px;color:var(--ink)}
.opt:hover{border-color:var(--sky)}
.opt:disabled{color:var(--ink);cursor:default}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--muted)}
.opt.sel{border-color:var(--navy);background:var(--sky-soft)}
.opt.sel .k{background:var(--navy);border-color:var(--navy);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.audio{display:flex;align-items:center;gap:12px;background:var(--sky-soft);border-radius:10px;padding:12px 14px;margin:8px 0 14px}
.play{width:46px;height:46px;border-radius:50%;border:none;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none}
.play:disabled{background:#9aa6b8}
.play svg{width:20px;height:20px}
.wave{display:flex;gap:3px;align-items:center;height:22px}
.wave i{width:3px;background:var(--sky);border-radius:2px;height:6px}
.speaking .wave i{animation:w 0.9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes w{0%,100%{height:5px}50%{height:20px}}
.explain{border-left:4px solid var(--gold);background:#fffaf0;padding:12px 14px;border-radius:0 10px 10px 0;margin-top:12px;font-size:15px}
.script{font-family:var(--serif);font-size:15px;background:#f7f8fb;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin-top:10px;white-space:pre-wrap}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.navrow .btn{white-space:nowrap}
@media(max-width:560px){.navrow .btn{padding:10px 12px;font-size:14.5px}.top .pill{display:none}}
.palette{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;margin-top:18px}
@media(max-width:700px){.palette{grid-template-columns:repeat(10,1fr)}}
.palette button{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:11.5px;padding:5px 0;color:var(--muted)}
.palette button.done{background:var(--navy);color:#fff;border-color:var(--navy)}
.palette button.cur{outline:2px solid var(--gold);outline-offset:1px}
.palette button.r{background:var(--ok);border-color:var(--ok);color:#fff}
.palette button.x{background:var(--bad);border-color:var(--bad);color:#fff}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
/* results */
.scorehero{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:760px){.scorehero{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .v{font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.stat.hero{background:var(--navy);color:#fff;border-color:var(--navy)}
.stat.hero .l{color:#c8d3e6}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:40px 1fr 104px;gap:10px;align-items:center;font-size:14px}
.bar .t{height:14px;background:#eef1f6;border-radius:7px;overflow:hidden;position:relative}
.bar .t i{display:block;height:100%;background:var(--sky);border-radius:7px}
.bar .t .th{position:absolute;left:60%;top:-3px;bottom:-3px;width:2px;background:var(--gold)}
.bar .n{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13.5px}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.rev{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;background:#fff}
.rev .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.tag{font-size:12px;border-radius:6px;padding:1px 8px;font-weight:600}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.no{background:var(--bad-soft);color:var(--bad)} .tag.sk{background:#f1f3f6;color:var(--muted)}
.note{font-size:13px;color:var(--muted);background:#f1f4f8;border-radius:10px;padding:10px 12px}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.45);display:grid;place-items:center;z-index:20;padding:18px}
.modal .card{max-width:440px;width:100%}
.hide{display:none!important}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist td,.hist th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.hist th{color:var(--muted);font-weight:600;font-size:12.5px}
.right{text-align:right}

.livebar{display:flex;align-items:center;gap:12px;background:#fff7e0;border:1px solid #f0d27a;border-radius:10px;padding:10px 14px;margin:8px 0 14px}
.livebar .dot{width:10px;height:10px;border-radius:50%;background:#dc2626;animation:blink 1s infinite;flex:none}
@keyframes blink{50%{opacity:.25}}
.cd{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;min-width:44px;text-align:center;color:var(--navy)}
.big{font-size:64px;font-weight:700;line-height:1;color:var(--navy);font-variant-numeric:tabular-nums}
.peers{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.peer{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.peer.done{background:var(--ok-soft);border-color:#b7e2c9}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:#fff;padding:6px 12px;font-size:14px}
.seg button.on{background:var(--navy);color:#fff}
.palette button:disabled{opacity:.35;cursor:not-allowed}
.waiting{text-align:center;padding:50px 20px}
select.text,textarea.text{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink);margin:6px 0 4px}
textarea.text{min-height:150px;resize:vertical}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <img src="logo.png" alt="ศูนย์ปฏิบัติการทางอวกาศกองทัพอากาศ" style="width:58px;height:58px;flex:none;object-fit:contain;margin:-6px 0">

  <div class="spacer"></div>
  <button class="pill gold" id="roleLabel" style="border:none;cursor:pointer;font:inherit;font-size:12.5px"></button>
</div></header>
<div id="app"></div>
<div id="modal" class="modal hide"><div class="card" id="modalBody"></div></div>

ord \"mitigate\" in paragraph 3 is closest in meaning to __________.","o":["predict","measure","reduce","ignore"],"w":["กฎไม่ได้มีไว้ทำนาย แต่ไว้ลดความเสี่ยง","กฎไม่ได้มีไว้วัด แต่ไว้ลดความเสี่ยง",null,"หน่วยงานออกกฎเพื่อจัดการความเสี่ยง ไม่ใช่เพิกเฉย"],"a":2,"ex":"mitigate = บรรเทา ลด","sk":"RC","fc":null},{"n":91,"p":"R","lv":"B2","sub":"Passage","s":null,"g":"pDebris","q":"The Kessler syndrome describes a situation in which __________.","o":["collisions cause a chain reaction of further collisions","satellites run out of fuel","debris burns up in the atmosphere","space agencies refuse to share data"],"w":[null,"เรื่องเชื้อเพลิงอยู่ย่อหน้า 2 ไม่เกี่ยวกับ Kessler syndrome","burn up เป็นวิธีแก้ปัญหา ไม่ใช่ตัว Kessler syndrome","ไม่ได้กล่าวถึงการแบ่งปันข้อมูล"],"a":0,"ex":"collisions generate more debris, which in turn causes further collisions","sk":"RD","fc":null},{"n":92,"p":"R","lv":"B2","sub":"Passage","s":null,"g":"pDebris","q":"What can be inferred about debris-removal technology?","o":["It is not yet widely used, partly because it is expensive.","It is cheaper than launching a satellite.","It is required by all space agencies.","It has already cleaned most of low Earth orbit."],"w":[null,"cost remains a significant obstacle = ยังแพง","สิ่งที่บังคับคือ graveyard orbit/burn up ไม่ใช่การเก็บขยะ","still testing = ยังไม่ได้ใช้จริงในวงกว้าง"],"a":0,"ex":"companies are also testing ... the cost remains a significant obstacle → ยังอยู่ขั้นทดสอบและแพง","sk":"RI","fc":null},{"n":93,"p":"R","lv":"B2","sub":"Passage","s":null,"g":"pDebris","q":"The word \"obstacle\" in paragraph 3 is closest in meaning to __________.","o":["solution","example","barrier","advantage"],"w":["ต้นทุนเป็นปัญหา ไม่ใช่ทางแก้","ไม่เข้ากับบริบท",null,"ความหมายตรงข้าม"],"a":2,"ex":"obstacle = อุปสรรค = barrier","sk":"RC","fc":null},{"n":94,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pAuto","q":"What is the central thesis of the passage?","o":["Pilots today are lazier than pilots in the past.","Automation should be removed from modern cockpits.","Automation improves safety but creates risks that call for a new human–machine relationship.","Accidents are mainly caused by poorly designed displays."],"w":["rooted less in laziness = ไม่ได้เกิดจากความขี้เกียจ","บทความบอกชัดว่า not to abandon automation",null,"การออกแบบจอแสดงผลเป็นแค่หนึ่งในวิธีแก้ — แคบเกินไป"],"a":2,"ex":"ย่อหน้าแรกและสุดท้าย: ระบบอัตโนมัติดี แต่มีความเสี่ยงแฝง ต้องปรับความสัมพันธ์คน–เครื่อง (ไม่ใช่เลิกใช้)","sk":"RM","fc":null},{"n":95,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pAuto","q":"According to paragraph 2, automation bias mainly results from __________.","o":["poorly trained designers","frequent system failures","the mental effort required to stay alert while monitoring reliable systems","pilots' lack of motivation"],"w":["ไม่ได้กล่าวถึงการฝึกผู้ออกแบบ","ระบบล้มเหลวนานๆ ครั้ง (rare failures)",null,"rooted less in laziness — ไม่ใช่เรื่องแรงจูงใจ"],"a":2,"ex":"rooted less in laziness than in the economics of attention ... vigilance, being cognitively costly","sk":"RD","fc":null},{"n":96,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pAuto","q":"The word \"atrophied\" in paragraph 2 is closest in meaning to __________.","o":["weakened","been tested","been recorded","improved"],"w":[null,"ไม่เข้ากับบริบท","ไม่เข้ากับบริบท","through disuse = ไม่ได้ใช้ จึงไม่ดีขึ้น"],"a":0,"ex":"atrophy = ฝ่อ เสื่อมลงเพราะไม่ได้ใช้ (through disuse)","sk":"RC","fc":null},{"n":97,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pAuto","q":"Why does the author describe the situation in paragraph 3 as paradoxical?","o":["Investigators lacked important information.","Crews always distrust automation.","Greater reliability can make failures more catastrophic.","Reliable systems never fail."],"w":["ลูกเรือมีข้อมูลครบ","ลูกเรือเชื่อระบบมากเกินไป ไม่ใช่ไม่ไว้ใจ",null,"บทความพูดถึง rare failures แปลว่าระบบล้มเหลวได้"],"a":2,"ex":"the more reliable a system appears, the more catastrophic its rare failures may become","sk":"RI","fc":null},{"n":98,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pAuto","q":"What did accident investigators repeatedly find?","o":["Crews had the necessary information but did not act on it.","Pilots ignored the automation completely.","The automation had never failed before.","Crews had no access to the right information."],"w":[null,"กลับกัน — ลูกเรือเชื่อว่าระบบรู้ดีกว่า","ไม่ได้กล่าวถึง","possessed all the information = มีข้อมูลครบ"],"a":0,"ex":"crews possessed all the information needed ... but failed to act on it","sk":"RD","fc":null},{"n":99,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pAuto","q":"The word \"scrutinise\" in paragraph 2 is closest in meaning to __________.","o":["approve","repair","examine carefully","ignore"],"w":["ไม่เข้ากับบริบท","ไม่เข้ากับบริบท",null,"ไม่เข้ากับ every output (ตรวจทุกผลลัพธ์)"],"a":2,"ex":"scrutinise = ตรวจพิจารณาอย่างละเอียด","sk":"RC","fc":null},{"n":100,"p":"R","lv":"C1","sub":"Passage","s":null,"g":"pAuto","q":"The phrase \"calibrated trust\" most nearly refers to __________.","o":["trusting only experienced pilots","trusting machines completely","refusing to rely on automation","trusting a system only as far as its reliability justifies"],"w":["ไม่ได้กล่าวถึงประสบการณ์นักบิน","neither blind faith = ไม่ใช่เชื่อแบบสุดใจ","nor reflexive suspicion = ไม่ใช่ระแวงไว้ก่อน",null],"a":3,"ex":"neither blind faith ... nor reflexive suspicion ... but an informed judgement of when, and how far, it can be relied upon","sk":"RC","fc":null}],"groups":{"c57":{"title":"Conversation","script":[["W","Flight Lieutenant Arun, how did the joint exercise with the Australian team go?"],["M","Overall it went smoothly. Communication was a bit tricky at first because of the radio terminology, but by day two we had agreed on standard phrases, and things improved a lot."],["W","Good to hear. Is there anything we should change next time?"],["M","I'd recommend a short terminology workshop before the exercise starts."]]},"t59":{"title":"Talk","script":[["N","Good morning, everyone. This is a reminder that, due to scheduled runway resurfacing, all training flights originally planned for Thursday will be relocated to Wing 4 at Takhli. Crews are to report to Hangar 2 no later than 0600 hours for transport. Personal equipment must be packed and labeled the night before, as there will be no opportunity to return to quarters once the convoy departs. Any crew member with a medical exemption should notify the duty officer by Wednesday noon."]]},"adBike":{"title":"ADVERTISEMENT","kind":"ad","text":"FOR SALE\nMountain bike — 2 years old\nVery good condition\nOnly 3,500 baht\n\nCall Nok: 081-555-0142\n(after 6 p.m. only)"},"ntPool":{"title":"NOTICE","kind":"notice","text":"FITNESS CENTER\n\nFrom 1–15 December the swimming pool will be closed for cleaning.\nThe gym and tennis courts will remain open as usual.\n\nWe apologise for any inconvenience.\n— Welfare Section"},"emClub":{"title":"E-MAIL","kind":"email","text":"To: All section staff\nFrom: Sqn. Ldr. Pim\nSubject: English lunch-hour club\n\nDear all,\n\nStarting next Tuesday, we will run an English conversation club in Meeting Room 3 from 12:15 to 12:50. Each week, one member will prepare a five-minute talk on a work-related topic, followed by an open discussion.\n\nAttendance is voluntary, but anyone planning to take the RTAFET this year is strongly encouraged to join. Please bring your own lunch. To sign up, reply to this e-mail by Friday.\n\nPim"},"pSleep":{"title":"Passage","kind":"passage","text":"Many people think that sleeping less is a good way to get more work done. However, research shows the opposite. When adults sleep fewer than six hours a night, their ability to concentrate drops, and they make more mistakes. This is especially dangerous for people who drive, operate machines or work night shifts.\n\nExperts recommend seven to nine hours of sleep for most adults. They also suggest going to bed at the same time every night, avoiding coffee in the late afternoon, and keeping phones out of the bedroom. Some military units now include sleep education in their training programs, because a well-rested soldier is safer and more effective than a tired one."},"pOpen":{"title":"Passage","kind":"passage","text":"Every year, the air base near the city opens its gates to the public for a family day. Visitors can look inside transport aircraft, watch a parachute demonstration and talk to pilots and engineers. Last year more than 15,000 people attended, so this year the organizers have added a second entrance and more shuttle buses from the city center.\n\nEntry is free, but visitors must show an ID card at the gate. Large bags, drones and pets are not allowed. Food stalls run by local communities will be open all day."},"pDebris":{"title":"Passage","kind":"passage","text":"Since the launch of Sputnik in 1957, humans have placed thousands of objects into orbit around the Earth. Many of these are no longer functional: dead satellites, spent rocket stages and fragments created by collisions and explosions. Together they form what is commonly called space debris.\n\nThe problem is not merely one of quantity but of speed. In low Earth orbit, objects travel at around 7.5 kilometres per second, so even a fragment the size of a coin can strike with the energy of a small explosive. Operators of active satellites must therefore monitor the paths of nearby objects and, when the risk of collision becomes too high, perform avoidance manoeuvres. Each manoeuvre consumes fuel, which shortens the operational life of the satellite.\n\nScientists have long warned of a scenario known as the Kessler syndrome, in which collisions generate more debris, which in turn causes further collisions. To mitigate this risk, many space agencies now require that satellites be moved into a 'graveyard' orbit or brought down to burn up in the atmosphere at the end of their missions. Several companies are also testing technologies to capture and remove existing debris, although the cost of such missions remains a significant obstacle."},"pAuto":{"title":"Passage","kind":"passage","text":"As cockpits have become increasingly automated, aviation safety has improved dramatically; yet the very systems designed to reduce human error have introduced subtler risks of their own. Chief among them is what researchers term automation bias: the tendency of operators to defer to computer-generated information even when it conflicts with other cues or with their own judgement.\n\nThe phenomenon is rooted less in laziness than in the economics of attention. A pilot monitoring a system that has behaved flawlessly for hundreds of hours has little reason to scrutinise its every output, and vigilance, being cognitively costly, gradually erodes. When the system eventually fails — often in an unusual situation that its designers did not anticipate — the crew may be slow to notice, and slower still to intervene, precisely because their manual skills have atrophied through disuse.\n\nParadoxically, then, the more reliable a system appears, the more catastrophic its rare failures may become. Accident investigators have repeatedly found that crews possessed all the information needed to recognise a problem but failed to act on it, having assumed that the automation 'knew better'.\n\nThe remedy, most experts agree, is not to abandon automation but to redesign the relationship between human and machine. Training programmes now emphasise regular manual flying practice, and interface designers are experimenting with displays that communicate a system's level of confidence rather than presenting its outputs as unqualified facts. The goal is calibrated trust: neither blind faith in the machine nor reflexive suspicion of it, but an informed judgement of when, and how far, it can be relied upon."}}}];

จความหลัก/จุดประสงค์ของบทความ","sec":"R","tip":"อ่านประโยคแรกของแต่ละย่อหน้าและย่อหน้าสุดท้าย ตัวเลือกที่แคบเกินไป (เป็นแค่รายละเอียด) หรือกว้างเกินไปมักผิด"},"RI":{"name":"อนุมานจากบทความ (Inference)","sec":"R","tip":"คำตอบต้องมีหลักฐานในบทความรองรับแม้ไม่ได้เขียนตรงๆ ตัดตัวเลือกที่สรุปเกินเลย หรือขัดกับคำบางคำ เช่น still, rare, every year"},"RC":{"name":"ความหมายศัพท์ในบริบท","sec":"R","tip":"อ่านประโยคก่อนและหลังคำนั้น แล้วลองแทนตัวเลือกลงไปในประโยค ตัวที่อ่านแล้วความหมายลื่นและสอดคล้องคือคำตอบ"}};

/* ================= audio ================= */
function linesFor(item){
  if (item.g && GROUPS[item.g] && GROUPS[item.g].script) {
    const g = GROUPS[item.g], grp = ITEMS.filter(x=>x.g===item.g);
    return [["N","Questions "+grp[0].n+" and "+grp[grp.length-1].n+" are based on the following "+(g.title||"conversation").toLowerCase()+"."], ...g.script,
            ...grp.map(x=>["N","Question "+x.n+". "+x.q])];
  }
  if (Array.isArray(item.s)) return [["N","Number "+item.n+"."], ...item.s, ["N", item.q]];
  return [["N","Number "+item.n+". "+item.s]];
}
function scriptText(item){
  const lines = item.g && GROUPS[item.g] && GROUPS[item.g].script ? GROUPS[item.g].script : (Array.isArray(item.s) ? item.s : [["",item.s]]);
  const name = {W:"Woman: ",M:"Man: ",N:""};
  return lines.map(([sp,t])=>(name[sp]||"")+t).join("\n");
}
const estSec = lines => 1 + lines.reduce((a,[,t])=>a+t.split(/\s+/).length,0)/2.4;
const audioKey = item => item.g ? "g:"+item.g : "i:"+item.n;
let speakingKey = null, audioEngine = "?";
function pickVoice(sp){
  const vs = speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)); if (!vs.length) return null;
  if (sp==="W") return vs.find(v=>/female|samantha|zira|susan|karen|jenny|aria|victoria/i.test(v.name))||vs[1%vs.length];
  if (sp==="M") return vs.find(v=>/daniel|david|alex|guy|mark|fred|male/i.test(v.name)&&!/female/i.test(v.name))||vs[2%vs.length];
  return vs.find(v=>/daniel|david|alex|guy|mark|fred|male/i.test(v.name)&&!/female/i.test(v.name))||vs.find(v=>/en-US/i.test(v.lang))||vs[0];
}
async function say(lines){
  if (TTS) {
    try { audioEngine="claude"; await TTS.speak(lines.map(([sp,t])=>({text:t, voice:VOICE[sp]||"buttery", language:"en", rate:0.95}))); return "ok"; }
    catch(e) { const c=e&&e.code; if (c==="viewer_stopped") return "stopped"; if (c==="rate_limited"){ await sleep(1500); return say(lines); } TTS=null; }
  }
  if ("speechSynthesis" in window && speechSynthesis.getVoices().length) {
    audioEngine="browser";
    return new Promise(res=>{ speechSynthesis.cancel();
      lines.forEach(([sp,t],i)=>{ const u=new SpeechSynthesisUtterance(t); u.lang="en-US"; u.rate=0.92; const v=pickVoice(sp); if(v) u.voice=v;
        if(i===lines.length-1){ u.onend=()=>res("ok"); u.onerror=()=>res("ok"); } speechSynthesis.speak(u); }); });
  }
  audioEngine="none"; state.noAudio = true; await sleep(estSec(lines)*1000); return "ok";
}
function stopAudio(){ try{ TTS && TTS.stop(); }catch(e){} try{ speechSynthesis.cancel(); }catch(e){} speakingKey=null; }

/* ---------- listening engine: real pace (≈30 นาที) or fast drill ---------- */
function buildUnits(){
  const units=[], done=new Set(); let last=null;
  for (const it of LISTEN){
    if (it.p!==last){ last=it.p; units.push({type:"dir", part:it.p, first:it.n, lines:[["N",PARTS[it.p].say]]}); }
    if (it.g){ if(done.has(it.g)) continue; done.add(it.g); const ns=LISTEN.filter(x=>x.g===it.g).map(x=>x.n); units.push({type:"q", ns, lines:linesFor(it)}); }
    else units.push({type:"q", ns:[it.n], lines:linesFor(it)});
  }
  return units;
}
function makeEngine(opt, hooks){   // opt: {pace:"real"|"fast", gap, audio:true|false}
  const E = { paused:false, cancelled:false, cur:null, stage:null, gapLeft:0, units: buildUnits(),
    async wait(){ while(E.paused && !E.cancelled) await sleep(150); },
    async countdown(sec){ E.gapLeft=sec; hooks.tick&&hooks.tick(E); let last=Math.ceil(sec);
      while(E.gapLeft>0 && !E.cancelled){ await sleep(200); if(!E.paused){ E.gapLeft=Math.max(0,E.gapLeft-0.2); const c=Math.ceil(E.gapLeft); if(c!==last){ last=c; hooks.tick&&hooks.tick(E);} } } },
    set(n,stage,extra){ E.cur=n; E.stage=stage; E.extra=extra||{}; hooks.item&&hooks.item(E); },
    async run(){
      E.set(null,"intro"); await E.countdown(3);
      for (const u of E.units){
        if (E.cancelled) return; await E.wait();
        const t0 = Date.now();
        if (u.type==="dir"){ E.set(u.first,"dir"); if(opt.audio) await say(u.lines); else await sleep(estSec(u.lines)*1000); if(E.cancelled) return; await E.countdown(2); continue; }
        E.set(u.ns[0],"speak",{ns:u.ns, unit:u});
        if (opt.audio) await say(u.lines); else await sleep(estSec(u.lines)*1000);
        if (E.cancelled) return;
        const used = (Date.now()-t0)/1000;
        const per = opt.gap + (opt.pace==="fast" && u.ns[0]>50 ? 2 : 0);
        for (const n of u.ns){ await E.wait(); E.set(n,"gap",{ns:u.ns, len:per}); await E.countdown(per); if(E.cancelled) return; }
      }
      if (!E.cancelled){ E.set(null,"done"); hooks.done&&hooks.done(E); }
    },
    stop(){ E.cancelled=true; stopAudio(); } };
  return E;
}
function estListenMin(pace, gap){ const us=buildUnits(); let t=3; us.forEach(u=>{ t += u.type==="dir" ? estSec(u.lines)+2 : estSec(u.lines)+u.ns.length*(gap+(pace==="fast"&&u.ns[0]>50?2:0)); }); return Math.round(t/60); }
const gapFor = () => state.sgap;

function newSession(mode, part){

async function loadPaper(st){
  if (st.kind!=="exam") return findPractice(st.setId);

async function enterRoomExam(st){
  if (entering) return; entering=true;

    const set = await loadPaper(st); if(!set){ state.roomErr="โหลดข้อสอบไม่สำเร็จ ลองกดเข้าใหม่"; render(); return; }

    state.view="exam"; render(); tick(); applyRoom(st); presence();
  } finally { entering=false; }
}
function applyRoom(st){
  if (!st) return; const prev=roomState; roomState=st;
  const s=state.session;
  if (state.view==="exam" && s && s.mode==="room" && !s.finished){
    if (st.sid!==s.sid) return;
    if (st.status==="listening"){ s.phase="listening"; s.live.cur=st.item; s.live.stage=st.stage; s.live.gapLeft=st.gapLeft||0; s.live.recv=Date.now();
      if (st.item){ const i=s.list.indexOf(st.item); if(i>=0) s.idx=i; }
      if (s.audio==="each" && st.stage==="speak" && st.item && (!prev || prev.item!==st.item || prev.stage!=="speak")){ const it=ITEMS[st.item-1]; say(linesFor(it)); }
      if (s.audio==="each" && st.stage==="dir" && (!prev||prev.stage!=="dir"||prev.item!==st.item)){ const it=ITEMS[st.item-1]; say([["N",PARTS[it.p].say]]); }
      render(); }
    else if (st.status==="reading"){ if(s.phase!=="reading") startReading(s, st.deadline); else { s.deadline=st.deadline; } }
    else if (st.status==="ended") finish(true,"ผู้คุมสอบสิ้นสุดการสอบแล้ว ระบบส่งคำตอบให้อัตโนมัติ");
  } else if (state.view==="lobby"){
    if (st.status==="listening" && st.audio==="each" && !state.soundOk) return render();
    if (st.status==="listening" && (!prev || prev.sid!==st.sid || !state.session)) enterRoomExam(st); else render();
  }
}

function stimulusHTML(item){
  if (item.p==="R" && item.g){
    const g=GROUPS[item.g], ns=ITEMS.filter(x=>x.g===item.g).map(x=>x.n);
    const head = g.kind==="passage" ? `Questions ${ns[0]}–${ns[ns.length-1]} are based on the following passage.` : g.title;
    const cls = g.kind==="email" ? "box email" : (g.kind==="passage" ? "" : "box");
    return `<div class="card"><div class="stimtitle">${esc(head)}</div><div class="stimulus ${cls}">${esc(g.text)}</div></div>`;
  }
  return "";
}

function liveHTML(item){
  const s=state.session, L=s.live;

  if (s.phase!=="listening") return "";
  let msg, cd="";
  const g = L.cur ? ITEMS[L.cur-1] : null;

  else if (L.stage==="dir") msg="กำลังอ่านคำสั่ง "+PARTS[g.p].name.split(" ").slice(0,2).join(" ");
  else if (L.stage==="speak") msg = g.g ? `กำลังเล่นเสียงข้อ ${ITEMS.filter(x=>x.g===g.g).map(x=>x.n).join("–")}` : `กำลังเล่นเสียงข้อ ${L.cur}`;

  ${state.noAudio && L.cur && L.stage!=="dir" && !(s.mode==="room"&&s.audio!=="each") ? `<div class="script">${esc(scriptText(ITEMS[L.cur-1]))}</div>`:""}`;

function examView(){
  const s=state.session, item=cur(), practice=s.mode==="practice", rev=practice&&s.revealed[item.n];
  const answered=Object.keys(s.ans).length, total=s.list.length;
  const showQ = item.p==="L3"||item.p==="R";
  const firstOfPart = s.list.findIndex(n=>ITEMS[n-1].p===item.p)===s.idx;
  const stim = stimulusHTML(item);
  const opts = item.o.map((t,i)=>{ let c=s.ans[item.n]===i?"sel":""; if(rev){ if(i===item.a)c="right"; else if(s.ans[item.n]===i)c="wrong"; }
    return `<button class="opt ${c}" data-opt="${i}" ${rev?"disabled":""}><span class="k">${"abcd"[i]}</span><span>${esc(t)}</span></button>`; }).join("");
  const isLast = s.idx===total-1, nextDisabled = !canOpen(s.list[s.idx+1]||0);
  const title = s.mode==="practice" ? "ฝึก "+PARTS[s.part].name : s.mode==="sim" ? "จำลองสอบ · "+s.setTitle : "สอบรวม · "+s.setTitle;
  const phaseLbl = s.phase==="listening"?"พาร์ตฟัง":s.phase==="reading"?"พาร์ตอ่าน":s.phase==="wait"?"รอเริ่ม":"";

        : nextDisabled?`<button class="btn" disabled>พาร์ตอ่านเปิดหลังฟังจบ</button>`:`<button class="btn ${practice&&!rev?"":"primary"}" id="next">ถัดไป →</button>`}
    </div></div>`;
  const pal = s.list.map((n,i)=>{ let c=s.ans[n]!==undefined?"done":""; if(practice&&s.revealed[n]) c=s.ans[n]===ITEMS[n-1].a?"r":"x";
    return `<button data-go="${i}" class="${c} ${i===s.idx?"cur":""}" ${canOpen(n)?"":"disabled"}>${n}</button>`; }).join("");
  return `<div class="exambar"><div class="wrap">
    <b>${esc(title)}</b>${phaseLbl?`<span class="pill" style="background:rgba(255,255,255,.12)">${phaseLbl}</span>`:""}

  </div></div>

    <div class="qlayout ${stim?"split":""}">${stim}${qcard}</div>
    <div class="card" style="margin-top:16px;padding:14px 16px"><div class="small muted">ไปยังข้อ</div><div class="palette">${pal}</div>
      <div class="legend"><span>■ น้ำเงิน = ตอบแล้ว</span><span>□ ขาว = ยังไม่ตอบ</span>${practice?"<span>เขียว/ส้ม = ถูก/ผิด</span>":""}${s.phase==="listening"?"<span>ข้อ 61–100 เปิดหลังฟังจบ</span>":""}</div></div>
  </div>`;

/* ================= scoring & diagnosis ================= */
const RCOMP=["RD","RT","RM","RI","RC"], RLANG=["RV","RG"];
function score(s){
  const items=s.list.map(n=>ITEMS[n-1]);
  const r={ total:0, max:items.length, L:0, R:0, lv:{} };
  items.forEach(it=>{ const ok=s.ans[it.n]===it.a; if(ok) r.total++; if(it.p==="R"){ if(ok) r.R++; } else if(ok) r.L++;
    (r.lv[it.lv] ||= [0,0]); r.lv[it.lv][1]++; if(ok) r.lv[it.lv][0]++; });
  r.cefr = r.max===100 ? cefrOf(r.total) : "–"; return r;
}
function diagnose(s){
  const items=s.list.map(n=>ITEMS[n-1]);
  const sk={}, fcs={}, sec={L:[0,0],R:[0,0]}, grp={LIS:[0,0],RLANG:[0,0],RCOMP:[0,0]}; let traps=0, skipped=0, wrong=0;
  items.forEach(it=>{ const a=s.ans[it.n], ok=a===it.a, S=SKILLS[it.sk].sec;
    (sk[it.sk] ||= [0,0,[]]); sk[it.sk][1]++; if(ok) sk[it.sk][0]++; else sk[it.sk][2].push(it.n);
    sec[S][1]++; if(ok) sec[S][0]++;
    const g=S==="L"?"LIS":RLANG.includes(it.sk)?"RLANG":"RCOMP"; grp[g][1]++; if(ok) grp[g][0]++;
    if(!ok){ if(a===undefined) skipped++; else { wrong++; if(/กับดัก|สับสน|แปลตามตัวอักษร/.test(it.w[a]||"")) traps++; }
      if(it.fc){ (fcs[it.fc] ||= {sec:S, ns:[]}).ns.push(it.n); } } });
  return { sk, fcs, sec, grp, traps, skipped, wrong };
}
function skillChip(it){ return `<span class="tag sk">${esc(SKILLS[it.sk].name)}</span>${it.fc?`<span class="tag" style="background:#fff3d6;color:#8a6300">${esc(it.fc)}</span>`:""}`; }
function whyHTML(it,a){
  if (a===undefined) return `<div class="explain"><b>ไม่ได้ตอบ</b> — คำตอบคือ (${"abcd"[it.a]}) ${esc(it.o[it.a])}<br>${esc(it.ex)}</div>`;
  if (a===it.a) return `<div class="explain"><b>✓ ถูกต้อง</b> — ${esc(it.ex)}</div>`;
  return `<div class="explain" style="border-left-color:var(--bad);background:var(--bad-soft)"><b>✗ คุณเลือก (${"abcd"[a]}) ${esc(it.o[a])}</b><br>ผิดเพราะ: ${esc(it.w[a]||"")}</div>
    <div class="explain" style="border-left-color:var(--ok);background:var(--ok-soft)"><b>✓ คำตอบที่ถูก (${"abcd"[it.a]}) ${esc(it.o[it.a])}</b><br>${esc(it.ex)}</div>`;
}
const pctv=v=>v&&v[1]?Math.round(v[0]/v[1]*100):null;
function barRow(label,v){ const p=v[0]/v[1]*100, col=p>=70?"var(--ok)":p>=50?"#d4a017":"var(--bad)";
  return `<div class="bar" style="grid-template-columns:minmax(150px,1.4fr) 1fr 92px"><span>${label}</span><div class="t"><i style="width:${p}%;background:${col}"></i><span class="th" style="left:70%"></span></div><span class="n">${v[0]}/${v[1]} (${Math.round(p)}%)</span></div>`; }

function finish(auto, why){
  const s=state.session; if(!s||s.finished) return;
  if (s.mode==="sim"&&engine){ engine.stop(); engine=null; }
  stopAudio();
  s.finished=true; s.secs=Math.round((Date.now()-s.start)/1000); s.result=score(s);
  const full=s.mode!=="practice";
  const label = s.mode==="sim"?"จำลองสอบ":s.mode==="room"?"สอบรวม":"ฝึก "+PARTS[s.part].name.split(" ").slice(0,2).join(" ");
  const d = diagnose(s);
  const rec={ date:Date.now(), label, mode:s.mode, part:s.part, sid:s.sid||null, setId:s.setId, setTitle:s.setTitle,
    total:s.result.total, max:s.result.max, L:full?s.result.L:null, R:full?s.result.R:null, cefr:s.result.cefr, secs:s.secs,
    sk:Object.fromEntries(Object.entries(d.sk).map(([k,v])=>[k,[v[0],v[1]]])),
    ans: s.list.map(n=>s.ans[n]===undefined?"-":"abcd"[s.ans[n]]).join("") };
  const h=LS.get("history",[]); h.push(rec); LS.set("history",h.slice(-50));
  if (s.mode==="room") saveRemote(rec);          // เก็บข้อมูลเฉพาะการสอบรวม
  presence();
  state.view="result"; state.review.filter="wrong"; state.autoMsg = auto ? (why||"หมดเวลา ระบบส่งคำตอบให้อัตโนมัติ") : ""; render(); window.scrollTo({top:0});
}
let saving=Promise.resolve();
function saveRemote(rec){
  if(!DB||!UID){ state.saveMsg="⚠️ บันทึกผลไปยังผู้คุมสอบไม่ได้ (ไม่ได้เชื่อมบัญชี) — กด 'คัดลอกผลสรุป' แล้วส่งให้ผู้คุมสอบ"; return; }

    catch(e){ state.saveMsg="⚠️ ส่งผลไม่สำเร็จ ("+(e&&e.code||"error")+") — กด 'คัดลอกผลสรุป' แล้วส่งให้ผู้คุมสอบ"; }

  const levelBars=LV.filter(l=>r.lv[l]).map(l=>{ const [c,n]=r.lv[l]; return `<div class="bar"><b>${l}</b><div class="t"><i style="width:${c/n*100}%"></i></div><span class="n">${c}/${n} (${Math.round(c/n*100)}%)</span></div>`; }).join("");
  let rev="";
  if (canReview){

    rev = list.map(it=>{ const a=s.ans[it.n], ok=a===it.a, g=it.g?GROUPS[it.g]:null;

        ${it.p!=="R"?`<div class="script">${esc(scriptText(it))}</div>`:""}${it.p==="R"&&g&&g.kind!=="passage"?`<div class="script">${esc(g.text)}</div>`:""}
        ${it.q?`<div class="qtext" style="font-size:16px;margin:10px 0 8px">${esc(it.q)}</div>`:""}

        ${whyHTML(it,a)}</div>`; }).join("") || `<p class="muted">ไม่มีข้อในหมวดนี้ 🎉</p>`;

/* ================= tutor dashboard (สอบรวมเท่านั้น) ================= */
let tutorRows=null, tutorErr="", tutorSid=null;
function loadTutor(){
  tutorRows=null; tutorErr="";
  if(!DB){ tutorErr="ยังเชื่อมฐานข้อมูลไม่ได้ในมุมมองนี้"; render(); return; }
  const t=setTimeout(()=>{ if(!tutorRows){ tutorErr="ยังโหลดข้อมูลไม่ได้ ลองใหม่อีกครั้ง"; render(); } },10000);
  DB.collection("results").get().then(sn=>{ clearTimeout(t); tutorRows=sn.docs.map(d=>({id:d.id,...d.data()})); render(); })
    .catch(e=>{ clearTimeout(t); tutorErr="โหลดไม่สำเร็จ ("+(e&&e.code||"error")+")"; render(); });
}
function tutorView(){
  let body;
  if(tutorErr) body=`<p class="muted">${esc(tutorErr)}</p>`;
  else if(!tutorRows) body=`<p class="muted">กำลังโหลด…</p>`;
  else {
    const all=[]; tutorRows.forEach(u=>(u.attempts||[]).filter(a=>a.mode==="room").forEach(a=>all.push({...a,name:u.name})));
    const sids=[...new Set(all.map(a=>a.sid))].sort().reverse();
    if (!tutorSid || !sids.includes(tutorSid)) tutorSid = sids[0]||null;
    if (!tutorSid) body=`<p class="muted">ยังไม่มีผลสอบรวม — เปิดห้องสอบรวม แล้วให้น้องๆ เข้าสอบ ผลจะขึ้นที่นี่</p>`;
    else {
      const rows=all.filter(a=>a.sid===tutorSid).sort((a,b)=>b.total-a.total);
      const avg=(rows.reduce((x,a)=>x+a.total,0)/rows.length).toFixed(1);
      const dist={}; rows.forEach(a=>dist[a.cefr]=(dist[a.cefr]||0)+1);
      const fmtSid=s=>`${s.slice(7,9)}/${s.slice(5,7)}/${s.slice(1,5)} ${s.slice(9,11)}:${s.slice(11,13)}`;
      // item analysis
      const set = PRACTICE_SETS.find(x=>x.id===rows[0].setId) || (EXAM_SETS||[]).find(x=>x.id===rows[0].setId);
      let items="";
      if (set){ const st=set.items.map(it=>{ let c=0; rows.forEach(a=>{ if(a.ans&&a.ans[it.n-1]==="abcd"[it.a]) c++; }); return {n:it.n, p:c/rows.length, sk:it.sk}; });
        const hard=st.filter(x=>x.p<0.5).sort((a,b)=>a.p-b.p);
        items=`<h3 style="margin-top:16px">ข้อที่ทั้งห้องพลาดมาก (ถูก &lt; 50%)</h3>${hard.length?`<div class="small">${hard.slice(0,20).map(x=>`<span class="tag no" style="display:inline-block;margin:0 6px 6px 0">ข้อ ${x.n} · ${Math.round(x.p*100)}% · ${esc(SKILLS[x.sk].name)}</span>`).join("")}</div>`:`<p class="muted small">ไม่มี</p>`}`;
        const skAgg={}; rows.forEach(a=>Object.entries(a.sk||{}).forEach(([k,[c,n]])=>{ (skAgg[k] ||= [0,0]); skAgg[k][0]+=c; skAgg[k][1]+=n; }));
        items += `<h3 style="margin-top:16px">ทักษะของทั้งห้อง</h3><div class="bars">${Object.keys(skAgg).sort((a,b)=>skAgg[a][0]/skAgg[a][1]-skAgg[b][0]/skAgg[b][1]).map(k=>barRow(esc(SKILLS[k].name),skAgg[k])).join("")}</div>`;
      } else items=`<p class="small muted">โหลดชุดสอบเพื่อวิเคราะห์รายข้อไม่ได้</p>`;
      body = `<div class="tabs">${sids.map(x=>{ const a=all.find(y=>y.sid===x); return `<button data-sid="${x}" class="${tutorSid===x?"on":""}">${fmtSid(x)} · ${esc(a.setTitle||"")}</button>`; }).join("")}</div>
        <p class="small muted">${rows.length} คน · เฉลี่ย ${avg}/100 · ${Object.entries(dist).map(([k,v])=>k+" "+v+" คน").join(" · ")}</p>
        <table class="hist"><tr><th>อันดับ</th><th>ชื่อ</th><th class="right">คะแนน</th><th class="right">ฟัง/60</th><th class="right">อ่าน/40</th><th>CEFR</th><th>ทักษะที่อ่อนที่สุด</th></tr>
        ${rows.map((a,i)=>{ const w=Object.entries(a.sk||{}).sort((x,y)=>x[1][0]/x[1][1]-y[1][0]/y[1][1])[0];
          return `<tr><td>${i+1}</td><td><b>${esc(a.name||"-")}</b></td><td class="right"><b>${a.total}</b></td><td class="right">${a.L}</td><td class="right">${a.R}</td><td>${esc(a.cefr)}</td><td class="small">${w?esc(SKILLS[w[0]].name)+` (${w[1][0]}/${w[1][1]})`:""}</td></tr>`; }).join("")}</table>${items}`;
    }
  }
  return `<div class="wrap"><div class="card"><div style="display:flex;align-items:center;gap:10px"><h2 style="flex:1">📊 ผลสอบรวม</h2><button class="btn" id="reload">รีเฟรช</button><button class="btn primary" id="home">กลับ</button></div>
  <p class="muted small">เก็บเฉพาะผลจากห้องสอบรวม · การฝึกส่วนตัวของน้องๆ ไม่ถูกเก็บ</p>${body}</div></div>`;
}

  on("#pNew", ()=>{ proctor=null; engine=null; render(); });
  const imp=$("#impSet"); if(imp) imp.addEventListener("change", async e=>{
    const msg=$("#impMsg"); const files=[...e.target.files]; let ok=0, bad=[];

    for (const f of files){ try{ const set=JSON.parse(await f.text());
        if(!set.id||set.kind!=="exam"||!Array.isArray(set.items)||set.items.length!==100) throw 0;
        await DB.doc("examsets/"+set.id).set(set); ok++; }catch(err){ bad.push(f.name); } }

function modal(html,after){ $("#modalBody").innerHTML=html; $("#modal").classList.remove("hide"); document.querySelectorAll("#modal [data-close]").forEach(b=>b.addEventListener("click",closeModal)); after&&after(); }
function closeModal(){ $("#modal").classList.add("hide"); }
document.addEventListener("keydown", e=>{
  if (state.view!=="exam"||!$("#modal").classList.contains("hide")||e.target.tagName==="INPUT") return;
  const k=e.key.toLowerCase(), s=state.session, item=cur();
  if (k.length===1&&"abcd".includes(k)&&!(s.mode==="practice"&&s.revealed[item.n])){ s.ans[item.n]="abcd".indexOf(k); if(s.mode==="room") presence(); render(); }
  else if (e.key==="ArrowRight") go(s.idx+1); else if (e.key==="ArrowLeft") go(s.idx-1);
});

/* ======================================================================
   PROTOTYPE LAYER — รายชื่อกอง + PIN + พัฒนาการรายบุคคล + แดชบอร์ดผู้ติว
   Store ตอนนี้เก็บใน localStorage (ข้อมูลตัวอย่าง) · ภายหลังเปลี่ยนเป็น Supabase โดยคง interface เดิม
   ====================================================================== */
const C1="#2a78d6", C2="#eb6834", C3="#1baf7a", GOOD="#1f8a5b", WARN="#d4a017", BAD="#c2410c";
const SK_ORDER = ["LQ","LP","LG","LI","LN","LF","LD","RV","RG","RD","RT","RM","RI","RC"];
const SK_SHORT = {LQ:"Wh-",LP:"ถอดความ",LG:"ไวยากรณ์(ฟัง)",LI:"สำนวน",LN:"อนุมาน(ฟัง)",LF:"ตอบโต้",LD:"รายละเอียด(ฟัง)",RV:"คำศัพท์",RG:"ไวยากรณ์",RD:"Scanning",RT:"TRUE/NOT",RM:"ใจความหลัก",RI:"อนุมาน(อ่าน)",RC:"ศัพท์ในบริบท"};
const DAY=864e5;
const UNITS=["กองลาดตระเวนและเฝ้าตรวจทางอวกาศ","กองเฝ้าระวังทางอวกาศ","กองปฏิบัติการทางอวกาศ","กองสนับสนุน","แผนกธุรการ"];
async function sha(s){ try{ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }catch(e){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))|0; return "x"+h; } }

const Store = {
  k:"rtafet-proto4:",
  _g(n,d){ try{ const v=localStorage.getItem(this.k+n); return v?JSON.parse(v):d; }catch(e){ return d; } },
  _s(n,v){ try{ localStorage.setItem(this.k+n, JSON.stringify(v)); }catch(e){} },
  roster(){ return this._g("roster",[]); },
  saveRoster(r){ this._s("roster",r); },
  attempts(){ return this._g("attempts",[]); },
  addAttempt(a){ const x=this.attempts(); x.push(a); this._s("attempts",x); },
  tutorPin(){ return this._g("tutorPin",null); },
  async setPin(id,pin){ const r=this.roster(); const m=r.find(x=>x.id===id); if(!m) return; m.pin=await sha(id+":"+pin); this.saveRoster(r); },
  async checkPin(id,pin){ const m=this.roster().find(x=>x.id===id); return m && m.pin===await sha(id+":"+pin); },
  resetPin(id){ const r=this.roster(); const m=r.find(x=>x.id===id); if(m){ delete m.pin; this.saveRoster(r);} },
  vmarks(id){ return this._g("vm:"+id,{}); }, setVmark(id,w,v){ const m=this.vmarks(id); if(v==null) delete m[w]; else m[w]=v; this._s("vm:"+id,m); },
  toggleStar(id){ const r=this.roster(); const m=r.find(x=>x.id===id); if(m){ m.star=!m.star; this.saveRoster(r);} },
  clear(){ ["roster","attempts","tutorPin"].forEach(n=>{ try{ localStorage.removeItem(this.k+n);}catch(e){} }); }
};

/* ---------- demo data ---------- */
async function seedDemo(){
  const ranks=["จ.ต.","จ.ท.","จ.อ.","จ.อ.หญิง","พ.อ.ต.","พ.อ.อ.","ร.ต.","ร.อ.","ร.ท.หญิง","น.ต.","น.ท.","น.อ.","พล.อ.ต.","นางสาว","นาย"];
  const names=[["กิตติ","ใจดี"],["ธนา","ศรีสุข"],["วีรยุทธ","แก้วกล้า"],["ปิยะ","มั่นคง"],["สุรเชษฐ์","บุญมา"],["ณัฐพล","ทองดี"],["อนุชา","พรหมมา"],["ชยพล","วงศ์ใหญ่"],["ศุภชัย","รุ่งเรือง"],["พงศกร","เพชรงาม"],["ธีรวัฒน์","สายทอง"],["วรเมธ","จันทร์เพ็ญ"],["นันทวัฒน์","ดวงแก้ว"],["ภาณุ","สุขสวัสดิ์"],["อรรถพล","ชัยมงคล"],["กฤษดา","ทวีผล"],["จิรายุ","ศักดิ์ดี"],["ปวริศ","นาคสวัสดิ์"],["ธนกร","พึ่งบุญ"],["รัฐพล","อินทร์แก้ว"]];
  const units=UNITS;
  let seed=7; const rnd=()=>((seed=(seed*1103515245+12345)&0x7fffffff)/0x7fffffff);
  const roster=names.map((n,i)=>({id:"M"+String(i+1).padStart(3,"0"), rank:ranks[(i*7)%ranks.length], first:n[0], last:n[1], unit:units[i%units.length], star: i%6===0, type: i===13?"ผู้สนใจ":""}));
  const skTot={}; PRACTICE_SETS[0].items.forEach(it=>skTot[it.sk]=(skTot[it.sk]||0)+1);
  const now=Date.now(), atts=[];
  roster.forEach((m,i)=>{
    const base=0.32+rnd()*0.5, growth=(rnd()-0.2)*0.12, off={}; SK_ORDER.forEach(k=>off[k]=(rnd()-0.5)*0.35);
    off.LI-=0.12; off.RI-=0.1; off.LG-=0.06;            // จุดอ่อนร่วมของกอง (ตัวอย่าง)
    const n=2+Math.floor(rnd()*8); if (i===19) return;   // 1 คนยังไม่เคยทำ
    for(let j=0;j<n;j++){
      const t=j/(Math.max(1,n-1)), d=now-(55-Math.round(t*52)+Math.floor(rnd()*3))*DAY;
      const sk={}; let L=0,R=0;
      SK_ORDER.forEach(k=>{ const p=Math.min(0.97,Math.max(0.05, base+off[k]+growth*j+(rnd()-0.5)*0.15)); let c=0; for(let q=0;q<skTot[k];q++) if(rnd()<p) c++; sk[k]=[c,skTot[k]]; if(SKILLS[k].sec==="L") L+=c; else R+=c; });
      const total=L+R;
      atts.push({memberId:m.id, date:d, mode:j%3===2?"room":"sim", label:j%3===2?"สอบรวม":"จำลองสอบ", setTitle:j%3===2?"ชุดสอบ 1":"ชุดฝึก 1", total, max:100, L, R, cefr:cefrOf(total), sk, demo:true});
    }
  });
  Store.saveRoster(roster); Store._s("attempts",atts); Store._s("tutorPin", await sha("tutor:111111"));
}

function rankGroup(m){ if(m && m.type==="ผู้สนใจ") return RANK_GROUPS[6]; const r=((m&&m.rank)||"").replace(/\s|หญิง/g,"");

const fullOnly = a => a.max===100;
const pctOf = v => v&&v[1] ? v[0]/v[1] : null;
function memberName(m){ return m ? `${m.rank}${m.first} ${m.last}` : "-"; }
const isDone = m => !!m && m.cert==="C1";

function finishLine(D){ const tot=D.finished.length+D.roster.length, pc=tot?Math.round(D.finished.length/tot*100):0;
  return `<div class="card" style="margin-bottom:16px;border:2px solid #c9a227;background:linear-gradient(90deg,#fffaf0,#fff)"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><div style="font-size:34px">🏁</div><div style="flex:1;min-width:220px"><h3 style="margin:0">เข้าเส้นชัยแล้ว ${D.finished.length} จาก ${tot} คน</h3><div class="small muted">ผ่าน RTAFET ระดับ C1 — ไม่ต้องสอบอีก (ไม่นับรวมในสถิติคนที่ต้องพัฒนา)</div>
    <div style="height:12px;background:#f1ece0;border-radius:6px;margin-top:8px;overflow:hidden"><div style="height:100%;width:${pc}%;background:#c9a227;border-radius:6px"></div></div></div><div style="font-size:28px;font-weight:700;color:#8a6300">${pc}%</div></div>
    ${D.finished.length?`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px">${D.finished.map(m=>`<span class="tag" style="background:#fff3d6;color:#5c4300;padding:6px 10px;font-size:13px" title="${esc(m.cert_note||"")}">🏅 ${esc(memberName(m))}</span>`).join("")}</div>`:""}</div>`; }
function memberStats(id){
  const all=Store.attempts().filter(a=>a.memberId===id).sort((a,b)=>a.date-b.date);
  const full=all.filter(fullOnly);
  const last=full[full.length-1]||null, first=full[0]||null;
  const best=full.reduce((m,a)=>!m||a.total>m.total?a:m,null);
  const recent=full.slice(-3); const avg=recent.length? recent.reduce((s,a)=>s+a.total,0)/recent.length : null;
  const sk={}; all.slice(-5).forEach(a=>Object.entries(a.sk||{}).forEach(([k,[c,n]])=>{ (sk[k] ||= [0,0]); sk[k][0]+=c; sk[k][1]+=n; }));
  const delta = full.length>=2 ? last.total-first.total : null;
  const slope = full.length>=3 ? full.slice(-3).map(a=>a.total).reduce((s,v,i,arr)=>i?s+(v-arr[i-1]):0,0)/2 : null;
  return { all, full, last, first, best, avg, sk, delta, slope, lastDate: all.length? all[all.length-1].date : null };
}
function weakSkills(sk, n=3){ return Object.keys(sk).filter(k=>sk[k][1]).sort((a,b)=>pctOf(sk[a])-pctOf(sk[b])).slice(0,n); }

function spark(vals){ if(vals.length<2) return `<span class="muted small">–</span>`; const w=90,h=26,mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;

function unitData(){
  const all0=filteredRoster(), finished=all0.filter(isDone), roster=all0.filter(m=>!isDone(m)), ids=new Set(roster.map(m=>m.id)), atts=Store.attempts().filter(a=>fullOnly(a)&&ids.has(a.memberId));
  const stats=roster.map(m=>({m, s:memberStats(m.id)}));
  const active=stats.filter(x=>x.s.last);
  const now=Date.now();
  // weekly series (8 weeks)
  const weeks=[]; for(let w=7;w>=0;w--){ const end=now-w*7*DAY, start=end-7*DAY; const a=atts.filter(x=>x.date>start&&x.date<=end);
    weeks.push({label:fmtD(end), n:a.length, avg:a.length?+(a.reduce((s,x)=>s+x.total,0)/a.length).toFixed(1):null,
      L:a.length?Math.round(a.reduce((s,x)=>s+x.L,0)/a.length/60*100):null, R:a.length?Math.round(a.reduce((s,x)=>s+x.R,0)/a.length/40*100):null}); }
  // unit skills (latest 5 attempts per member)
  const usk={}, weakCount={}; active.forEach(x=>Object.entries(x.s.sk).forEach(([k,v])=>{ (usk[k] ||= [0,0]); usk[k][0]+=v[0]; usk[k][1]+=v[1]; if(pctOf(v)<0.6) weakCount[k]=(weakCount[k]||0)+1; }));
  const dist={}; active.forEach(x=>dist[x.s.last.cefr]=(dist[x.s.last.cefr]||0)+1);
  const avgLatest = active.length ? active.reduce((s,x)=>s+x.s.last.total,0)/active.length : null;
  const active7 = new Set(Store.attempts().filter(a=>a.date>now-7*DAY&&ids.has(a.memberId)).map(a=>a.memberId)).size;
  const b1plus = active.filter(x=>x.s.last.total>=48).length;
  const watch = active.filter(x=>x.s.last.total<48 || (x.s.slope!=null&&x.s.slope<-3) || (x.s.lastDate&&now-x.s.lastDate>21*DAY)).map(x=>({...x, why:[x.s.last.total<48?"ต่ำกว่า B1":null, x.s.slope!=null&&x.s.slope<-3?"คะแนนลดลง":null, now-x.s.lastDate>21*DAY?"ไม่ได้ฝึก > 3 สัปดาห์":null].filter(Boolean)}));
  const never = stats.filter(x=>!x.s.all.length);
  const improved = active.filter(x=>x.s.delta!=null).sort((a,b)=>b.s.delta-a.s.delta).slice(0,5);
  return {roster, finished, stats, active, weeks, usk, weakCount, dist, avgLatest, active7, b1plus, watch, never, improved};
}

  re("#suGo", async()=>{ const msg=$("#suMsg"); const first=$("#suFirst").value.trim(), last=$("#suLast").value.trim(); let rank=$("#suRank").value; if($("#suF").checked && !/^นา/.test(rank)) rank+="หญิง";
    const interest=(state.suType||"unit")==="interest"; let unit=interest?"บุคคลภายนอก":$("#suUnit").value; if(unit==="__other") unit=$("#suUnitOther").value.trim();
    const p1=$("#suPin").value.trim(), p2=$("#suPin2").value.trim();
    if(!first||!last) return msg.textContent="กรอกชื่อและนามสกุล"; if(!interest&&!unit) return msg.textContent="กรอกชื่อหน่วย";
    if(!/^\d{6}$/.test(p1)) return msg.textContent="PIN ต้องเป็นตัวเลข 6 หลัก"; if(p1!==p2) return msg.textContent="PIN ทั้งสองช่องไม่ตรงกัน";
    if(!Cloud.code) return msg.textContent="ใส่รหัสหน่วยก่อน";
    busy("#suGo",true);
    try{ const r=await Cloud.rpc("rt_signup",{p_code:Cloud.code,p_rank:rank,p_first:first,p_last:last,p_unit:unit,p_type:interest?"ผู้สนใจ":"",p_pin:p1});
      Cloud.setTok(r.token); Cloud.set("role","student"); Cloud.set("mid",r.id); const me=await Cloud.loadMe();
      state.signup=false; state.user={id:me.id, role:"student"}; state.name=memberName(me); state.view="home"; sbRealtime(); render(); window.scrollTo({top:0}); }
    catch(e){ msg.textContent=errTH(e); busy("#suGo",false); } });
  // tutor: change PIN / unit code / refresh / exam set upload
  re("#tPinGo", async()=>{ const p=($("#tNewPin").value||"").trim(); if(!/^\d{6}$/.test(p)) return alertModal("PIN ต้องเป็นตัวเลข 6 หลัก");
    try{ await Cloud.rpc("rt_tutor_set_pin",{p_token:Cloud.tok(),p_pin:p}); alertModal("เปลี่ยน PIN ผู้ติวแล้ว (เครื่องอื่นที่เข้าแดชบอร์ดอยู่จะถูกออกจากระบบ)"); }catch(e){ alertModal(errTH(e)); } });
  re("#ucSet", ()=>modal(`<h3>เปลี่ยนรหัสหน่วย</h3><p class="muted small">รหัสที่กำลังพลใช้เปิดรายชื่อตอนเข้าระบบครั้งแรก (อย่างน้อย 4 ตัวอักษร) — เครื่องที่จำรหัสเก่าไว้ต้องใส่ใหม่</p><input class="text" id="ucNew" value="${esc(Cloud.code||"")}"><div class="navrow"><button class="btn" data-close>ยกเลิก</button><button class="btn primary" id="ucSave">บันทึก</button></div>`,
    ()=>$("#ucSave").addEventListener("click",async()=>{ const c=$("#ucNew").value.trim(); try{ await Cloud.rpc("rt_tutor_set_code",{p_token:Cloud.tok(),p_code:c}); Cloud.code=c; Cloud.set("code",c); closeModal(); render(); }catch(e){ alertModal(e.message==="bad_code_format"?"รหัสต้องยาวอย่างน้อย 4 ตัวอักษร":errTH(e)); } })));
  re("#tRefresh", async()=>{ try{ await Cloud.loadTutor(); render(); }catch(e){ alertModal(errTH(e)); } });
  re("#esUp", ()=>$("#esFile").click());
  const ef=$("#esFile"); if(ef) ef.addEventListener("change", async()=>{ const out=[];
    for(const f of ef.files){ try{ const set=JSON.parse(await f.text()); await Cloud.rpc("rt_tutor_put_examset",{p_token:Cloud.tok(),p_set:set}); out.push("✓ "+(set.title||set.id)); }catch(e){ out.push("✗ "+f.name+" — "+(e instanceof SyntaxError?"ไม่ใช่ไฟล์ JSON":errTH(e))); } }
    EXAM_SETS=null; await loadExamSets(); alertModal(out.join("<br>")); render(); });
  ["#demoReset","#clearDemo"].forEach(s=>{ const el=$(s); if(el) el.style.display="none"; });
};
const roleEl=$("#roleLabel"); const roleNew=roleEl.cloneNode(true); roleEl.replaceWith(roleNew);
roleNew.addEventListener("click", ()=>{ if(!state.user) return; if(state.view==="exam") return alertModal("ออกจากหน้าสอบก่อน"); if(state.view==="proctor"&&proctor&&proctor.st.status!=="ended") return alertModal("สิ้นสุดห้องสอบก่อนออกจากระบบ");
  Cloud.logout(); if(sbChan){ try{ sbChan.unsubscribe(); }catch(e){} sbChan=null; } state.user=null; state.view="home"; state.page="home"; state.viewMember=null;
  Cloud.roster=[]; Cloud.loadPublic().then(render); render(); window.scrollTo({top:0}); });

/* ---------- start ---------- */
(async()=>{
  Cloud.code=Cloud.get("code");
  $("#app").innerHTML=`<div class="wrap"><div class="card waiting"><p class="muted">กำลังเชื่อมต่อระบบ…</p></div></div>`;
  const role=Cloud.get("role");
  try{
    if(Cloud.tok() && role==="tutor"){ await Cloud.loadTutor(); IS_ADMIN=true; loadExamSets().then(()=>render()); state.user={role:"tutor"}; state.name="ผู้ติว"; sbRealtime(); }
    else if(Cloud.tok() && role==="student"){ await Cloud.loadPublic(); const me=await Cloud.loadMe(); state.user={id:me.id,role:"student"}; state.name=memberName(me); sbRealtime(); flushOutbox(); }
    else await Cloud.loadPublic();
  }catch(e){ if(!Cloud.tok()) await Cloud.loadPublic(); }
  render();
})();

</script>
</body>
</html>
